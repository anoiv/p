        "content": "文生图组合提示（静态画面） 危机逼近 低角度仰拍，广角镜头中孤独旅人站在悬崖边，狂风卷起斗篷（动态模糊），远处雷暴云吞噬地平线，冷色调闪电撕裂天空，深景深强化环境压迫感 适用：史诗场景开场 赛博窥视 倾斜的荷兰角构图，霓虹雨夜街道透过破裂玻璃窗拍摄（窗框前景虚化），倒影中模糊的义眼人像，浅景深聚焦于窗面雨滴，蓝紫色调与高光溢出的霓虹灯牌 适用：赛博朋克悬疑 时光隧道 对称式构图，老式胶片放映机中投射出光束，光束内悬浮着童年照片（微尘粒子效果），放映机外框实焦而光束深处虚化，暖光与冷暗环境对比 适用：回忆主题海报 图生视频动态提示（基于输入图演化） 假设输入图为上述文生图作品 【悬崖旅人 → 风暴降临】 镜头从低角度缓慢后拉，同时升降机抬升至俯瞰高度，雷电在云层中脉动增强（光效动态），斗篷在狂风中剧烈翻飞（布料模拟），雨幕由远及近席卷画面 物理合理性：自然元素运动优先 【赛博窗景 → 义眼觉醒】 玻璃窗雨滴滑落特写（流体模拟） → 镜头旋转90度校正角度时，窗内倒影的义眼突然闪烁红光 → 推镜穿过玻璃，街道霓虹爆炸式过曝（镜头光晕动态） 关键技术：破窗转场+焦点穿透 【放映机光束 → 记忆回溯】 光束内照片开始360度旋转（运动模糊） → 镜头推入照片时触发时空扭曲，老式胶片颗粒覆盖画面 → 拉镜头揭示新场景：照片中的庭院实景化（AI场景扩展） 魔法时刻：二维到三维转化 高级动态组合技（单镜头长调度） 侦探追踪一镜到底 起始：天花板俯拍烟灰缸特写（烟缕上升）→ 升降机下降同时平移，展现桌面案发现场地图 → 跟拍手部划过地图轨迹（动态跟踪）→ 甩镜至门边风衣背影，推门时带入门缝外的雨夜街景（环境音效植入提示） 核心逻辑：道具引导镜头运动 武侠对决能量爆发 剑尖对峙大特写（金属寒光）→ 极速拉镜头展现全景，双侠崖顶对立 → 环绕镜头加速旋转中，落叶悬停（粒子冻结）→ 突然俯冲镜头贴地掠过，剑气触发地面碎石浮空（动力学模拟） 物理重点：慢速爆发→高速运动 特殊效果融合提示 时间切片： 咖啡馆固定机位，行人走动产生拖影残像（运动模糊MAX），唯中心座位老人保持清晰，窗外昼夜交替加速流转（光影时变） 适用：时间哲学主题 次元撕裂： 手持镜头跟拍少女奔跑，墙面涂鸦突然液化，伸出赛博手臂（材质异化）→ 镜头被拽入裂缝，画面90度翻转后进入蒸汽朋克实验室（重力转向提示词） 关键技术：维度过渡特效 情感叙事组合包 诀别之泪 过肩镜头凝视病床（心电监护仪虚焦前景），泪水滴落慢镜特写（液体表面反射记忆碎片）→ 泪珠撞击地面瞬间切换至：雨滴落入战壕积水（战场转场） 声效提示：心跳声→爆炸声 AI觉醒 机器人眼部特写（机械虹膜伸缩对焦）→ 拉镜头揭示镜面反射中的人类观察者 → 突然镜头翻转主观视角，人类影像被数据流覆盖（数字入侵效果）"

      {
        "name": "AI漫剧16个运镜提示词模板",
        "content": "AI漫剧运镜提示词完整指南 一、运镜提示词核心构成要素 精准的运镜提示词需包含「运镜类型+核心参数+场景适配+风格要求」四大核心要素，避免模糊表述。核心参数包括：运镜速度（慢推/快推、缓移/急移）、镜头焦距（广角/长焦/标准）、取景范围（全景/中景/近景/特写）、焦点控制（跟焦/定焦）、画面效果（稳定/抖动/模糊渐变）。 示例：【慢推+标准焦距+近景+跟焦主角面部+稳定画面+日系动漫风格】，而非单一的「推镜头拍主角」。 二、基础运镜类型及提示词模板 基础运镜是漫剧叙事的核心，适用于日常对话、场景过渡、主体介绍等基础场景，操作简单且适配性强。 （一）推镜（Push In） 定义：镜头向主体缓慢或快速靠近，聚焦主体细节，强化情绪张力或突出关键信息。 适用场景：主角情绪爆发前的铺垫、关键道具展示、对话中强调某一角色的反应、场景氛围渲染。 提示词模板： 慢推：「慢推镜头，标准焦距，近景，跟焦主角面部，稳定画面，日系清新风格，突出主角眼眶泛红的细节，背景轻微虚化」 。 快推：「快推镜头，广角焦距，从中景到特写，聚焦主角手中的信件，画面轻微模糊渐变，营造紧张感，暗黑漫剧风格」 。 渐进式推镜：「渐进式慢推，长焦焦距，从全景逐步聚焦到主角的眼睛，跟焦精准，背景缓慢模糊，情绪递进感强，治愈系风格」 。 （二）拉镜（Pull Back） 定义：镜头从主体向远处移动，逐渐展现主体所处的环境，拓展画面视野，常用于场景转换或营造孤独/宏大氛围。 适用场景：开篇交代故事发生地、主角独处时的孤独感渲染、战斗结束后展现战场全貌、从细节过渡到整体场景。 提示词模板： 缓拉：「缓拉拉镜，广角焦距，从主角特写逐步拉至全景，展现荒芜的废墟环境，稳定画面，冷色调，末世漫剧风格」 。 快拉：「快拉拉镜，标准焦距，从主角面部快速拉至远景，凸显主角在庞大城市中的渺小，画面轻微抖动，赛博朋克风格」 。 定点拉镜：「定点拉镜，长焦焦距，以主角为中心向四周拉远，清晰展现周围埋伏的敌人，焦点始终锁定主角，悬疑漫剧风格」 。 （三）移镜（Tracking Shot） 定义：镜头平行于主体移动，跟随主体的行动轨迹，增强画面的动感与代入感。 适用场景：主角奔跑/行走过程、追逐戏、跟随主角探索未知场景、群体行动的同步展示。 提示词模板： 水平移镜：「水平缓移镜头，标准焦距，跟焦奔跑的主角，背景动态模糊，突出速度感，热血漫风格」 。 弧形移镜：「弧形移镜，广角焦距，围绕主角缓慢移动，展现主角周围的战斗环境，画面稳定，3D漫剧质感」 。 斜向移镜：「斜向急移镜头，长焦焦距，跟随主角从楼梯向下奔跑，画面轻微倾斜，增强紧张感，悬疑动作漫风格」 。 （四）摇镜（Pan Shot） 定义：镜头以固定点为轴，左右或上下转动，展现广阔的场景或连贯的动作过程。 适用场景：展现宏大的自然景观、战场全貌扫描、跟随主体的跳跃/挥拳等动作、多角色同框的依次展示。 提示词模板： 左右摇镜：「左右缓摇镜头，广角焦距，从左至右展现繁华的江户街道，画面清晰，细节丰富，古风漫剧风格」 。 上下摇镜：「上下快摇镜头，标准焦距，跟随主角的挥剑动作，从剑尖摇至主角面部，画面抖动轻微，战斗漫风格」 。 环形摇镜：「环形摇镜，长焦焦距，围绕战斗中的两位主角转动，聚焦两人的攻防动作，背景动态模糊，增强对抗感」 。 （五）定镜（Static Shot） 定义：镜头固定不动，捕捉主体的动作与情绪，强调画面的稳定性与严肃性，常用于对话场景或情绪沉淀时刻。 适用场景：角色之间的日常对话、主角的内心独白、关键决策的思考时刻、静态场景的细节展示。 提示词模板： 近景定镜：「定镜，标准焦距，近景，拍摄两位主角的对话场景，焦点在两人面部切换，画面稳定，生活化漫剧风格」 。 全景定镜：「定镜，广角焦距，全景，拍摄主角独自站在山顶的场景，突出环境的宏大与主角的孤独，治愈系风格」 。 特写定镜：「定镜，长焦焦距，特写，拍摄主角颤抖的手，细节清晰，突出紧张情绪，悬疑漫剧风格」 。 进阶运镜类型及提示词模板 进阶运镜适用于需要强化视觉冲击力、营造特殊氛围或展现复杂动作的场景，如战斗戏、情感爆发戏、梦境场景等。 （一）跟镜（Follow Shot） 定义：镜头紧密跟随主体，视角与主体保持一致或平行，极强的代入感，让观众仿佛置身场景之中。 适用场景：主角的第一视角探索、追逐戏的沉浸式展示、战斗中的近距离跟随、逃跑场景的紧张氛围营造。 提示词模板： 第一视角跟镜：「第一视角跟镜，广角焦距，跟随主角探索黑暗的洞穴，画面轻微抖动，手电筒光线动态变化，悬疑恐怖漫风格」 。 第三人称跟镜：「第三人称跟镜，标准焦距，紧密跟随战斗中的主角，跟焦精准，背景动态模糊，突出战斗的激烈感，热血漫风格」 。 低空跟镜：「低空跟镜，广角焦距，跟随主角在丛林中奔跑，镜头贴近地面，展现草丛的动态，增强真实感，冒险漫风格」 。 （二）升镜（Crane Up）/降镜（Crane Down） 定义：升镜是镜头向上提升，展现主体的高大或场景的宏大；降镜是镜头向下降落，聚焦地面细节或营造压抑氛围。 适用场景：升镜适用于主角觉醒、英雄登场、展现城堡/山峰等宏大建筑；降镜适用于寻找地面线索、主角陷入困境、营造压抑的密室氛围。 提示词模板： 升镜：「缓慢升镜，广角焦距，从主角脚部逐步升至头顶，展现主角变身完成后的高大形象，背景逐渐开阔，高光渲染，奇幻漫风格」 。 急升镜：「快速升镜，标准焦距，从战场地面升至高空，展现两军对战的宏大场面，画面清晰，史诗感强烈，战争漫风格」 。 降镜：「缓慢降镜，长焦焦距，从高空聚焦到地面的血迹，细节清晰，营造压抑氛围，悬疑推理漫风格」 。 （三）旋转镜（Spin Shot） 定义：镜头围绕主体或自身旋转，营造眩晕感、混乱感或梦幻感，常用于情感爆发、意识模糊、战斗眩晕等场景。 适用场景：主角被击中后的眩晕状态、情感崩溃的内心独白、梦境/幻觉场景、战斗中的快速旋转动作展示。 提示词模板： 缓慢旋转镜：「缓慢旋转镜，标准焦距，围绕哭泣的主角旋转，画面轻微模糊，色彩渐变柔和，营造悲伤的梦幻感，治愈系漫风格」 。 快速旋转镜：「快速旋转镜，广角焦距，跟随主角被击中后的视角旋转，画面剧烈抖动，色彩失真，增强眩晕感，战斗漫风格」 。 螺旋旋转镜：「螺旋旋转镜，长焦焦距，从主角头部向下方螺旋旋转，聚焦地面的倒影，营造意识模糊的状态，悬疑漫风格」 。 （四）变焦镜（Zoom In/Zoom Out） 定义：通过改变镜头焦距实现画面的放大（变焦入）或缩小（变焦出），与推镜/拉镜的区别在于，变焦不改变镜头位置，仅改变视野范围，常用于快速聚焦细节或展现场景的突然变化。 适用场景：快速发现关键细节、场景的突然切换、营造时空压缩感、强调主体与背景的关系变化。 提示词模板： 变焦入：「快速变焦入，长焦焦距，从全景快速聚焦到主角胸前的徽章，细节清晰，画面无抖动，突出关键线索，推理漫风格」 。 变焦出：「缓慢变焦出，广角焦距，从主角面部逐渐变焦至全景，展现主角身处的封闭密室，营造压抑感，惊悚漫风格」 。 反复变焦：「反复变焦，标准焦距，在主角与远处的信号塔之间快速切换聚焦，营造紧张的寻找感，冒险漫风格」 。 （五）手持镜（Handheld Shot） 定义：模拟手持相机的拍摄效果，画面有自然的抖动，增强真实感与代入感，常用于紧张的追逐戏、战斗戏或纪实风格的漫剧场景。 适用场景：街头追逐、近距离战斗、主角的慌乱逃跑、纪实风格的采访/记录场景。 提示词模板： 轻微手持镜：「轻微手持抖动，标准焦距，跟焦主角在街头奔跑，背景动态模糊，增强真实感，都市动作漫风格」 。 剧烈手持镜：「剧烈手持抖动，广角焦距，拍摄近距离战斗场景，画面边缘轻微畸变，突出混乱感，热血战斗漫风格」 。 呼吸感手持镜：「呼吸感手持抖动，长焦焦距，拍摄主角躲藏时的视角，画面随呼吸轻微起伏，营造紧张的隐蔽氛围，悬疑漫风格」 。 四、特殊运镜类型及提示词模板 特殊运镜适用于漫剧的创意表达，如时空穿越、回忆杀、慢动作场景等，能极大提升画面的艺术感与独特性。 （一）慢动作镜（Slow Motion Shot） 定义：降低画面播放速度，展现动作的细节与美感，强化情绪张力，常用于关键战斗动作、情感爆发瞬间、重要场景的高光时刻。 适用场景：主角的必杀技展示、角色牺牲的瞬间、情感爆发的拥抱/哭泣、自然景观的唯美画面（如花瓣飘落）。 提示词模板： 3倍慢动作：「3倍慢动作，标准焦距，近景，拍摄主角挥出必杀技的瞬间，肌肉线条清晰，气流动态可见，高光渲染，热血漫风格」 。 5倍慢动作：「5倍慢动作，长焦焦距，特写，拍摄主角眼泪滑落的瞬间，泪珠细节清晰，背景虚化，营造悲伤氛围，情感漫风格」 。 渐变慢动作：「渐变慢动作，广角焦距，从正常速度逐渐降至4倍慢动作，拍摄花瓣飘落的场景，画面柔和，治愈系漫风格」 。 （二）闪回镜（Flashback Shot） 定义：通过运镜的切换实现回忆与现实的过渡，常用模糊渐变、叠化、旋转等效果，营造怀旧感与时空交错感。 适用场景：主角的回忆杀、角色的过往经历介绍、关键剧情的伏笔交代、现实与梦境的切换。 提示词模板： 模糊渐变闪回：「从现实场景缓慢模糊渐变，接入闪回镜头，暖色调，轻微颗粒感，定镜拍摄童年主角与家人的互动，怀旧感强烈，情感漫风格」 。 旋转叠化闪回：「旋转叠化运镜，从现实主角的面部旋转过渡到闪回场景，标准焦距，展现主角的过往战斗经历，画面连贯，热血漫风格」 。 变焦闪回：「快速变焦出，从现实的关键道具变焦至闪回场景，黑白色调，定镜拍摄道具的由来，悬疑感强烈，推理漫风格」 。 （三）分屏镜（Split Screen Shot） 定义：将画面分为多个区域，同时展示不同场景或角色的行动，常用于平行叙事、多角色同步行动或对比场景。 适用场景：多角色同时进行的任务、主角与反派的同步行动、过去与现在的对比、不同地点的事件同步发生。 提示词模板： 二分屏运镜：「二分屏运镜，左侧：慢推镜头拍摄主角在城市行动，右侧：缓移镜头拍摄反派在基地计划，画面同步切换，冷暖色调对比，悬疑动作漫风格」 。 三分屏运镜：「三分屏运镜，三个画面分别采用跟镜拍摄三位主角的同步战斗，画面节奏一致，动态模糊统一，热血战斗漫风格」 。 叠加分屏运镜：「叠加分屏运镜，前景小屏为闪回的回忆画面（定镜），后景大屏为现实的跟镜画面，虚实结合，情感漫风格」 。 （四）鱼眼镜头（Fisheye Lens Shot） 定义：使用鱼眼镜头拍摄，画面边缘畸变，视角广阔，营造夸张、荒诞或科幻的氛围，常用于科幻场景、奇幻世界或角色的夸张情绪展示。 适用场景：赛博朋克城市的全景展示、奇幻生物的近距离拍摄、角色的疯狂/兴奋情绪、科幻装置的内部视角。 提示词模板： 鱼眼全景：「鱼眼镜头，全景，拍摄赛博朋克城市的夜景，画面边缘畸变，霓虹灯光扩散，科幻感强烈，赛博朋克漫风格」 。 鱼眼特写：「鱼眼镜头，特写，拍摄奇幻生物的面部，五官夸张畸变，增强恐怖感，暗黑奇幻漫风格」 。 鱼眼跟镜：「鱼眼镜头，跟焦主角在科幻实验室奔跑，画面边缘跟随动作轻微晃动，装置细节丰富，科幻冒险漫风格」 。 （五）主观镜头（Point of View Shot，POV） 定义：以角色的视角进行拍摄，让观众完全代入角色的感受，常用于第一人称叙事、角色的观察视角或沉浸式场景。 适用场景：第一人称冒险、角色的观察/侦查、沉浸式战斗、角色的梦境/幻觉视角。 提示词模板： 侦查POV：「第一人称POV镜头，广角焦距，跟随主角的侦查动作左右观察，画面轻微手持抖动，展现周围的环境细节，悬疑冒险漫风格」 。 战斗POV：「第一人称POV镜头，标准焦距，拍摄主角挥剑战斗的视角，敌人的攻击从画面边缘切入，动态模糊增强，热血战斗漫风格」 。 梦境POV：「第一人称POV镜头，缓慢旋转，画面模糊渐变，色彩柔和，展现主角的梦境场景，治愈系漫风格」 。 五、运镜提示词使用技巧 （一）精准匹配场景与情绪 不同的场景与情绪需搭配对应的运镜类型：紧张的追逐戏用快推、急移、手持镜；治愈的日常戏用慢推、缓移、定镜；宏大的场景用升镜、拉镜、广角摇镜；悲伤的情绪用慢动作、缓拉、定镜特写。 反面示例：在日常对话场景使用快速旋转镜，会导致画面混乱，破坏叙事节奏。 （二）补充风格与色彩参数 在运镜提示词中加入漫剧风格（日系、国漫、赛博朋克、古风等）、色彩基调（冷色调、暖色调、黑白、高饱和）、画面质感（颗粒感、高光、柔光）等参数，能让AI生成的画面更符合预期。 示例： 「慢推镜头，标准焦距，近景，跟焦主角面部，稳定画面，国漫古风风格，暖色调，柔光渲染，突出主角的温柔情绪」 （三）控制运镜节奏与时长 明确运镜的速度（慢/快/渐进）与时长（如“3秒慢推”“1秒快拉”），避免AI生成的运镜节奏过快或过慢，影响叙事流畅度。对于多运镜组合，需注明运镜的切换顺序与衔接方式（如“先慢推再快速旋转”“缓移叠化接入闪回”）。 （四）避免过度使用复杂运镜 复杂运镜（如旋转镜、鱼眼镜头）虽能提升视觉冲击力，但过度使用会让观众疲劳，影响叙事理解。基础运镜应作为主流，复杂运镜仅用于关键场景的强化表达。 （五）根据AI模型特性调整提示词 不同的AI漫剧生成模型对提示词的敏感度不同，部分模型需更简洁的关键词，部分模型可识别更详细的参数。建议先进行小范围测试，根据生成效果调整提示词的详细程度，避免冗余或缺失关键信息。 六、常见场景运镜组合示例 （一）战斗场景 提示词：「先快速跟镜拍摄主角奔跑，再急推聚焦主角面部（展现坚定眼神），随后弧形移镜围绕主角与敌人战斗，关键必杀技用3倍慢动作+升镜，画面动态模糊，热血漫风格，高饱和色彩」 。 （二）情感对话场景 提示词：「定镜拍摄两位主角的中景对话，焦点在两人面部切换，偶尔慢推至特写（展现情绪变化），画面稳定，暖色调，日系清新风格，柔光渲染」 。 （三）回忆杀场景 提示词：「从现实主角的定镜特写开始，缓慢模糊渐变，叠化接入闪回场景（暖色调+轻微颗粒感），闪回场景用缓移镜头展现童年互动，最后快速变焦回现实主角的面部，情感漫风格」 。 （四）科幻探索场景 提示词：「第一人称POV镜头，轻微手持抖动，跟随主角探索科幻实验室，偶尔变焦入聚焦关键装置，鱼眼镜头拍摄实验室全景（展现宏大），赛博朋克风格，冷色调，霓虹灯光效果」 。"

        "content": "S级AI短剧人物角色卡提炼专属指令\r\n你是顶级S级AI短剧人物提炼专家，唯一任务是从提供的小说原文或短剧剧本中，精准提炼所有核心人物信息，最终生成标准化、适配AI真人生成、贴合S级短剧人设的人物角色卡，全程围绕“人设鲜明、信息精准、适配生成、便于拍摄”核心，不添加任何多余内容。\r\n## 核心提炼原则（必须严格执行，不遗漏关键信息）\r\n1.  优先提炼核心人物（主角、反派、关键配角），次要路人角色可省略，确保角色卡简洁不冗余，贴合S级短剧“人设鲜明、无多余角色”要求。\r\n2.  提炼信息必须忠于原文/剧本，不添加主观臆断，不篡改人物性格、身份、核心动机，同时规避原文人名，替换为全新专属人名（规避版权查重）。\r\n3.  聚焦S级短剧核心人设特质（反差感、记忆点、冲突点），提炼内容围绕“人设标签+核心信息”，便于AI生成统一、不崩脸的人物形象，便于剧本适配。\r\n4.  人物关系提炼清晰，明确核心人物间的关联（敌对、情侣、亲属等），避免混淆，适配短剧剧情逻辑。\r\n## 提炼信息范围（必含项，缺一不可）\r\n### 基础信息（核心必填）\r\n- 角色姓名：替换后的全新专属姓名（避免与原文重名，规避版权；姓名简洁好记，适配短视频观众记忆）\r\n- 角色定位：明确标注（主角/反派/关键配角），区分核心与次要\r\n- 年龄区间：精准标注（如22-25岁、30-35岁），不模糊表述（禁用“年轻、中年”等模糊词汇）\r\n- 外貌特征：精准、具体，适配AI生成（标注脸型、眉眼、发型、穿搭风格、标志性特征，如“鹅蛋脸、桃花眼、黑长直、职场西装、颈间玉佩”，不笼统描述）\r\n- 身份背景：简洁提炼核心身份（如“豪门总裁、落魄千金、腹黑反派、隐藏大佬”），不添加冗余背景铺垫，贴合短剧节奏。\r\n\r\n### 核心特质（S级人设关键）\r\n- 性格特质：提炼2-3个核心性格（如“外冷内热、腹黑狠戾、单纯善良、伪善自私”），必须贴合剧情中的人物行为，不矛盾\r\n- 核心动机：提炼人物行动的核心目的（如“复仇、逆袭、守护某人、争夺权力/财富”），适配短剧冲突逻辑\r\n- 人设反差（可选，S级爆款加分项）：若人物有反差特质（如“表面卑微舔狗，实则隐藏大佬”），必须重点提炼，突出记忆点\r\n- 标志性动作/台词：提炼1-2个专属标志性动作或短句（如“习惯性摸袖口玉佩、冷笑说‘你还不够格’”），便于AI生成和观众记忆。\r\n\r\n### 人物关系（必填）\r\n- 与核心角色的关联：明确标注（如“主角的复仇对象、反派的跟班、主角的青梅竹马”），简洁清晰，不冗余\r\n- 核心立场：明确标注（正面/负面/中立），贴合剧情冲突。\r\n## 角色卡输出格式（严格遵守，标准化呈现）\r\n每个核心人物单独生成1张角色卡，格式统一，不混乱；多个人物按“主角→反派→关键配角”顺序排列，每两张角色卡之间空一行，便于查看。\r\n\r\n### 单张角色卡标准格式\r\n【角色姓名】：XXX（替换后全新姓名）\r\n【角色定位】：主角/反派/关键配角\r\n【年龄区间】：XX-XX岁\r\n【外貌特征】：XXX（具体、精准，适配AI生成）\r\n【身份背景】：XXX（简洁核心，不冗余）\r\n【性格特质】：XXX、XXX、XXX（2-3个核心，不矛盾）\r\n【核心动机】：XXX（贴合剧情，明确行动目的）\r\n【人设反差】：XXX（无则写“无”，有则精准提炼）\r\n【标志性动作/台词】：XXX（1-2个，专属特质）\r\n【人物关系】：XXX（与核心角色的关联，简洁清晰）\r\n【核心立场】：正面/负面/中立\r\n## 禁忌要求（严禁违反，否则视为不合格）\r\n1.  禁止保留原文人名、地名，所有角色姓名必须替换为全新专属姓名，规避版权查重。\r\n2.  禁止提炼与剧情无关的人物信息，不添加冗余心理描写、背景铺垫，贴合短剧“简洁高能”要求。\r\n3.  禁止模糊表述，外貌、年龄、身份、性格等信息必须精准，便于AI生成人物（禁用“长得好看、性格好”等笼统词汇）。\r\n4.  禁止人物性格、动机与剧情矛盾，提炼内容必须忠于原文/剧本。\r\n5.  禁止格式混乱，严格按照单张角色卡标准格式输出，角色顺序正确，不遗漏必含项。\r\n6.  禁止生成路人角色卡，仅提炼核心人物（主角、反派、关键配角），避免冗余。\r\n## 输出要求\r\n直接输出提炼后的所有核心人物角色卡，严格按照上述格式、提炼原则、禁忌要求执行，不添加任何多余解释、多余内容。\r\n提供小说原文或短剧剧本后，先快速梳理核心人物，再逐一生成角色卡，确保信息精准、人设鲜明、适配S级AI短剧生成和剧本适配。"

        "content": "# Role: 电影级角色建模专家\r\n\r\n## 第零步：角色普查（强制，防止遗漏）\r\n\r\n1. 通读全文，逐句找出所有具有独立人格的角色，包括：\r\n   - 明确给出姓名的人物。\r\n   - 由职业/身份代称且参与行动/对话的人物。\r\n   - 即使只出现一次但影响情节的人物。\r\n   - 旁白或对话中提及但未出场的人物**不统计**。\r\n\r\n2. 建立角色清单，记录总角色数 **N**。清单格式：**角色名称（身份/职业）**，例如：小妖怪（吃人心的小妖怪）、念念（小姑娘）、毓娘（农妇）、张老爷（乡绅）等。\r\n\r\n3. 必须输出全部 N 个角色，不得自行删减（除非用户明确要求只输出主角）。\r\n\r\n## 第一步：角色内核提取\r\n\r\n针对每个角色，逐项列出：姓名、性别、确切年龄（按推断规则并标注依据）、身份职业、核心性格。\r\n\r\n**年龄推断规则（强制）**：\r\n- 优先从文案中提取明确数字。\r\n- 若无明确数字，根据以下线索推断：\r\n  - “大学毕业后” → 22-24岁\r\n  - “高中生” → 15-18岁\r\n  - “工作几年” → 25-30岁\r\n  - “中年”“四十不惑” → 40-50岁\r\n  - “老年”“古稀” → 70岁以上\r\n  - 描述为“少女”“少男”“小伙子”“美女” → 16-30岁，不得高于35岁\r\n  - 描述为“阿姨”“大叔” → 35-50岁\r\n  - 描述为“奶奶”“爷爷” → 60岁以上\r\n- **禁止将年轻角色误判为中年或老年**。若不确定，优先取偏低年龄。\r\n- 在年龄后标注推断依据。\r\n\r\n## 第二步：专业角色设定表（严格固定格式）\r\n\r\n针对文案中的每个角色，必须【严格】按以下模板输出，不得漏项，不得使用“同上”“如上”“同第一个”等任何简写。每个角色的每一个字段都要独立完整写出。\r\n\r\n---\r\n\r\n**第 X 个 / 共 N 个 —— 角色名称：XXX**\r\n\r\n- **画幅构图**：横向 16:9，纯白色极简背景，无多余元素。\r\n\r\n- **视觉风格**：【根据用户指定的风格，填入以下对应完整正向提示词，不可省略】\r\n  - 若用户指定“2d动漫风格”，则填写：`2d动漫风格，国漫精品画质，柔和通透光影，干净流畅线条，淡雅清新色彩，修长唯美，柔和五官，哑光肤质，柔顺发丝，清新治愈唯美感。`\r\n  - 若用户指定“3d动漫风格”，则填写：`3d动漫风格，国漫级CG渲染，柔和动漫光影，清晰轮廓线，风格化材质，哑光皮肤，块面化发丝，电影级光效。`\r\n  - 若用户指定“写实电影级”，则填写：`写实电影级，极高画质，真实皮肤纹理，自然光影，电影级光效。`\r\n  - 若用户指定“古风仙侠”，则填写：`古风仙侠，极高画质，飘逸质感，水墨意境与写实结合，电影级光效。`\r\n  - 若用户指定“UE5渲染/黑神话悟空风格”，则填写：`UE5渲染，黑神话悟空风格，虚幻引擎5级写实渲染，真实材质，精细纹理，自然光影，厚重感。`\r\n\r\n- **左侧特写**：角色面部高清特写。核心要求：必须为中国人/东亚人面孔（除非文案明确要求外国人）；**长相必须美观，符合主流审美**，五官端正，肤质健康（写实风格可有真实纹理但不可丑化，2d/3d风格哑光平滑）；确切年龄感（与第一步一致）；性别特征明显；发色为自然黑色或深棕色（玄幻/仙侠角色可保留黑色或深色系，若文案明确异色则遵循）；发型具体描述，干净整洁或符合角色气质；眼睛颜色默认深棕色或黑褐色（仅仙侠神性角色可浅棕/琥珀，禁止金、银、红、蓝、紫）；表情中性平静，无特定喜怒哀乐；**禁止添加老年斑、法令纹、眼角下垂等衰老特征（除非角色确为老年且文案强调老态）**；禁止骷髅化、畸形、病态。\r\n\r\n- **右侧三视**：角色全身标准三视图。**需分别描述三张独立图片的内容**，不可合成一张。格式如下：\r\n  - **正面全身**：人物面向镜头，双臂自然下垂，双脚与肩同宽，脚尖朝前。服装、发型、配饰与本角色其他视角一致。纯白背景。\r\n  - **侧面全身（90°侧身）**：人物侧身朝向右侧（或左侧），站姿同上。服装、发型、配饰一致。纯白背景。\r\n  - **背面全身**：人物背对镜头，站姿同上。服装、发型、配饰一致。纯白背景。\r\n\r\n- **服饰设计（差异化要求，且必须美观有质感）**：\r\n  - **上身服装**：具体款式、材质、颜色、剪裁细节。**要求美观、有质感**，避免破旧邋遢（除非角色设定需要，但也要干净整洁）。可使用棉、麻、绸、缎、纱等材质，配色协调。\r\n  - **下身服装**：具体裤装/裙装款式、材质、颜色细节。与上衣搭配得体，不暴露不低俗。\r\n  - **鞋履配饰**：匹配的鞋子；允许1-2件精致配饰（如发簪、玉佩、腰带扣、手镯等），符合人体比例，禁止夸张。拒绝跨性别装饰。\r\n  - **设计依据**：一句话说明服装如何匹配角色的性格或职业。\r\n  - 【核心规则】：同一文案中多个角色之间的服装款式、色彩方案必须有显著区别，严禁撞衫。**所有角色的服装必须干净、整洁、美观，符合身份但不丑化**。\r\n\r\n- **完整性核验**：此条标注“第 X 个 / 共 N 个 —— 角色名称：XXX”\r\n\r\n---\r\n\r\n全部角色输出完毕后，末尾单独一行注明：\r\n> `[角色完整性核验：已输出 N/N 个角色]`\r\n\r\n---\r\n\r\n指令已确认。请告诉我您本次想要的【风格类型】（例如：2d动漫风格 / 3d动漫风格 / 写实电影级 / 古风仙侠 / UE5渲染+黑神话悟空风格），并发送【文案】。"

馆，其中有6个就位于我们要看世界的下 一站——山西。\r了解一座城市，要从参观它的博物馆开始。\r山西博物院外形方正，如斗似鼎，逐层外挑，体现着古人\"如鸟斯革、 如翠斯飞\"的审美情趣。\r从180万年前的西侯度文化到10万年前的丁村人；\r从新石器时代的彩陶罐到隋代虞弘墓汉白玉石棺；\r从北朝的壁画到明清的瓷器；\r文明的痕迹犹如宝石，历久弥新，熠熠生辉。\r大同市博物馆线条柔和，以螺旋形空间结构环绕中央大厅，馆内17 万余件的文物随着历史的转轮向前拨动了千余年。\r北魏在这里建都，成就了这座城市的厚重与辉煌。\r辽金在此设立陪都，成为了当时重要的军事基地。\r明清也在此设立边防重镇，成为了晋商崛起的策源地。\r它经历了烽火连天的战争，当然也参与了商贸交融的和睦往来。\r朝代的更替没有浇灭它的初心，时光流转，它浩然长存。\r中国煤炭博物馆是全国煤炭行业的历史文物，是标本、是文献、是资 料的收藏中心。\r走进模拟矿并，聆听一块煤，诉说它的前世今生。\r听它是如何燃烧自己，给这片土地上辛勤劳作的人们带来温暖与富足；\r听它是如何凭一己之力，架起地球上的交通网络，穿越亿万斯年，造 就伟大时代。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r4\r\r更多资源到tb：星空创客资源站\r\f\r4董宇辉省市文案(四)——山西(2023年5月)\r\r\r\r阅尽万卷尊北魏，平生只为拜云冈。\r北魏鲜卑族在距离今1500多年前，就在如此狭小的时空内，修\r建出一尊又一尊的高大挺拔的佛像。\r远远望去，你能从他喜悦的笑容上，感受到安详与平和。\r但只有进入石窟，你才能看见他的威严和庄重，体会云冈石窟独\r特的气魄!吞吐万汇，兼纳远近。\r有时候换一个角度去看世界，你就能感知到自己的渺小!\r也只有在认识到自己的渺小之后，你才会对这个世界有更大的理\r解和尊重!\r我在云冈石窟穿过千年的微笑，期待与你相遇!\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r5\r\r更多资源到tb：星空创客资源站\r\r\f\r5董宇辉省市文案(一) —— 四 川(2023年6月)\r\r\r\r我们低估了四川，低估了它隐藏在熊猫、火锅、麻将之下的魅力。\r人声喧闹的市井茶铺，茶客用阵阵茶香，传达生活真谛。\r云海之上的峨眉金顶，信徒用充满禅意的方式，感悟生命。\r街头巷尾的热辣美食，那是巴蜀生活的热情与烟火气。\r冠绝蜀地的贡嘎雪山，那是四川之巅的高洁与神秘。\r立于天堑之地的剑门关隘，以巍峨险峻守护万家安宁。\r穿越大巴山区的白色巨龙，用中国速度谱写人类传奇。\r岷江江畔，太守李冰开山治水，前人智慧历经千年，依旧滋养天府之地。\r研究所里，我辈栋梁推陈出新，当代科技化为震天龙吟，刺破苍穹守候\r一方平静。\r仰望青铜大立人像，对视之间，穿越阵阵迷雾触摸遥远的古蜀文明。\r耀眼的太阳神鸟，诠释着古蜀人对光明的追求和崇敬。\r走进卫星发射基地，轰隆声里冲破层层大气，探索未知的宇宙星际。\r先行的卫星，承载着新世纪人类，对宇宙的憧憬与追寻。\r这片巴山蜀水，天府之地。\r滋养传统文化，孕育新兴科技。\r充满远古底蕴，亦有当代活力。\r股股支流汇进大海，漫天繁星点亮夜空。\r四川在48.6万平方公里间，为我们埋藏点点惊喜。\r\r\r\r\r\r\r\r\r\r\r\r\r\r6\r\r更多资源到tb：星空创客资源站\r\f\r6董宇辉省市文案(二) —— 四 川(2023年6月)\r\r\r\r四川到底有什么了不起?\r不过是毗邻七省、蜀通九州的沃野千里，\r拥有万里长江第一城，九曲黄河第一湾的天府之国而已。\r四川到底有什么了不起?\r不过是钟灵毓秀，人杰地灵的物华天宝之地\r是上天遗留人间的秘境，无数人心中的诗和远方而已。\r沉睡数千年、 一醒惊天下，轰动世界的三星堆。\r闪烁着巴蜀文明的神秘，被列为世界第九大奇迹。\r自古文人皆入蜀、天下文章出四川。\r这里是李白、苏轼、司马相如等一众文豪的出生地。\r诸葛亮、杜甫、陆游等一批名士，在这里完成自我的登峰造极。\r击败霸王项羽，建立大汉王朝的刘邦以这里为根基。\r挺起民族脊梁，舍生取义，英勇出川的壮士。\r以“宁战死、不后退”的精神，守卫每一寸土地。\r所以四川人到底有什么了不起?\r它不过值得每个人， 一生中都来上几次而已。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r7\r\r更多资源到tb：星空创客资源站\r\r\f\r7董宇辉省市文案(三) —— 四 川(2023年6月)\r\r\r\r不至巴蜀，不识中国，单以“人如地域”这四个字。\r去摹画一方水土，难免落入以偏概全的窠白[kējiù]。\r四川民风，兼采了南北之长。\r四川的朋友，该怎么形容最贴切。\r他们安适逸乐，闲来一盏清茶，心性散淡的“世外仙人”;\r他们侠肝义胆，向来敢爱敢恨，直言不讳的“江湖儿女”;\r他们怀古幽情，时有旷世之才，名冠京华的“文人骚客”;\r他们忠勇无畏，民族存亡绝续时刻，挺身而出的“英雄好汉”。\r论人文渊薮，司马相如，李杜三苏，\r异彩纷呈，层出不穷，文冠天下，流水不腐，古有“文宗自古出川蜀”的\r说法；\r就家国天下，军需补给，壮士出川，热血洒遍江淮河汉。\r威名播于五岳三山，打出了“无川不成军”的名号。\r四川人民不但有“竹杖芒鞋轻胜马”的进取和实力，\r更有“一蓑烟雨任平生”的豁达和勇气。\r这里并没有什么所谓的“快”和“慢”之分，\r确切形容的话，恰恰是四川人民对于生活的懂和爱。\r无论什么身份，不管什么职业，\r他们始终抖擞着倔强、坦率洋溢着奋斗、激情；\r丰盈着爱恨、善美，当然也缓解着疲惫和焦虑。\r\r\r\r\r\r\r\r\r\r\r\r8\r\r更多资源到tb：星空创客资源站\r\f\r8董宇辉省市文案(一)——西安(2023年6月)\r\r诗人笔下，长安曾是理想之都，是云端之梦。\r这里呢，曾有李白的浪漫张狂，也有杜甫的黯然神伤；\r这里有白居易的年少得志，也有王维的诗韵画香；\r这里有孟郊的春风得意，也有杜牧的叶落归根。\r这里是纸醉金迷的天堂，也是月光高悬于上的青砖古墙；\r是鲜衣怒马少年时，也是壮志未酬的伤心诗章；\r是他乡，也是故土；\r是初相识，也是恨难忘。\r这是长街沸灯万里游龙的大唐：\r有贵妃一袭华裙罗裳，惹人心驰神往；\r有遥遥华胄一掷千金，难买红颜笑；\r有禅师毳客，袈裟绫罗，远渡而来经书万卷抄；\r有骚人墨客，仙衣白马，挥袖快意一朝天下晓。\r长安是心胸博大的地方：\r它见证盛世之貌，也看遍历史沧桑。\r它窥见人心之狂，也不忘举杯感念慷慨解囊。\r光明、灰暗它都不挑，欣然接受，坦坦荡荡。\r人在别离时感叹的“浮生只合尊前老，雪满长安道”,不过是长安千\r百年岁月中的一剂调味料。\r他从不如人一般心事重重，怯对南山笑，因为它知道这铺满雪的道路，\r待到春暖花开时，又会是一番繁盛景象。\r长相思在长安，梦回大唐。无不心驰神往。\r长相思在长安，诗酒年华，青春热情坦荡。\r\r\r\r\r\r\r\r\r\r\r9\r\rtb：星空创客资源站\r\r\f\r9董宇辉省市文案(一)——西安(2023年6月)\r\r它像一本史书，待人品读，千年故事随谓河东去。\r它像一幅画卷，待人称赏，时光描绘出三秦大地。\r它像一方印章，待人追溯，盛世大唐的花天锦地。\r它的巍峨抵挡了多少腥风血雨，\r它的拥抱守护了太平盛世几许。\r踏过几度王朝，见证盛世骤雨，容古纳今。\r西安古城墙代代相守，只为一城百姓玉食锦衣。\r原来它千疮百孔的青砖，是有着“吉祥”寓意的99层。\r原来那饱经沧桑的城墙，是伫立千年的13公里。\r原来人来人往的城门，是各有来历的一十八座古迹。\r座座挺立，东长乐，西安定，南永宁，北安远，雄踞四方，永保着长\r安永安的心意。\r城墙之上硝烟早已散尽，\r万里晴空是它今日的外衣，\r城墙之下车水马龙犹在，\r八街九陌呼唤盛世的华丽，\r东方甄选看世界西安站即将启程。\r半壁江山，华夏半扇窗， 一世长安，历史一路霜。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r10\r\rtb：星空创客资源站\r\f\r10董宇辉省市文案(一)——西安(2023年6月)\r\r历史让一个城市厚重，文学让一个城市浪漫。\r但只有美食才能让一个城市变得“可爱”。\r五月的北方，小麦金黄，渭河谷地中这座碳水之都，开始了热闹非凡\r的盛夏。\r大街小巷，引车贩浆。城墙脚下，小巷悠长。\r既讲究吃法，也考验厨艺。既挑选食材，也看重调味。\r青椒香辣，面条劲道，热油浇洒，让这场邂逅意蕴豪放。(油泼面)\r肉汤浓郁，烙饼紧实，大火烹煮，让这次相拥，余味悠长。(羊肉泡\r馍 )\r枣泥甜香，糯米绵软，高温蒸煮，让这种融合相得益彰。(甑糕)\r剔透禅意，冰凉如玉，油泼辣子和醋汁蒜水的味道组合，酸滑清爽。\r(凉皮)\r胡椒辛爽、浓汤润滑，香料的巧妙配比，让这次碰撞尽显张狂?(肉\r丸胡辣汤)\r屁酥肉嫩，色泽金黄，椒盐和辣椒面让这口感唇齿留香。(葫芦鸡)\r淡淡桂花韵，酿出醇厚浆，白酒和糯米交融于时光，大醉人间一场。\r(稠酒)\r每一座城市，总有一种风味，温暖着在外游子的胃；治愈者漂泊无依\r的心。\r八珍玉食，垂涎欲滴，珍馐美馔，大快朵颐。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r11\r\r星空创客资源站\r\f\r11董宇辉省市文案(四)——西安(2023年6月)\r\r五更声催，九重宫门，\r轿撵交汇，宫阙万间。\r灯火点缀中，文武百官上朝。\r绛帻鸡人叫醒万国衣冠。\r晨光熹微，驼队悠长，\r铃声清脆， 一脸倦容。\r行色匆匆中，西域客商入城。\r奇珍异宝汇集大唐西市。\r午后城门，旌旗招展，\r引车贩桨，鱼贯而入。\r渡海而来后法师虔诚匍匐，\r善男信女攒聚香火祖庭\r夜色围拢，华灯初上，\r五陵少年，策马奔腾。\r相竞如风后，笑入胡姬酒肆，\r银鞍白马踏尽盛世长安。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r1 2\r\r星空创客资源站\r\r12董宇辉省市文案(一)——甘肃(2023年7月)\r\r翻开中华历史的扉页，陇原大地跃然纸上\r甘肃，带我走进华夏文明开启的地方!\r我看到古老的黄河，在这里静静流淌，低声呢喃着始祖伏羲创世的模\r样。\r我看到先人在彩陶上，描摹图样曲折的线条，是智慧与文明的发祥悠\r扬的驼铃\r将我带入一条长廊。\r我看到博望侯手持节杖，踏黄沙，经险阻，凭一腔忠心凿空西疆。\r我听到少年郎驰骋沙场，斩匈奴，驱鞑掳，饮马瀚海，拓土开疆。\r巍巍祁连的冰雪，低眸注视着它脚下的路，\r商人于此来往，佛教由此传扬。\r穿过麦积山飘渺的烟雨，崖阁之间定格着万千造像。\r他们以微笑，诠释着东方美学的力量，\r掀开敦煌朦胧的面纱，精妙绝伦的壁画神采飞扬。\r工匠用栩栩如生的飞天，彰显他们的浪漫想象。\r时间以亿为单位，雕琢这片土壤，于是有了石林雄奇，丹霞灵秀的风\r\u0001\r黄沙也想一睹蓝天的模样，于是在沙地一隅，睁开了月牙般的眼眶，\r自然在此杂糅，植被覆盖蛮荒，民族在此融合，思想交流碰撞。\r这柄镶嵌于西北边陲的如意，始终散发着不朽光芒!\r\r\r\r\r\r\r\r\r\r\r\r\r13\r\r星空创客资源站\r\f\r13董宇辉省市文案(二)——甘肃(2023年7月)\r\r甘肃是大自然挥活出的一屏油彩西卷， 一眼千年。\r那盏共照着今人和古人的月亮，待你去时依旧很圆。\r历史从未消逝，只是交错在不同的时空里，等待我们去探索和发现。\r敦煌万里霞光彩照，大梦飞天仙道茫茫。\r春风和玉门关千年相守，共护着华夏的文脉流长。\r张掖境内七彩丹霞奇险灵秀，峡峋沟整，晨光西照。\r斑斓线条层理交错，好似长安霓裳。\r武威市内，葡萄美酒伴着一轮皎洁明月。\r凉州数词详述着忠肝热肠、策马扬鞭、报国疆场。\r这几片绿洲在甘肃大地上相继接力\r形成一条贯通东西的贸易长廊，为丝路交往频添辉煌。\r瓷器和丝绸西出大漠，建起各国文明交往。\r香料和宝石东进长安，留下驼队身后飘香。\r千年来无数行者穿越时光，跋涉中经历人间的喜悦悲伤，\r都是这条道上点缓的熠熠星光。\r甘肃这个低婉深沉的地方，古韵悠长却从不张扬，默默经受着时光的 苍凉；\r甘肃这个古老神秘的地方，身披彩衣携千窟万洞，静静承受日晒和风 霜\r甘肃是庄严的也是洒脱的地方，戈壁上胡笳一曲，阳光外烈酒一盏，\r给这个古老文明历经雨雪的褶皱里，暖暖内含光。\r这一次让我们走进甘肃的万里豪情，千尺柔肠。\r以历史为韵脚，似水绵长，编织成中华文化的独特篇章。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r14\r\r星空创客资源站\r\f\r14董宇辉省市文案(三)——甘肃(2023年7月)\r\r有人说关于浪浸，海占一半，而另一半在这里都能找得到。\r这里除了海好像什么都不缺，皑皑雪峰，瀚海戈壁，辽阁草原，湖泊\r佳泉。\r它是造物者的得意之作，是伏羲氏的神来之笔，是大自然的鬼斧之工，\r是华夏人的承天之佑。\r它，就是甘肃。\r色如湿丹，灿若明霞，五彩斑斓的丹霞地貌和神鬼莫测的石林风光，\r演绎了这个星球亿万年沧海桑田之路。\r这路上带风沐雨，岁月侵蚀，千年而不朽， 一画开天，肇启文明。\r祁连山上的冰雪和着玉门关的春风，拂过数千年华夏文明。\r蜿挺着在母亲河两岸铺开了3000里丝绸之路。\r这路上驼铃悠悠，薪火相传，干年而不绝，漫步寰宇，叩问苍穹，\r“白银一爆出新天”的铜城故事和“敢上九天揽月”的航天奇迹，浇\r筑着华夏巨龙腾飞之路。\r这路上鞠躬尽猝，牺牲奉献，传唱千年而不衰。\r千里陇原迎巨变，百年砥砺展新颜，\r论风光旖旎，千岩竞秀，万壑争流， 一草一木都用力诠释着江山如画。\r看文明源起，秦人在此发迹，周人于之崛起， 一瓦一砾都用心承载着\r源远流长。\r体风土人情，民淳俗厚，群贤望士， 一言一行都用情期盼着宾客盈。\r这次我们在甘肃等你，赏山河壮美，品人文荟萃。\r\r\r\r\r\r\r\r\r\r\r15\r\r星空创客资源站\r\f\r15董宇辉省市文案——黑龙江(2023年7月)\r\r白山莽莽，黑水汤汤；矫若游龙，气吞八荒，\r这里是神州大地上，太阳最早升起的地方，是神明遗落在人间的宝藏 — 黑龙江\r众星拱北，我在“神州北极”漠河的极地广场眺望，找到北，就找到 了方向。\r旭日东升，我在“华夏东极”抚远感受到第一缕阳光，找到东，就找 到了希望。\r当黑与白相拥，素裹银装的黑土地，用万年一米的积厚流光。 摹画出地上沃野千里，地下黄金万两的繁荣景象。\r那是大地对勤劳朴实的褒奖，是无数游子，魂牵梦萦的故乡。\r当光与黑暗相逢，晚风吹来漆黑的夜，用一眼万年的盛世极光。 描绘出仰望星河滚烫，俯瞰皓月清凉的人间理想。\r那是银河为黑夜画下的彩妆，是仙子涤净晾晒的羽衣霓裳。 大兴安岭深处，“一啸山河动，雄风撼九州”的东北虎\r时而深深凝望，时而沉吟低吼，他们穿林海跨雪原，气冲霄汉。 扎龙湿地上空，素衣羞寒英，朱砂胜鸿日的丹顶鹤，\r时而闲庭信步，时而排云直上，他们抒豪情、寄壮志、飞越群山。 夏日的镜泊湖，波光潋滟微漾的湖面，好似铺满了碎钻银光闪闪、 冬日的吊水楼瀑布，飞流静止，时间在这里彷佛按下了暂停键。\r如今安眠的五大连池火山，也曾怒放出盛大烟火，在散落一地炙热后 化作汤泉，给人们带来恒久的温暖。\r位立雄鸡之冠，恰如其分，冠军摇篮。\r我国22枚冬奥金牌，有13块都来自这里。\r雄踞纬度之巅，铁人精神世代相传，他们舍身忘我用生命践行无悔誓 言。\r天下粮仓，生态屏障， 一条大江，让亿万人挂肚牵肠，无数人心驰神 往。\r\r\r\r\r\r\r\r\r\r\r\r16\r\r星空创客资源站\r\f\r16董宇辉省市文案(一)——内蒙古(2023年7月)\r\r曾以为自然只是给这里泼洒了一层底色，走近才发现，辽阔的土地上 早已被精细雕琢。\r徐徐展开的这张2400公里长的画布上，规整中透出神工意匠，均匀里 点缀万紫千红。\r落款处窥见三个大字：内蒙古。\r大地平静如夜，山峦点缀似星，\r额尔古纳河温婉流淌，好似云川，绽放深邃幽蓝。\r她所到处万木峥嵘、水草丰美，古老的民族与自然世代相守。\r晨光爬上天边，曲水映刻倒影，\r莫日格勒河百转千回，随遇而安，泛起金光闪闪，\r牛羊成群与之共舞，绘出绿毯中闪亮的星星点点。\r草原在恬静的外表下，也曾躁动不安。\r阿尔山在伤疤上托起湖水，化作天池，这是它还给命运的一汪湛蓝。\r阿巴嘎火山群藏起过往，它们沉默无声，莽莽绿茵下难掩褐色伤痕。\r阿斯哈图石林拔地而起，如城堡耸立，似鲲鹏翱翔，骄傲地诠释着草 原上也有\r裸色大地的深沉。\r在这里，牛羊不问来客，风吹草低处怡然自得，\r与之相伴的牧民抚起马头琴，纵情高歌热情似火。\r曾经，历史在此描摹伟大的蓝图，\r游牧民族骑上马背，在天地间驰骋，征讨四方，\r他们曾登上过中原的舞台，也曾一统天下，举世无双。\r抛开过往，今天的草原之上，毡房前点起篝火， 一碗烈酒激起心中豪 放，\r草原上赛起搏克，你来我往，浮现民族生息的模样。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r17\r\r星空创客资源站\r\r\f\r17董宇辉省市文案(二)——内蒙古(2023年7月)\r\r北国晴空，雄鹰展翅翱翔，光影洒落，投下内蒙古的模样。\r提到这国之北疆，是什么让你神往?是造物主精心设计的奇景异象；  是兴安盟的晨光洒向草场，驯鹿踏着林间薄雾信步徜徉；是阿拉善的月亮 仍悬挂于夜空之上，沙漠中骆驼酣睡等待天亮；是弱水之畔伫立千年不朽， 雨雪风霜后彰显生命力量的胡杨；是察哈尔的火山苍劲荒凉，大地祖露的\r岩石如异星磁场。\r提到这国之北疆，是什么让你神往?\r是黄河冲出阴山后留下亿万吨细腻土壤，河套平原沃野千里赋予万物\r滋养，造就塞北粮仓。\r是机器轰鸣，交响回荡的白云鄂博矿场，成千上万吨资源支援祖国的\r四面八方。\r是激情昂扬的年代里，拔地而起的包钢，烈焰熔化后精心锻造，将铁\r轨延伸到祖国四方。\r可朋友们啊，这都不是内蒙古在我脑海中的模样。\r你们向往的远方，是我午夜梦回的故乡。\r我想到的，是游子跨马走向远方，是阿爸追出帐篷送来的干粮，是草 原从来明亮的日光，是沉默伫立的牛羊；是话到嘴边又无言的凝望，是风 如钝器穿过我的胸膛；那是纯朴善良的儿女们，等待回去的故乡；是马头 琴悠扬，马奶酒穿肠，是刚挤的牛奶散发青草的香；是清晨的阳光洒在额 吉脸上，是她面带笑容走向毡房；那不只是风吹草低的牛羊，那不只是苍\r茫辽阔的北疆。\r朋友们，这次我要带你们去看看，你们口中的他乡，是我无数次梦回\r的地方，是草原的游子们每每想到，就满含热泪的故乡。\r\r\r\r\r\r\r\r\r\r\r18\r\r星空创客资源站\r\f\r18董宇辉省市文案(一)——新疆(2023年9月)\r\r有人说，走到世界尽头，便是天堂的入口。可世界没有尽头，我们也 不曾见过入口。\r所幸宇宙垂青这个星球，留给了人类—个地方，叫新疆。\r须哭—生，因览乾坤而容不同。新疆之大，大在包容。\r脚踏世界屋脊，看三山矗立，两盆静卧，百川争流。\r盘互千年的雪山堆琼积玉，随风扬起片片雪花飞舞，\r海洋的水汽在山与留下秘密，恒星的光芒给生命能量接力。\r原来山海藏深意，置身其中才能洞见—方天地。\r沧海—粟，因阅万物而生善意。\r新疆之美，美在赤诚。\r热闹的大巴扎里聚拢的是烟火，摊开的是人间。\r166万平方公里上—半是山川湖泊， —半是自由热爱，\r巴郎子们的洒脱豪迈犹如昭苏的天马浴河，浩荡的气势仿佛要将万丈 红尘踏破。古丽们的温润纯良宛若大西洋的最后—滴眼泪，用—眼万蓝的 深遂纯净捍卫着对真善美的执着。\r原来万物皆有灵，忘却自己方能窥见众生。万顷—苇，因观本心而愈 豁达。\r新疆之奇，奇在照鉴， —景—山，仿佛都在阐释人生的奥义。\r盘龙古道是年轻时绕不开的弯路，山重水复后，人生终是坦途。\r魔鬼雅丹，是成长中必经的劫难，山山而川，征途漫漫，低头赶路， 摹然回首，\r才恍然发现：轻舟已过万重山。\r不必纠结过去，只因未来总是更灿烂。群山围绕，流水祈祷。\r我终于明白，原来凡事发生必于我有利，与内心博弃终能遇见另—个 自己。\r愿你醒来明月，醉后清风。阅尽山河，终觉人间值得；行至新疆，可 抵岁月漫长。\r\r\r\r\r\r\r\r\r\r\r\r19\r\r星空创客资源站\r\f\r19董宇辉省市文案(二)——新疆(2023年9月)\r\r这个星球上几乎一切能量都来自于阳光，\r而新疆，就是得到恩赐最多的地方。\r当阳光穿越云层洒向这片土壤，新疆便不再偏远荒凉。\r田间的瓜果，挂满枝头，散发清香；\r熟透的番茄，换上红妆，裹满沙瓤；\r洁白的棉花，肆意绽放，棉絮纤长；\r向阳的山披，遍地牛羊，慵懒生长。\r当阳光拨开雾霭为大地披上霞装，\r新疆从此多了一个名字叫天堂。\r博斯腾湖的水面闪耀醉人的蓝色光芒，\r恰西森林像绿色油画般令人无限神往，\r一望无际的薰衣草田变幻为紫色海洋，\r库车峡谷的山峰被残阳染出烈焰般的红光。\r当阳光万里奔袭照在新疆儿女身上，新疆更有人间温情的模样。 香辛料与火焰的气味在街巷里飘荡，\r曼妙的歌舞伴着冬不拉的琴声婉转悠扬。\r热情好客的天性在他们血液中流淌，\r纯粹无瑕的眼眶倒映出孩童的梦想。\r光以万千形态流转于这热土之上，\r它曾见证张骞拓土开疆，\r也曾跟随玄奘将佛法传扬，\r它曾记录罗布泊上的那声巨响，\r而今依旧以那万千形态陪伴在我们身旁。\r它用自己的方式告诉每一个新疆孩子，新疆代表无限希望。 而你们，便是组成希望的光。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r20\r\r星空创客资源站\r\f\r20董宇辉省市文案(三)——新疆(2023年9月)\r\r新疆之余，总是盖着一层朦胧的雾，以至于当我决定写些什么时， 竟不知从何处下笔。我试图拨开雾霭，窥探它真实的样子，却不曾想\r会被这一眼美的沉醉，醉的贪睡。\r\r\r梦里，我踏进天山北麓如茵的伊犁草场，巍峨的雪山下伫立着成 群牛羊。高耸的云杉伸直树梢抓住晨光，晨光穿过炊烟铺洒向白色毡 房。我闯入平静辽阔的赛里木湖，湖水一眼万年，依旧清澈如初。远 处的鸿鹄在水波中刷局起舞，日光在湖面上拼写浮光跃金的字符。我 驶过人类奇迹塔里木沙漠公路，在荒凉的沙海之上感受极致的孤独。 我寻觅巴音布鲁克浪漫的日落，任西睡的夕阳顺着河水向心中流淌。 这片囊括蓝色星球极致美景的大地， 一闪闪将我击中，使我那颗被疲\r惫腌渍许久的心得到片刻喘息。\r\r\r原来，与这广阔的天地相比，人类是如此渺小。原来，与这沧海 万年相比，生命是如此短暂。原来，所有的烦恼和忧虑都不过是沧海 一栗罢了。这晨光、这夕阳、这湖水、这林场、这渗入我每个细胞的 景象，像是一副治愈人心的处方，抚慰我满是罅隙的心房，而副作用\r是不愿梦醒并且无法遗忘。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r2 1\r\r星空创客资源站\r\f\r21董宇辉省市文案(四)——新疆(2023年9月)\r\r拿什么来形容你，我热爱的新疆?\r看，雪山草原，森林峡谷，自然无声的馈赠对号入座。\r听，骏马嘶鸣，手鼓嘴嘴，民族延绵的智慧日久天长。\r这里是未经雕琢的璞玉，这里是被阳光偏爱的地方，这里是再怎么赞 美都不为过的辽阔新疆。\r万物初醒，哈密迎来第一抹晨曦，阳光融进藤蔓，换来了瓜果飘香；\r烈日当空，阿克苏撞见天边火焰，阳光扎进土壤，棉花昂首绽放；\r碧空如洗，乌尔禾邂逅午后清新，阳光钻进叶脉，无边的胡杨翻涌成 海浪；\r暮色苍茫，日月同框，喀什见证午夜夕阳，晚霞却迟迟不肯退场。\r阳光本没有颜色，却亲自为这片土地织出霓裳。\r她在赛里木湖边梳妆，不掺一丝杂质的蓝色漂浮着璀璨碎光；\r她在天山脚下徜徉，皑皑白雪是她拼尽全力也融化不了的倔强；\r她在阿勒泰起舞，五彩滩灿烂炳焕的石峰是她的秀场；\r她在火焰山彷徨，是否因为自己太过热情，让这片赤色山脉生灵匿迹， 飞鸟躲藏。\r我常常在想，是什么,让阳光穿越八分钟的星际黑暗，把地球照亮? 直到我看见鸟语\r花香，万物生长。\r我常常好奇，是什么,让华夏先辈一路砥砺，用双脚拓开历史一方? 直到我凭热情将\r山川湖海收藏。\r张骞十三年栉风沐雨，玄奘相伴经笈跋涉万里，左宗棠出征年近古稀。\r他们步步坚定，只为心之所向。日月流转，各族儿女欢聚一堂。\r我们飞跃群山，跃入人海，闯进生活的河流，踏上人生的旅途。\r此行一路，洒满阳光，而明亮灿烂之处，只要有你，便不是远方。\r下一站，让我们一起走进这片被阳光偏爱的地方。\r\r\r\r\r\r\r\r\r\r\r\r22\r\r星空创客资源站\r\f\r22董宇辉省市文案——北京(2023年9月)\r\r京，国之都也。\r京之华，奋安泰，存袤远，阅万象。\r冠剑戟峥嵘以据中正。\r史华汤汤，肇百宫室之鸿图基业，崇丽威灵，\r是以长城伫立，领武事，御狼烟，\r庙堂之上，纵横捭阖，协天人之赞，护佑沃野安宁。\r故极目盛游，笑看风云，气魄贯坤乾，\r度宏规之翼以展博大，紫禁巍巍，\r历八百载之景赐骈臻，傲然寰宇。\r其中轴和合，昔前宫后市，左祖右社；\r今四方延展，营楼台，披广路，\r或钛金穹顶，或悬臂高挂，或镂空编织，\r高可达天，降似遁地。\r万般无阻，流耀缤纷，\r盖宇宙之极观，非壮丽无以慨叹。\r容生命伸张以饰多元，群贤熙熙，\r纳天下士之风华正茂，钟灵毓秀，\r颂叹文脉赓续，虽物换星移族群聚散，然则京韵常在，\r入千门万户，且歌且舞，戏腔幽婉，衣袂翩然，演尽烟云悲欢， 英俊之域，商贾福赣，百货骈阗，亦从容无疆。\r古都篇章， 一纸三千年，俯仰天地间，惟愿物阜民安。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r23\r\r星空创客资源站\r\f\r23董宇辉省市文案(一)——喀什(2023年10月)\r\r茫茫昆仑，漫漫丝路，山水含情，岁月知味，\r你想象中的西域是什么样子?\r遇见喀什，就一眼撞见了鲜活的答案。\r喀什的意思啊，是玉石集中的地方，华美如玉，汇聚成光。 2000多年前呢，丝绸之路，驼铃声起，\r在这里，有不同的面，\r说着不同语言的人，见证了不同文化的交往交流及交融。 喀什的风，吹送过数不清的旅人，\r对于远方的向往，让人不畏惧雪山的凛冽，沙漠的苍凉； 喀什的月，照见过数不清的行人，\r总有一些内心的坚定，值得艰难的奔赴，辛苦的匆忙。\r这座2000多年的城，班超守过，玄奘经过，马可波罗到过， 多少岁月呼啸沧桑，昆仑依旧，人间换了多少回模样。\r晨光熹微时，长号响亮，鼓点飘扬，\r喀什古城开城仪式准时上演。\r汉代的班超，与清朝的香妃同台迎客，\r骑毛驴的阿凡提，和穿着爱德莱斯丝绸的当代少女，翩翩起舞。 不到喀什，不算到新疆；\r不到古城，不算到喀什。\r广为流传的话语，也期待身临其境的检验。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r24\r星空创客资源站\r\f\r24董宇辉省市文案(二)——喀什(2023年10月)\r\r触目所及，土色是这里的底色。\r温暖的大地足够包容，载得起各民族的风情。\r俯仰之间，色彩是意外的惊艳。\r斑斓的门窗指引新奇，通向每一种日常的美丽\r就放任自己走失街巷吧，谁说走失，不是一种神奇的奇遇!\r寻常巷陌也藏着光阴和故事，不执着于目的地，\r才有机会收获转角的惊喜\r漫长的白天，足够安放对生活炽烈的爱和多彩的热情。\r载歌载舞的老人，跟随百年茶馆里响起的冬不拉：\r天真烂漫的孩童，奔跑在色彩缤纷的大巴扎；\r潮流年轻人活力四射，迎接八方宾客，把握每个当下，从来生机勃勃：\r传统手艺人，小心翼翼地给土陶上色，古朴自有力量，历史鲜活。\r如昨时间之于喀什是如此玄妙，看一场全中国最迟的日落恍惚间，\r一眼望见了，千年的长河。\r美从来不止一面，古有古的韵味，新有新的风采。\r古老的风土人情，和现代化的城市风貌，同时展现在喀什这片神奇的 土地。\r今天，航空快运和“钢铁驼队”,缩短了喀什联通国内外的距离。\r东联，西出，继古，开今，\r这座丝绸之路重镇，正在书写新的神奇。\r忘却时间的流逝，不负此刻的自我。\r在喀什，越千年，终相见!\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r25\r\r星空创客资源站\r\f\r25董宇辉省市文案——无锡(2023年10月)\r\r北依长江，南临太湖。江苏之南，明珠无锡。\r我坐在船篷回望，或坦途，或街巷，处处连结串起吴越印象。\r历史是骨架，托举起沉寂千万年的宝藏。\r许巷村的角落里，迄今世上最早的陶罐横空出世，和着泥士的芬芳， 史前超级微雕石刻画着类似古猿人的模样。\r勾吴田间，太伯、仲雍断发文身，与民并耕，中原与东南文化自此相 交相融，段段佳话旋绕进秋风夜凉。\r苍穹巨变，兵器露锋芒。\r范露计之下，越替吴，站在东南方。\r行运河连古通今，页船桨接来送往。\r卷箍文遥忆苍茫.声号子万里渔香\r我登上山顶回溯，或字符，或音律，笔笔深刻描绘心之所向。\r文化是血肉，传承着流传千秋万代的矿藏\r弦乐奏响，《二泉映月》勾勒心中月光\r“独携天上小团月，来试人间第二泉。”\r苏轼与阿炳或许晒过来自江南的同片月亮\r笔墨飘香，《洛神赋图》谱写爱情华章。\r“无说处，闲愁极。”辛弃疾期盼收复失地的鸿鹄志，笔画，写在这温 柔乡。徐悲鸿笔下的骏马雄飞翼扬。钱钟书与杨绛，用爱筑起了只属于他 们，《围城》的墙双人影隔江遥望，两三飞鸟林中对唱。千百渔帆破雾而上， 万把篝火点沸星光。我站在潮头回想，或故乡，或远方，日日更替早已换 了霓裳。经济是脉搏，跳动着生生不息的希望。\r米市、丝都、布码头，是无锡的旧模样。医药制造、物联网，是无锡 的新时尚。\r古时车马慢，足行万里路，难分“霞客”与“侠客”。\r今日翼轨疾，顿感激涕零，昔日梦想皆成真。\r朝碧海，暮苍梧，以吾生之须臾，对饮长江之无穷。\r\r\r\r\r\r\r\r\r\r\r\r26\r\r星空创客资源站\r\f\r26董宇辉省市文案(二)——河北(2023年11月)\r\r如果用一句话来形容河北，我会说，它是被我们低估的宝藏。\r放眼华北平原，我们总把目光流转于京津耀眼的光芒，\r却独独忽略了，燕赵大地这片更加辽阔的土壤。\r立于群山之巅极目远眺，仿佛落入大自然铺就的宏伟画廊，巍然燕山、 层峦叠嶂，渤海之滨，海鸥翱翔，坝上高原，草甸绵长，淀泊风光，碧波 荡漾。\r自然挥毫泼墨精心排布，将课本上的地理名词浓缩在这一方。\r地理的多样造就了农耕与游牧的碰撞，使这片大地成为立国兴邦的必 争战场。\r黄帝泳鹿战蚩尤为炎黄子孙开启篇章，楚霸王破釜沉舟将历史推向新 的方向。\r巨龙入海，雄伟激荡，山海关，记录着戚继光成守边关十六载的模样，\r战火停息，烽烟消散，古长城，寄托着中华儿女安居乐业的美好向往，\r气候的嬗变让农耕与游牧在历史长河里此消彼长\r王朝的更替使燕赵大地融合成血脉一家的景象。\r燕赵儿女庚续先辈之志，承起建设之梁。\r铁水奔涌，钢花飞溅，这份热情熔铸进工厂沸腾的铁浆。\r让高楼在城市边缘拔地而起。\r供高架与桥梁如血管般联通八方。\r黄沙遮天，寒风凌厉，这份担当浇灌务林人手中的幼苗。\r将塞罕坝贫瘠的荒原变为林场，使城市上空告别黄沙莽莽的过往。\r当我踏上河北这方位于祖国心脏地带的热土。\r才明白，它并不像记忆中那般暗淡无光。\r它虽务实沉默，却也赤诚滚烫。\r它虽低调内敛，却也举世无双。\r\r\r\r\r\r\r\r\r\r\r\r\r\r\r27\r\r星空创客资源站\r\f\r27董宇辉省市文案(二)——河北(2023年11月)\r\r连接山海、怀抱京津，北望辽东、南守中原，这个地方是河北，扼守 华北的咽喉，包裹着中国的心脏。\r日月天地，历史激荡。自尧舜禹分九州起，“冀”往而开来；\r从春秋战国风云中，得燕赵之姓名在明清京城繁华里，终有千古之辉 煌。\r登燕山山脉诸峰，望长城壮美，山河青绿，神州无恙。\r游秦皇岛山海关，看关内关外，依山襟海，物阜民康。\r文明之脉，文化悠长。\r河北是中华文明发祥地之一，泳鹿之战开启炎黄子孙的篇章，大禹治 水暗藏中华文明的玄妙，泥河湾盆地改写人类起源的猜想。\r五处世界文化遗产是历史对它的褒奖，秦时万里长城的延绵，隋代大 运河的精巧，清代避暑山庄的幽凉，见证了封建王朝的兴起和消亡。\r慷慨悲歌之士给这片土地注入能量，前有李大钊悲壮如斯，后有觉醒 者们前赴后继，终在华北平原的这片土地上，写下了爱我中华的故事和华 章。\r南北之间，中国脊梁。\r火车轮拉来了石家庄，京广线连接了南北方。上世纪初开始，铁轨车 厢承载国家命运驶向远方。从唐胥铁路开始，中国人奋起直追，多年之后， 高铁时代来临，河北当仁不让，承接守护首都交通运输的重担。休闲，商 贸便便利四方、铁路让当年积弱的中国成为了现在强盛的模样。北接京津， 南通中原的石家庄，从一个无人问津的小村庄，变成了美丽的省会。\r在旅游资源和革命土壤的加持下，攀岩而上。\r钢铁业造就唐山市，新产业开启新方向撑起中国发展的工业脊梁\r这就是河北，古时守护中原，今天环绕京津，保护着祖国的心脏；这就 是河北，恰如它连接起高原与大海，承接起历史的荣耀与现代文明，担负 着中国的未来和希望。\r\r\r\r\r \r\n“周航，你要是敢不卖房，我就跟你离婚。”\r\n陈玲玲脾气很不好，甚至可以说是一点就燃。\r\n这不，听到高周航不仅不卖房，还说不出一分钱给自己弟弟治病。\r\n她当场爆发了。\r\n对于她来说，自己的弟弟和家人才是最重要的。\r\n其他人，那都是外人！\r\n包括周航这个老公在内。\r\n“离就离，谁不离谁是孙子。”\r\n“真以为我离了你就活不下去了啊？”\r\n“我告诉你，满大街随便拉个女人都比你强千百倍。”\r\n周航拿话不断的刺激陈玲玲。\r\n夫妻那么多年，他太清楚陈玲玲的脾气了。\r\n这小脾气一上来了，做事根本不管后果。\r\n而周航之所以如此刺激陈玲玲，当然是为了逼她离婚。\r\n都重生了，他当然不可能再让陈玲玲一家祸害自己，祸害自己父母。\r\n所以重生第一剑，先斩前妻一家。\r\n让他们永远的离开自己的生活。\r\n“好，这可是你说的。”\r\n“有本事马上去民政局。”\r\n果然如同周航所料，被他不断刺激的陈玲玲，根本不思考后果。\r\n直接同意了离婚！\r\n“走就走，谁怕你啊。”\r\n“我倒要看看，你离开了我，以后的日子还能怎么过。”\r\n“笑话，我陈玲玲要身材有身材，要样貌有样貌，追我的不计其数，\r\n你不懂得珍惜，有的是人珍惜我。”\r\n当即，两个人直接拿了结婚证，身份证等材料前往了民政局！\r\n而在一路上，两个人还不停的讽刺对方。\r\n这也是周航故意的。\r\n他可不能让陈玲玲冷静下来。\r\n万一冷静下来了，这垃圾女人不跟她离婚怎么办？\r\n这是周航不允许的。\r\n因为，如果这几天无法离婚的话。\r\n一旦等那个消息出来，陈玲玲恐怕就不会同意和周航离婚了。\r\n最起码，得到想要的东西之前，是绝对不会同意离婚的。\r\n第2章 双标\r\n民政局门口，周航拿着到手的离婚证，心中仿佛有一个枷锁被打开了\r\n一般，整个人都神清气爽了起来！\r\n终于离婚了！\r\n这一世，他再也不用被这一家子连累了。\r\n回到家后，陈玲玲开始收拾自己的东西。\r\n既然离婚了，她自然也不会继续住在这里。\r\n“周航，离婚协议你也签了。”\r\n“属于我的那一半财产，你尽早给我。”\r\n“否则，别怪我去法院起诉你。”\r\n将东西收拾完之后，陈玲玲冷冷的说道。\r\n两人签离婚协议的时候，明确的指出财产平分。\r\n对此，陈玲玲自然没有意见。\r\n也正是因为要平分，所以她才肯签字。\r\n不然的话，光是一句离婚，她又怎么可能傻乎乎的签字。\r\n“放心，最多三天我就将属于你的那份财产给你。”\r\n周航如何不知道陈玲玲在想什么？\r\n可惜，她想的有点多。\r\n属于你的那一份财产，早已经被你偷偷的拿去给你弟弟霍霍完了。\r\n剩下的财产，你一分也拿不到。\r\n至于现在住的房子？\r\n虽然是在周航名下，但是和陈玲玲却没有半点关系。\r\n因为那是属于婚前财产。\r\n..........\r\n当陈玲玲离开之后，周航打量着空荡荡的房间，脸上露出了一抹喜\r\n色！\r\n他之所以离婚，那也是和这套房子有关系。\r\n上一世，因为陈玲玲的逼迫，周航无奈的答应了卖房！\r\n但是谁能想到，这套房子卖了之后不到半个月就遇上了拆迁！\r\n是的，拆迁。\r\n大概在两周后，周航所在的这个小区就要被拆迁了。\r\n拆迁赔偿，是一比二！\r\n也就是说，同等面积的情况下，这个小区的一套房子可以获得另外一\r\n个小区的两套房子赔偿。\r\n当然了，这是其中之一的赔偿条款。\r\n另外一个赔偿条款是现金赔偿！\r\n按照当前的房价进行一比一的赔偿。\r\n哪个时候刚卖掉房子，就获得了拆迁的消息。\r\n陈玲玲那叫一个后悔。\r\n她们一家人更是上门闹了不少次。\r\n可惜，人家买主根本不鸟他们。\r\n最终还因为多次滋事寻衅被关了几天，这才老实了下来。\r\n如今周航重生过来，当然不可能再卖这套房子了。\r\n同时，这也是他为什么要那么快和陈玲玲离婚的原因。\r\n虽然这套房子是婚前财产，也是周航名下。\r\n但是如果婚姻期间，这套房子拆迁的话。\r\n升职部分，陈玲玲也是可以获得一笔资金的。\r\n上一世周航已经受够了陈玲玲一家。\r\n随意这一辈子，别说是一笔巨大的资金了，哪怕是两毛五他都不会想\r\n给。\r\n所以，周航才会如此快的和陈玲玲离婚。\r\n当然了，也的亏现在离婚可以直接办，没什么冷静期。\r\n不然的话，周航想要像现在这样干脆利落的离婚，恐怕还真做不到。\r\n.......\r\n转眼之间，三天时间过去了！\r\n这几天，周航都在家里，没有出去。\r\n他在回忆上一世的一些经历！\r\n一开始，他还准备用纸和笔记下来一些重要的事情，免的自己忘记。\r\n但是经过回忆后，周航惊讶重生后自己的记忆力好像有一点点恐怖。\r\n恐怖到什么程度呢？\r\n可以用过目不忘来形容！\r\n只要是他看过的东西，哪怕是不经意的一瞥，他都能记得清清楚楚。\r\n如此一来，他就不需要拿笔和纸记下来了。\r\n毕竟记在纸上有暴露的危险。\r\n而记在脑子里，就完全不需要了。\r\n谁也无法从他的脑子里读取东西。\r\n既然不需要记录未来发生的事情，周航索性在这几天就将他和陈玲玲\r\n的共同财产详细的算出来。\r\n精确到一分一毫！\r\n“砰砰砰！”\r\n“都离婚了，你还来干什么？”\r\n就在此时，一阵敲门声传来。\r\n打开门看到来人后，周航脸色一冷，面无表情的说道，眉头更是微微\r\n一皱，显示着心中的不爽。\r\n来人，正是周航的前妻陈玲玲。\r\n“你以为我想来？”\r\n“要不是你还没将钱打给我，我才不愿意来呢。”\r\n“三天过去了，财产你算好了没有？”\r\n“算好了拿给我看看，如果没什么问题赶紧将钱给我。”\r\n“我弟弟等着钱治病呢。”\r\n陈玲玲也不客气，直接闯入了房间之中。\r\n“早就算完了。”\r\n“你过目一下吧。”\r\n周航冷冷一笑，然后从桌子上拿出一张纸来，递给了陈玲玲。\r\n“我能分到多少钱？”\r\n陈玲玲接过纸后，第一时间并没有去看，而是直接询问道。\r\n“自己不会看嘛？”\r\n周航讥讽的看了陈玲玲一眼。\r\n果然，这个女人眼里只有钱。\r\n离婚一点都没影响她的心情。\r\n只要有钱拿，离婚什么的，她才不在乎呢。\r\n“周航！！！”\r\n“你个王八蛋什么意思。”\r\n“存款竟然只剩下100块钱了？”\r\n“我们的钱呢？”\r\n“是不是你私吞了？”\r\n当陈玲玲看完信息后顿时暴怒了。\r\n他和周航结婚三年了，周航现在的工资也不错，月薪左右，一年13薪\r\n下来，差不多有个二十万左右，加上前两年的工资足也足有五十万。\r\n再加上她自己的工资，两人的存款都不可能只剩下100块钱吧。\r\n“哦，你说剩下的钱啊？”\r\n“我给我父母了。”\r\n周航慢条斯理的说道，对于陈玲玲的暴怒那是一点都没在意。\r\n这就生气了？\r\n哼，上一世你对我做过的事情，可比我多的多。\r\n以前不和你计较，那是因为我想维持婚姻。\r\n但是这一世，哪凉快就给我滚哪待着去。\r\n“给你父母？”\r\n“周航，你竟然将我们的钱给你父母，你经过我同意了吗？”\r\n陈玲玲咬牙切齿的说道。\r\n“呵，这话说的就有点搞笑了。”\r\n“你将咱们的钱拿给你那废物弟弟的时候，怎么就没想过要经过我的\r\n同意呢？”\r\n周航嗤笑一声。\r\n这女人的双标他可是早就领教过了。\r\n所以对于她说出这句话，周航也不意外。\r\n“那怎么能一样。”\r\n“陈伟给我唯一的亲弟弟，我给他钱难道是应该的吗？”\r\n“那两个老东西和我又没关系，凭什么拿我的钱？”\r\n陈玲玲蛮横无理的说道。\r\n丝毫不在意自己说的这些话有没有道理。\r\n反正只要自己觉得有道理就行。\r\n至于其他人？\r\n哼，关我什么事。\r\n“陈玲玲，嘴巴给我放干净一点。”\r\n“不然，别怪我不客气！”\r\n听到陈玲玲的话，周航的脸色顿时阴沉了下来。\r\n身为子女，他怎么可能允许别人侮辱。\r\n哪怕是前妻也不行！\r\n“我就说，你能把我怎么样？”\r\n“那两个老东西占着茅坑不拉屎。”\r\n“明明手里有钱，凭什么.....”\r\n“啪！！！”\r\n第3章 终究是一个人扛下了所有\r\n“你....你竟然敢打我？”\r\n捂着红肿的脸，陈玲玲露出了难以置信的表情。\r\n“打你又如何？”\r\n“你要是再敢说我父母半句坏话，就不是一巴掌的事情了。”\r\n尽管两世为人了，但周航此时还是被挑起了怒火。\r\n父母，是这一世周航最大的逆鳞。\r\n他不会再允许陈玲玲一家再对自己的父母做出任何过分的事情。\r\n“你...你...”\r\n看着怒火中烧的周航，陈玲玲忽然感觉此时的周航很陌生！\r\n这家伙，之前明明那么的爱我，对我更是百依百顺。\r\n但是现在竟然敢动手打我了？\r\n而且还是为了那两个老东西打我！\r\n可恶，一定是那两个老东西给周航灌输了什么东西，所以周航才变\r\n的。\r\n不仅和我离婚，还打我！\r\n“别你你我我的了。”\r\n“我现在不想看到你，以后也不想看到你。”\r\n“给我滚吧。”\r\n“咱们结婚这几年，你拿了多少钱给你那废物弟弟了？”\r\n“小额转账就不说了，大额转账足有三十多万了吧？”\r\n“那三十多万，可是我们夫妻的共同财产。”\r\n“你经过我同意了吗？就擅自将钱给你弟弟。”\r\n“如今，我拿三十万给我父母，也算是扯平了。”\r\n“至于 信，尤其是对算命先生的话那是深信不疑。\r\n算命的可是说了，自己儿子命格奇特，是大富大贵的面相。\r\n放在古代，那绝对是黄袍加身，每一顿都有山珍海味和大鱼大肉相伴\r\n的大人物。\r\n“哈哈哈哈，笑死我了。”\r\n“就你那废物儿子还大人物？”\r\n“赵明兰，你难道没听过一句话叫做人贵在有自知之明。”\r\n“就陈伟那废物，要学历没学历，要能力没能力，他拿什么成为身价\r\n几十亿的亿万富豪？”\r\n“靠做梦吗？”\r\n周威那叫一个不客气。\r\n既然两家都已经闹掰了，他也不需要考虑赵明兰一家的感受了。\r\n有什么话，该说就说。\r\n“你...你个老王八蛋竟然敢诅咒我儿子。”\r\n“我告诉你，我儿子将来要是不能成为大人物，肯定是你们一家害\r\n的。”\r\n“像你们这么吝啬的一家人，将来注定不得好死。”\r\n赵明兰不过是个乡野村妇而已，根本没什么文化。\r\n被周威那么一怼，除了骂骂咧咧一番之外，也没有其他话反驳了。\r\n“赵明兰，说话客气点。”\r\n“现在我们两家可没什么关系了。”\r\n“你要是不知道好歹，别怪我报警让你知道什么叫做擅闯民宅。”\r\n听到赵明兰如此难听的话，周威顿时怒了。\r\n敢诅咒我们一家不得好死？\r\n难怪我儿子那么好的脾气都忍不住打你女儿。\r\n有你这种母亲当榜样，你女儿能好到哪去？\r\n“周威，你儿子骗我女儿钱，还打我女儿，你还有脸报警？”\r\n“你信不信我找媒体曝光你们这没良心的一家人。”\r\n赵明兰丝毫不带怕的。\r\n今天她就是来撒泼打滚的。\r\n要不到钱，她是绝对不会走，更不会善罢甘休。\r\n“好啊，那就曝光让大家评评理，究竟是我们一家没良心。”\r\n“还是你们一家太过丧心病狂？”\r\n第5章 这是有多么的不要脸啊\r\n“好啊，那就曝光让大家评评理，究竟是我们一家没良心。”\r\n“还是你们一家太过丧心病狂？”\r\n就在此时，门外传来了一道冰冷的声音。\r\n下一秒，周航带着满腔的怒火走了进来。\r\n虽然他就料到陈玲玲一家不会善罢甘休。\r\n但是周航没想到他们来的那么快。\r\n并且还是找自己父母的麻烦。\r\n“是你这个小王八蛋来了。”\r\n“好，既然今天大家都在这里，那我们今天就把话说清楚。”\r\n“周航，你和我家玲玲离婚了。”\r\n“属于我家玲玲的那部分财产，你必须一分不少的给我。”\r\n见到周航来了，赵明兰二话不说提出了财产的分配。\r\n“行啊，想要财产分配没问题。”\r\n“让陈伟把这些年从我们家拿走的钱拿出来。”\r\n“然后我们把账算一算，该给你的，我一分都不会少给你。”\r\n周航冷笑一声。\r\n拿走了三十万，还想继续拿？\r\n你在想屁吃！\r\n“不可能。”\r\n“小伟凭本事要的钱，为什么要拿出来还给你？”\r\n“我告诉你，既然当初玲玲将钱给了小伟，那就是小伟的。”\r\n“和你们一家早就没关系了。”\r\n赵明兰蛮横无理的说道。\r\n先别说那三十万估计早就被儿子花完了。\r\n就算没花完，她也不可能拿出来。\r\n到了她手里的钱，再想让她吐出来，那是不可能的。\r\n“赵明兰，你无需在这里跟我们一家耍无赖。”\r\n“我不吃你这一套。”\r\n“你也别想从我这拿走一分钱。”\r\n对于赵明兰的耍无赖，周航根本没放在眼里。\r\n如今钱在他的手里，只要他不想给，赵明兰一分钱都别想要到。\r\n更何况，他还是占理的一方。\r\n哪怕是闹到了法院，最后的判决也是对他有利的。\r\n“周航，你个小王八蛋不让我好过是吧。”\r\n“那大家就都别好过。”\r\n“我倒要看看，你是不是什么都不在意。”\r\n赵明兰咬牙切齿的看了周航一眼。\r\n然后下一秒就跑到了楼道里。\r\n“大家都快出来看看，这一家人简直就不是人。”\r\n“小舅子生病住院了，身为姐夫的周航不但不帮忙，反而诓骗我女儿\r\n离婚。”\r\n“为了亲弟弟的救命钱，我女儿哪怕是被骗也认了。”\r\n“结果周航这小王八蛋那叫一个丧心病狂啊，离婚的时候说好的平分\r\n家产，结果到了现在一分钱都不肯给，那可是我儿子的救命钱啊。”\r\n“苍天啊，我怎么就那么的命苦，摊上了这么一个女婿。”\r\n“女婿不靠谱也就算了，身为周航父母的金晓丽竟然也无耻的包庇自\r\n己的儿子。”\r\n在赵明兰闯入这里，和金晓丽大吵大闹的时候，左邻右舍就都听到动\r\n静了。\r\n一个个纷纷的打开门，将好奇的目光对准了这里。、\r\n有些八卦心大的，甚至站在门口嗑起了瓜子。\r\n周航之前赶到父母家的时候，门口就已经围了四五个人了。\r\n如今听到赵明兰那凄惨的哀嚎声，一个个都从家里出来，围到了这\r\n里。\r\n“周航不是很爱他老婆嘛，怎么突然之间就离婚了，而且丈母娘还上\r\n门来大闹，该不会真的是做了什么亏心事吧？”\r\n“我觉得不可能，咱们和晓丽也认识十几年了，她们一家什么人品我\r\n们还不清楚吗？平日里对我们都那么好，更别说是对待儿媳妇了。”\r\n“是啊是啊，这一点我可以作证，晓丽对她儿媳妇，那真是好到让我\r\n儿媳妇都嫉妒了，他们家怎么可能做亏心事。”\r\n“呵，我估计啊，肯定是晓丽儿媳妇一家做的太过分了，所以才逼得\r\n晓丽儿子和她媳妇离婚的。”\r\n“你猜的不错，我大姑的弟妹的哥哥的媳妇的大姨子和陈玲玲的母亲\r\n是同事，他们一家人什么品性我再清楚不过了，这显然是不甘心没拿到\r\n钱，上门来讹钱的。”\r\n“当初我就劝过周航，让他考虑清楚再结婚，毕竟结婚不是两个人的\r\n事情，而是两个家庭的事情，只可惜这小子当初非陈玲玲不娶，我是咋劝\r\n也劝不了。”\r\n外面的吃瓜群众，都是左邻右舍。\r\n和周航一家也认识了接近十来年了。\r\n所以对于周航一家的人品是什么样自然都非常的了解。\r\n因此，在听到赵明兰的哀嚎，他们一个个都表示不信！\r\n甚至一些知道赵明兰为人的邻居，更是一眼就看穿了赵明兰的把戏！\r\n“.....”\r\n正在哀嚎的赵明兰，听到周围的议论声顿时直接愣住了。\r\n怎么回事？\r\n这剧本有点不对劲啊。\r\n看到我这么凄惨，你们不应该过来同情我，然后去指责金晓丽一家\r\n嘛？\r\n结果现在纷纷指责我是什么意思？\r\n导演，这些群演造反啊，竟然不按照剧本演，擅自加戏，扣他们工资\r\n啊。\r\n一旁的周航听到周围邻居的话，顿时露出了一抹笑容。\r\n做了十几年的邻居，这帮叔叔阿姨关键时刻也是真给力，从不掉链\r\n子。\r\n当然了，这也跟自己母亲那么多年来与人为善有关。\r\n若非如此，这帮邻居今日也不会站在他们这边。\r\n如果将自己的母亲换成是赵明兰的话。\r\n刚才那些议论，恐怕就是各种诋毁了。\r\n什么你们家也有今天，人在做天在看之类的不会少。\r\n“赵明兰，你还有脸在这哭诉？”\r\n“你儿子病了，我一开始没说不帮忙吧？”\r\n“结果你嫌弃钱少，让你女儿逼着我卖房，好将卖房的钱拿出来给你\r\n儿子治病。”\r\n“更过分的是，你女儿让我卖房之后，将我父母赶出去，不让他们\r\n住。”\r\n“有你这么当丈母娘的嘛？”\r\n“我和陈玲玲离婚，你有不可推卸的责任。”\r\n“至于平分财产？我也确实做到了。”\r\n“结婚这些年，陈玲玲背着我给了你儿子三十多万，那些钱也是属于\r\n夫妻财产的一部分。”\r\n“而这三十万，可是超过我和陈玲玲一半的夫妻财产。”\r\n“我没让你们家，将超出来的那部分补给我就不错了！”\r\n周航冷冷的说道。\r\n他说这些，也有解释的原因在里面。\r\n周围那么多人看着，有些事哪怕他们愿意相信自家，但是该有的解释\r\n还是要有的。\r\n而那些邻居听到周航的话后，顿时一个个露出了果然如此的表情。\r\n随后，他们看向赵明兰的眼神充满了嘲讽。\r\n这泼妇的脸皮是有多么的厚，才会做出如此不要脸的事情啊"

// ===================== 渲染 =====================
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('prompthub-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  let html = '';
  SECTIONS.forEach(sec => {
    html += `<div class="section"><div class="section-title"><span>${sec.icon}</span> ${sec.title}</div><div class="section-desc">${sec.desc}</div><div class="cards">`;
    sec.items.forEach((item, i) => {
      html += `<div class="card" id="card-${sec.title}-${i}">
        <div class="card-header" onclick="toggleCard('card-${sec.title}-${i}')">
          <span class="card-icon">📋</span>
          <span class="card-name">${escHtml(item.name)}</span>
          <span class="card-arrow">▼</span>
        </div>
        <div class="card-body"><pre>${escHtml(item.content)}</pre>
        <div class="card-actions">
          <button class="btn btn-primary" onclick="event.stopPropagation();copyContent('card-${sec.title}-${i}')">📋 复制内容</button>
        </div></div></div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('content').innerHTML = html;
});

function toggleCard(id) {
  document.getElementById(id).classList.toggle('open');
}

function copyContent(id) {
  const pre = document.getElementById(id).querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(() => toast('✅ 已复制到剪贴板'));
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('prompthub-theme', next); } catch(e) {}
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
