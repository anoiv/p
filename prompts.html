，不添加任何多余内容。\r\n## 核心提炼原则（必须严格执行，不遗漏关键信息）\r\n1.  优先提炼核心人物（主角、反派、关键配角），次要路人角色可省略，确保角色卡简洁不冗余，贴合S级短剧“人设鲜明、无多余角色”要求。\r\n2.  提炼信息必须忠于原文/剧本，不添加主观臆断，不篡改人物性格、身份、核心动机，同时规避原文人名，替换为全新专属人名（规避版权查重）。\r\n3.  聚焦S级短剧核心人设特质（反差感、记忆点、冲突点），提炼内容围绕“人设标签+核心信息”，便于AI生成统一、不崩脸的人物形象，便于剧本适配。\r\n4.  人物关系提炼清晰，明确核心人物间的关联（敌对、情侣、亲属等），避免混淆，适配短剧剧情逻辑。\r\n## 提炼信息范围（必含项，缺一不可）\r\n### 基础信息（核心必填）\r\n- 角色姓名：替换后的全新专属姓名（避免与原文重名，规避版权；姓名简洁好记，适配短视频观众记忆）\r\n- 角色定位：明确标注（主角/反派/关键配角），区分核心与次要\r\n- 年龄区间：精准标注（如22-25岁、30-35岁），不模糊表述（禁用“年轻、中年”等模糊词汇）\r\n- 外貌特征：精准、具体，适配AI生成（标注脸型、眉眼、发型、穿搭风格、标志性特征，如“鹅蛋脸、桃花眼、黑长直、职场西装、颈间玉佩”，不笼统描述）\r\n- 身份背景：简洁提炼核心身份（如“豪门总裁、落魄千金、腹黑反派、隐藏大佬”），不添加冗余背景铺垫，贴合短剧节奏。\r\n\r\n### 核心特质（S级人设关键）\r\n- 性格特质：提炼2-3个核心性格（如“外冷内热、腹黑狠戾、单纯善良、伪善自私”），必须贴合剧情中的人物行为，不矛盾\r\n- 核心动机：提炼人物行动的核心目的（如“复仇、逆袭、守护某人、争夺权力/财富”），适配短剧冲突逻辑\r\n- 人设反差（可选，S级爆款加分项）：若人物有反差特质（如“表面卑微舔狗，实则隐藏大佬”），必须重点提炼，突出记忆点\r\n- 标志性动作/台词：提炼1-2个专属标志性动作或短句（如“习惯性摸袖口玉佩、冷笑说‘你还不够格’”），便于AI生成和观众记忆。\r\n\r\n### 人物关系（必填）\r\n- 与核心角色的关联：明确标注（如“主角的复仇对象、反派的跟班、主角的青梅竹马”），简洁清晰，不冗余\r\n- 核心立场：明确标注（正面/负面/中立），贴合剧情冲突。\r\n## 角色卡输出格式（严格遵守，标准化呈现）\r\n每个核心人物单独生成1张角色卡，格式统一，不混乱；多个人物按“主角→反派→关键配角”顺序排列，每两张角色卡之间空一行，便于查看。\r\n\r\n### 单张角色卡标准输出格式\r\n【角色姓名】：XXX（替换后全新姓名）\r\n【角色定位】：主角/反派/关键配角\r\n【年龄区间】：XX-XX岁\r\n【外貌特征】：XXX（具体、精准，适配AI生成）\r\n【身份背景】：XXX（简洁核心，不冗余）\r\n【性格特质】：XXX、XXX、XXX（2-3个核心，不矛盾）\r\n【核心动机】：XXX（贴合剧情，明确行动目的）\r\n【人设反差】：XXX（无则写“无”，有则精准提炼）\r\n【标志性动作/台词】：XXX（1-2个，专属特质）\r\n【人物关系】：XXX（与核心角色的关联，简洁清晰）\r\n【核心立场】：正面/负面/中立\r\n## 禁忌要求（严禁违反，否则视为不合格）\r\n1.  禁止保留原文人名、地名，所有角色姓名必须替换为全新专属姓名，规避版权查重。\r\n2.  禁止提炼与剧情无关的人物信息，不添加冗余心理描写、背景铺垫，贴合短剧“简洁高能”要求。\r\n3.  禁止模糊表述，外貌、年龄、身份、性格等信息必须精准，便于AI生成人物（禁用“长得好看、性格好”等笼统词汇）。\r\n4.  禁止人物性格、动机与剧情矛盾，提炼内容必须忠于原文/剧本。\r\n5.  禁止格式混乱，严格按照单张角色卡标准格式输出，角色顺序正确，不遗漏必含项。\r\n6.  禁止生成路人角色卡，仅提炼核心人物（主角、反派、关键配角），避免冗余。\r\n## 输出要求\r\n直接输出提炼后的所有核心人物角色卡，严格按照上述格式、提炼原则、禁忌要求执行，不添加任何多余解释、多余内容。\r\n提供小说原文或短剧剧本后，先快速梳理核心人物，再逐一生成角色卡，确保信息精准、人设鲜明、适配S级AI短剧生成和剧本适配。","i":10},{"name":"角色提示词生成.txt","ext":"txt","size":"428B","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E6%8F%90 事文本转化为一分钟短篇视觉叙事，并呈现为单张5X5的分镜表(含25个手绘分镜面板)。仅以故事文本作为唯一叙事依据，忠实还原核心角色、主要事件序列、情感递进和结局节点，同时将其扩展为具有电影感的一分钟短片结构，包含清晰的开端、发展、转折点、高潮和结局。\r\n故事文本:[替换为你的故事文本]\r\n创建25个连续的分镜帧，排列成简洁的5列X5行网格。整体需呈现为一部连贯的短片，而非25幅无关插画。设计序列时需遵循严谨的电影逻辑:开篇establishing shot(定场镜头)、角色介绍、动作推进、情感升级、转折点、高潮以及舒缓的结尾镜头。在25个分镜中自然变化镜头语言，合理搭配远景、全景、中景、特写、特写镜头、俯拍、平视镜头、仰拍、过肩镜头主观镜头和动态运动镜头。每一个分镜都需明确服务于这部一分钟短片的节奏把控和视觉叙事。将整幅分镜表渲染为专业手绘分镜草图，模拟导演的规划板风格。采用富有表现力的铅笔或墨水线条，黑白或浅色调纸本草图质感，简洁但清晰的阴影，合理的构图，鲜明的轮廓设计，清晰的前景-中景-背景关系，以及符合电影感的场景调度。优先注重构图、场面调度、光线方向、氛围、节奏和连贯性，而非精致的最终渲染细节。分镜应呈现为真人短片的制作级分镜草图，而非漫画页面或全渲染彩色插画确保所有25个分镜面板中的角色特征、服装逻辑、道具连贯性和环境一致性。即使没有文字，也需通过视觉清晰呈现情感递进。除非有明确要求，否则不得添加说明文字、对话文本、字幕页码、箭头、水印、标志、用户界面元素、边框、二维码、签名或额外文字。","i":15},{"name":"seedance2.0分镜提示词模板.txt","ext":"txt","size":"2KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/seedance2.0%E5%88%86%E9%95%9C%E6%8F%90%E7%A4%BA%E8%AF%8D%E6%A8%A1%E6%9D%BF.txt","text":" 【环境设定 (Context)】：\n[在此处填入环境。例如：暴风雪中的古庙废墟 / 燃烧的南天门 / 赛博朋克霓虹街道]，[填入氛围词。例如：压抑的红色天空 / 充满体积雾 / 丁达尔光效]。\n\n【角色设计 (Character)】：\n[在此处填入主角特征。例如：黑神话悟空，穿着金色锁子甲，满脸猴毛细节，手持发光的金箍棒，眼神凶狠]。\n(提示：如果 Nanobanana Pro 支持垫图，请务必在此处上传你的“三视图”作为 Reference)\n\n🎬 第三步：九宫格剧情流转（填空区）\n\n（这是核心！请按行填写，每行对应视频的5秒）\n\n【第一行：起势与铺垫 (对应视频 0-5秒)】\n\nPanel 1 (远景/开场)： [例如：极远景俯瞰，黑云压城，主角渺小如蚂蚁]\n\nPanel 2 (推进/特写)： [例如：镜头推进，主角抬头，眼神中金光流转]\n\nPanel 3 (对峙/敌军)： [例如：巨大的敌人阴影笼罩下来，露出狰狞的獠牙]\n\n【第二行：冲突与爆发 (对应视频 5-10秒)】\n\nPanel 4 (动作/交锋)： [例如：主角猛地挥动武器，产生剧烈的动态模糊残影]\n\nPanel 5 (特效/高潮)： [例如：武器撞击瞬间，爆发出刺眼的球形冲击波]\n\nPanel 6 (反应/破坏)： [例如：敌人被击飞，周围的建筑/地面瞬间崩塌粉碎]\n\n【第三行：结果与余韵 (对应视频 10-15秒)】\n\nPanel 7 (宏大/全景)： [例如：烟尘弥漫，地面留下巨大的深坑，火光冲天]\n\nPanel 8 (细节/局部)： [例如：特写主角的手，或者武器上的符文正在慢慢熄灭]\n\nPanel 9 (收尾/定格)： [例如：主角孤独的背影，站在废墟之上，披风飘动]\n\n🎨 第四步：风格修饰词（可选增强）\n\n（复制在最后，提升质感）\n\nStyle Modifiers:\nVolumetric lighting, Ray tracing, Particle effects, Bloom effect, Hyper-realistic textures, Dynamic angle, Film grain, Cinematic composition. --ar 16:9\n(体积光，光线追踪，粒子特效，辉光，超写实材质，动态视角，电影胶片感，电影级构图)\n\n","i":16},{"name":"分镜.txt","ext":"txt","size":"4KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%88%86%E9%95%9C.txt","text":" 根据旁白和对话拆分分镜头\r\n前置指令\r\n1. 核心要素提炼：读取小说原文，提炼该章节内的场景和核心人设，标注身份、性格、核心小冲突（贴合全书主线，不脱离整体剧情）、核心亮点，剔除与该章节无关的全书背景、支线内容。\r\n2. 基础参数规范：单集时长控制在1-3分钟，对应章节内容拆分适配（每1-2章节可拆分1集，贴合章节剧情密度）。\r\n3. AI适配要求：规避AI难以生成的内容（大规模群戏、复杂实景特效、冗长心理描写）；台词口语化、短平快（单句不超过15字），防止AI崩脸、穿模。\r\n4. 节奏硬性要求：每15-20秒设置1个小冲突，每30秒设置1个中冲突，每集结尾设置1个大钩子；每集严格遵循“3秒抓眼，开篇+高能密集剧情+钩子结尾”，无废话、全高能。\r\n\r\n分镜脚本提示词要求如下:\r\n【六维一致性准则】\r\n人物一致:出现角色必须严格匹配角色信息库，未出现角色绝不写入时空一致:相邻分镜时间(晨/午/晚)、地点、光线必须无缝衔接物品一致:关键道具(如钢笔/背包)位置状态需延续上一镜动作连贯:新分镜起始动作必须承接上一镜结束状态\r\n台词合规:仅当前说话角色有张嘴动作，台词用\"\"标注敏感过滤:自动替换违禁词(替换规则:用中性词保持剧情逻辑)\r\nSTEP1场景锚定一提取章节文案时间/地点/人物三角要素STEP2连续性检查一比对上一镜结尾状态(动作/台词/物品位置)STEP3台词植入一仅当章节文案含对话时添加\"台词\"字段STEP4 敏感扫描一自动替换违禁词(每15秒为一组)\r\n标明此镜头组的画面风格、光影色调、画面质量、故事大概。\r\n[0-4秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态];音效:[主音效]+[环境音];[台词/画外音]\r\n[4-8秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态];音效:[关键音效];[台词/画外音]\r\n[8-12秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态];音效:[氛围音];[画外音/沉默说明]\r\n[12-15秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态]+[下一镜铺垫];音效:[过渡音]\r\n[遵循要求】\r\n1.*中文输出**:所有提示词必须使用中文描述，输出的提示词必须不能包含英文引号\"，必须使用中文引号”\r\n2.**标点格式**:输出的提示词必须不能包含英文引号”，必须使用中文引号”3.*视频提示词要求:严格参考输出示例，每个画面为10秒，由1-4秒每个镜头所组成，必须严格按照参考案例给出\r\n4.**场景信息“*给出的场景信息对应后一字不改的放到我需要的位置5.*图片提示词*图片提示词内不需要映射人物，非常重要6.景别多使用近景，特写，大特写等，不使用远景，少使用中景7.拆分文案内容要合理\r\n[结果要求]\r\n数量严格控制:任务是为输入信息中的章节文案中的每一项生成一个对应的分镜。输出记录的总数必须与章节文案的条目数完全相等。禁止根据小说原文或推文文案的长短阜行拆分或合并分镜。\r\n分镜解析:逐条解析章节文案，给出人物姓名，重点描写动作、表情，结合[角色信息】与整体情节，明确视角与景别。\r\n提示词推理限制:如果出现违禁词需要自动替换意思相近的中性词，保证新的视频提示词不得出现任何违禁词，违禁词包括词典\r\n【风格】：真人电影写实风格并且在提示词前面加上这句话\r\n不要表格","i":17},{"name":"分镜提示词.txt","ext":"txt","size":"7KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%88%86%E9%95%9C%E6%8F%90%E7%A4%BA%E8%AF%8D.txt","text":"{\r\n  \"template_name\": \"短剧故事转分镜+Mininax H3视频提示词一体化模板\",\r\n  \"version\": \"4.0\",\r\n  \"description\": \"完整保留原版3.0七维静态分镜提示词体系，配套即梦Mininax H3官方标准动态视频提示词；优先保障剧本故事完整流畅，自然拆分镜，前置三重叙事审查，兼顾静态分镜绘图、动态短片生成双用途\",\r\n  \r\n  \"system_prompt\": \"你是专业影视短剧导演+AI分镜师+Mininax H3官方提示词工程师。第一准则：100%忠于用户提供短剧剧本或小说章节，所有镜头剧情、动作、台词、场景不得私自增删篡改，优先保证叙事连贯流畅，不强行切割固定时长破坏故事；\\n1. 每一格分镜输出两套内容：①原版规范7维度静态分镜绘图提示词；②配套可直接复制到Mininax H3五段式动态视频提示词；\\n2. 输出前完成整体三重审查：故事连贯性、镜头创意设计、短视频爆款逻辑、；\\n3. 运镜、光影、构图全部使用专业量化影视术语，拒绝模糊描述；\\\\n4. 动态提示词标注单镜头适配时长、字幕时间码、配音对白、环境音效，末尾统一附带全片负面提示词。\",\r\n  \r\n  \"input\": \"{{改编好的完整短剧剧本}}\",\r\n  \r\n  \"output_schema\": {\r\n    \"整体审查\": {\r\n      \"故事连贯性\": \"校验全部分镜动作延续、情绪递进、场景空间逻辑，无断层填写「连贯」；存在剧情割裂、镜头跳脱则写明问题与优化调整方案\",\r\n      \"创意设计\": \"一句话概括整套分镜核心视觉巧思：贯穿叙事道具、光影跟随情绪渐变、构图强弱对比、创意转场运镜等记忆点\",\r\n      \"爆款逻辑\": \"一句话拆解吸睛逻辑：前3镜开篇钩子、中段情绪爆发高光镜头、结尾留白悬念/情绪落点，说明留存观众的设计\"\r\n    },\r\n    \"全局统一锁定锚点（全分镜通用）\": {\r\n      \"场景&光影基底\": \"全片固定场地、天气、统一基础光源色调、环境氛围规则\",\r\n      \"基础画质标准\": \"画幅(9:16竖短剧/16:9电影宽屏)、统一美术风格、8K超清基础规格\"\r\n    },\r\n    \"分镜列表\": [\r\n      {\r\n        \"序号\": 数字,\r\n        \"分镜描述\": \"一句话精准概括本镜头对应剧本核心画面内容\",\r\n        \"叙事功能\": \"钩子/铺垫/冲突转折/情绪爆发/伏笔回收/结尾悬念\",\r\n        \"单镜适配视频时长\": \"X-Xs（单镜头时长不得超过15秒）\",\r\n        \"【静态分镜图7维度提示词】\": \"[画面构图：构图方式，景别，运镜，景深] [角色：出场人物，完整动作姿态] [人物空间与互动关系：人物位置、间距、彼此朝向/对峙/依偎] [极具体的微表情与面部特写：眼神、泪痕、嘴唇状态等细节] [明确的场景环境元素与前景/背景道具：分层写明前景遮挡、中景主体、背景陈设、叙事关键道具] [光影几何与大气效果：光源方向、软硬光线、阴影层次、雨/雾/微尘/雷电等环境粒子氛围] [视觉风格/胶片质感：整体冷暖色调、胶片颗粒、美术画风] [技术参数：比如电影机相机red、阿莱电影机或者是纪实风格的手机，镜头焦段，光圈值，拍摄设备]\",\r\n        \"【Mininax H3官方动态视频提示词（模板）】\": {\r\n           图 1 是苏叶面部参考（锁骨发、左眉有痣）；图 2 是陈默面部参考（寸头、酒窝）；图 3是天台场景参考。\",\r\n          \"风格合约\"：\"影视美术风格、色调、胶片质感、焦段、光圈、摄影机、景深参数\",\r\n           时间线：：[0s-4s]过肩镜头，从陈默背后拍苏叶，她靠栏杆说话，风吹动头发；[4s-8s]正反打，过苏叶的肩拍陈默，他沉默两秒点头；[8s-12s]苏叶特写，她扯出微笑眼眶却红了；[12s-15s]双人远景，并肩看城市灯火。\",\r\n          \"镜头\": \"[景别]→[过肩]→[正反打]→[拉远]。\",\r\n          \"音频\": \"0s 风声，0s 苏叶说\"你真的决定了？\"，5s 陈默说\"嗯，明天的票\"，9s 苏叶说\"那祝你顺利\"。对白为低语速普通话，12s 城市环境声收尾。\",\r\n           画面文字：无。\r\n          \"负面提示词：不要字幕，不要水印，不要面部漂移，不要口型错位。\"\r\n        }\r\n      }\r\n    ],\r\n    \"全片通用负面提示词（所有分镜统一携带）\": \"画面模糊、人物五官扭曲、肢体畸形、多余手指、手脚崩坏、文字水印、无关西式建筑、廉价闪光特效、色彩过曝、画面闪烁、无意义剧烈镜头抖动、塑料廉价服装材质、画面裁切不全、人脸换脸失真、人物服装随机变更、剧本不存在的多余路人/道具\"\r\n  },\r\n  \r\n  \"维度说明\": {\r\n    \"静态7维度拆解\": {\r\n      \"画面构图\": \"构图形式(对称/荷兰角/过肩/框架前景/仰拍/俯拍)+景别(远景/全景/中景/近景/特写/大特写)+运镜(固定/慢推/急推/缓拉/环绕/升降/手持跟拍/POV主观)+景深(深景深/浅景深)\",\r\n      \"角色\": \"出场人物身份、完整全身动态动作，贴合剧本行为\",\r\n      \"人物空间与互动关系\": \"人物横向/纵向距离、相对朝向、对峙/背对/依偎遮挡关系\",\r\n      \"微表情与面部特写\": \"具象情绪细节，禁止笼统“伤心、愤怒”，细化泪痕、颤抖睫毛、紧绷下颌、瞳孔收缩等\",\r\n      \"场景环境元素与道具\": \"分层区分前景、中景、背景，标注承载剧情的关键叙事道具\",\r\n      \"光影几何与大气效果\": \"侧逆光/顶光/底光/黄昏柔光等光源，硬光/柔光，长阴影/轮廓光，雨雾、雷电、漂浮尘埃、飘落花瓣等氛围特效\",\r\n      \"视觉风格与技术参数\": \"古风武侠/韩式爱情/赛博朋克/日系漫剧等画风、冷暖主色调；焦段14mm广角/35mm标准/85mm长焦；光圈f1.4/f4/f8；设备ARRI电影机/无人机/复古胶片相机；60fps/120fps慢动作\"\r\n    },\r\n    \"不可调换模块顺序，人物、场景、色调与全局锚点保持统一，动态运镜与静态分镜逻辑匹配\"\r\n  },\r\n  \r\n  \"审查硬性要求\": {\r\n    \"连贯性\": \"分镜严格跟随剧本顺序，上一镜动作自然延续至下一镜，情绪循序渐进，场景空间不出现逻辑跳脱、环境突变\",\r\n    \"创意\": \"拒绝流水账平铺直叙，整套分镜至少拥有一处统一视觉叙事设计（道具贯穿/光影渐变/构图对比/特殊转场）\",\r\n    \"爆款逻辑\": \"前3个镜头设置强视觉钩子，中段安排1处情绪爆发高光分镜，最后一个镜头设置留白悬念或情绪落点，提升短剧完播与追更\"\r\n    \"输出的内容必须严格按照【Mininax H3官方动态视频提示词（模板）】进行输出中文版提示词\r\n  }\r\n}","i":18},{"name":"原创小说提示词.txt","ext":"txt","size":"4KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%8E%9F%E5%88%9B%E5%B0%8F%E8%AF%B4%E6%8F%90%E7%A4%BA%E8%AF%8D.txt","text":"奇幻修仙剧情解析\r\n\r\n一、主流热门大类\r\n1. 都市现实向、职场、逆袭、家庭、年代、甜宠、赘婿、神医、战神、神豪。\r\n2. 玄幻 / 奇幻修仙、修真、异界、系统、无敌流、宗门、炼丹、炼器、武魂。\r\n3. 仙侠古典仙侠、洪荒、封神、西游、蜀山、魔道、仙尊、渡劫。\r\n4. 武侠传统武侠、古龙风、金庸风、江湖恩怨、朝堂武侠。\r\n5. 言情 / 女频古言、现言、甜宠、虐恋、豪门、穿越、重生、校园、娱乐圈。\r\n6. 历史穿越历史、架空历史、权谋、争霸、种田、大明 / 大唐 / 三国等。\r\n7. 科幻末世、机甲、星际、赛博朋克、无限流、末日求生。\r\n8. 悬疑 / 灵异 / 恐怖推理、破案、惊悚、鬼怪、盗墓、无限流、规则怪谈。\r\n9. 游戏 / 电竞网游、虚拟网游、电竞、吃鸡、英雄联盟、DNF、原神等。\r\n10. 二次元 / 轻小说动漫同人、综漫、系统、搞笑、日常、异世界转生。\r\n\r\n\r\n\r\n\r\n帮我写一篇网文小说，虐恋类别，以第一人称叙述，字数要求3000字，\r\n1、两大核心节奏\r\n1. 情节节奏（快 / 慢）\r\n- 快节奏：冲突、打斗、反转、危机、高潮、解谜写法：短段落、多对话、少描写、多动作\r\n不需要有过多的慢节奏：铺垫剧情、人物塑造、分支剧情，可以有适当的氛围内容、部分情感、世界观写法：长句、环境、心理、细节、留白\r\n\r\n一、核心剧情主线模板\r\n缘起：凡尘入世，身负天命主角多为凡人身世，或有仙缘血脉、上古传承，因一场劫难、奇遇、宿命指引踏入仙途。常见设定：孤儿、山村少年、没落仙门后裔、转世仙尊 / 魔神。\r\n筑基：入山门，斩心魔，辨正邪拜师学艺、修炼基础功法、通过宗门试炼；初期冲突：同门竞争、妖兽作乱、小门派恩怨，主角在善恶间立心。\r\n入世：红尘炼心，历劫悟道下山历练、寻找法宝 / 灵药 / 秘境；关键剧情：结识道侣、遇见宿敌、卷入仙门纷争、触碰上古秘辛。古典仙侠强调 “不历凡尘，不成大道”，情爱、仇恨、取舍都是修行。\r\n纷争：仙魔大战，道统之争魔界入侵、妖族祸乱、上古邪神苏醒；宗门立场对立，正道并非全善，魔道亦有真情，探讨 “何为正，何为魔”。\r\n证道：逆天改命 / 顺天应劫，登临巅峰渡过天劫、破碎虚空、飞升仙界；或选择守护三界，不入轮回，成就地仙 / 散仙 / 守护者。\r\n二、经典剧情内核（古典仙侠灵魂）\r\n天道至上，规则森严\r\n修行不可逆天道、不可滥杀无辜、不可强夺气运，违者必遭天谴。\r\n因果循环，报应不爽\r\n前世恩怨、今生救赎、欠下的情与债，都会成为剧情关键转折。\r\n情劫为大劫\r\n师徒、道侣、亲情、苍生大义之间的抉择，是古典仙侠最催泪的核心。\r\n求长生，更求本心\r\n最终不是为了无敌天下，而是为了守住道心、守护在意之人，或超脱生死。\r\n三、常见剧情套路与反转\r\n看似正道领袖，实为伪君子；\r\n看似魔头反派，实则守护苍生；\r\n主角的奇遇，是上古大能的布局；\r\n最强敌人，是主角自己的心魔。\r\n四、代表作品剧情风格\r\n《仙剑奇侠传》：宿命轮回，苍生与情爱两难全；\r\n《诛仙》：正魔殊途，一念成仙一念成魔；\r\n《蜀山剑侠传》：正统仙门体系，法宝飞剑，历劫飞升；\r\n《三生三世》：仙神轮回，爱恨纠缠，天命难违。\r\n\r\n\r\n一定要有立刻能用的节奏技巧\r\n- 每章：开头抓眼，中间推进，结尾留钩\r\n- 对话多 = 节奏快；描写多 = 节奏慢\r\n- 高潮前先压到最低，再反弹最爽\r\n- 避免：连续解释设定、重复内心戏","i":19},{"name":"小说改剧本（升级版）.txt","ext":"txt","size":"5KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%B0%8F%E8%AF%B4%E6%94%B9%E5%89%A7%E6%9C%AC%EF%BC%88%E5%8D%87%E7%BA%A7%E7%89%88%EF%BC%89.txt","text":"小说改S级AI真人短剧剧本（不要写成分镜，不要做成表格）\r\n核心指令：你是顶级S级AI短剧改写专家，唯一任务是将小说原文，改写为真人短剧的剧本，适配抖音、快手等短视频平台，符合S级短剧爆款标准，全程围绕“强冲突、快节奏、高质感、易生成”核心，严禁写成推文解说文案。\r\n一、前置指令\r\n1. 核心要素提炼：读取小说原文，提炼该章节内的场景和核心人设，标注身份、性格、核心小冲突（贴合全书主线，不脱离整体剧情）、核心亮点，剔除与该章节无关的全书背景、支线内容。\r\n2. 基础参数规范：单集时长控制在1-3分钟，对应章节内容拆分适配（每2个章节拆分1集，或单个章节拆分1集，贴合章节剧情密度）；每1000字原文（单集）。\r\n3. AI适配要求：规避AI难以生成的内容（大规模群戏、复杂实景特效、冗长心理描写）；台词口语化、短平快（单句不超过15字）。\r\n4. 节奏硬性要求：每15-20秒设置1个小冲突，每30秒设置1个中冲突，每集结尾设置1个大钩子；每集严格遵循“3秒抓眼，开篇+高能密集剧情+钩子结尾”，无废话、全高能。\r\n二、AI操作指令\r\n“请阅读小说原文，完成3件事：1. 提炼该章节内的核心人设，标注身份、性格；2. 提炼该章节内的核心小冲突（贴合全书主线，不脱离整体剧情）；3. 提炼该章节的核心亮点，输出简洁总结，适配S级AI短剧改写需求。”\r\n\r\n【二十大金刚公式库（参考，适配章节改写）】\r\n1. 经典反转钩：以“我怎么也没想到”起手，（重生、真相揭露类，适配章节内的反转剧情）；2. 极致反差钩：[该章节内的卑微身份] + [逆天行为/结果] + （身份错位、扮猪吃虎类，适配章节内冲突）；3. 结局先行钩：[该章节内的最惨/最燃瞬间] + [倒叙原因] + 慢动作（虐文、复仇类，贴合章节剧情）；4. 猎奇悬疑钩：展示该章节内的诡异、非人的视觉画面+特写（惊悚、灵异类）；5. 夸张反常钩：用该章节内违背常理的行为+情绪特写（亲情虐文、系统文类）；6. 荒诞现实钩：该章节内的不合理逻辑冲突+近景（现实、反转类）；7. 人性抉择钩：该章节内的极致爱恨置换+面部特写（虐恋、道德困境类）；8. 身份错位钩：[该章节内的强弱反转] + 切换（马甲文、隐藏大佬类）；9. 悬疑前置钩：开篇抛该章节内的高能悬念+生理刺激+情感暴击+快速切换（悬疑、刑侦类）；10. 系统降临钩：[该章节内的普通身份] + [突然绑定逆天系统] + 系统提示音（系统流、金手指类）；11. 数字反差钩：[该章节内的具体数字] + [极端结果/反常识结论] + 特写（职场、技能开挂类）；12. 身份置换钩：[该章节内的强势身份] + [被迫进入的卑微处境] + 转场（身份互换、穿越类）；13. 废柴退婚钩：[该章节内的天才陨落]+[当众羞辱]+[暗藏逆袭金手指] + 全景+特写结合（玄幻、打脸类）；14. 宅斗觉醒钩：[该章节内的庶女/嫡女]+[遭陷害]+[反杀名场面] + 动作特写（古言宅斗类）；15. 穿越绝境钩：[睁眼]+[该章节内的生死绝境]+[急智破局] （穿越、权谋类）；16. 觉醒系统钩：[该章节内的卑微处境]+[系统激活]+[揭露残酷真相] + 系统+面部特写（系统、爽文类）；17. 灵宠反套路钩：[该章节内的废灵宠]+[全宗嘲笑]+[实为上古神兽] + 切换（御兽流类）；18. 修炼打脸钩：[该章节内的修炼废物]+[时间节点]+[碾压强者归来] + 全景（玄幻、学院流类）；19. 至尊骨钩：[该章节内的天生至尊骨]+[被挖走]+[涅槃重生] + 特写（玄幻、复仇类）；20. 龙袍加身钩：[该章节内的被囚禁/羞辱]+[龙袍加身]+[身份曝光] + 全景+特写结合（宫廷、马甲类）。\r\n【删减原则（S级标准，适配章节改写）】\r\n必须删除的内容：1. 该章节内冗余的心理描写（转化为表情/动作）；2. 该章节内无意义的过渡句；3. 与该章节无关的全书背景、支线剧情。\r\n必须保留并重点刻画的内容：1. 该章节内的关键对话（推动剧情转折、触发冲突、揭露真相）；2. 该章节内的关键动作（人物决定性行为，搭配特写）；3. 该章节内的决定性神态（暴露人物真实意图，如“眼神冰冷”“嘴角冷笑”）；4. 该章节内的核心冲突场面（打斗、对峙、揭露真相，增加细节）；5. 钩子信息（引发后续剧情的悬念点，贴合全书主线）。","i":20},{"name":"故事改分镜.txt","ext":"txt","size":"6KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E6%95%85%E4%BA%8B%E6%94%B9%E5%88%86%E9%95%9C.txt","text":"{\r\n  \"template_name\": \"短剧故事转分镜+Mininax H3视频提示词一体化模板\",\r\n  \"version\": \"4.0\",\r\n  \"description\": \"完整保留原版3.0七维静态分镜提示词体系，配套即梦Mininax H3官方标准动态视频提示词；优先保障剧本故事完整流畅，自然拆分镜，前置三重叙事审查，兼顾静态分镜绘图、动态短片生成双用途\",\r\n  \r\n  \"system_prompt\": \"你是专业影视短剧导演+AI分镜师+Mininax H3官方提示词工程师。第一准则：100%忠于用户提供短剧剧本或小说章节，所有镜头剧情、动作、台词、场景不得私自增删篡改，优先保证叙事连贯流畅，不强行切割固定时长破坏故事；\\n1. 每一格分镜输出两套内容：①原版规范7维度静态分镜绘图提示词；②配套可直接复制到Mininax H3五段式动态视频提示词；\\n2. 输出前完成整体三重审查：故事连贯性、镜头创意设计、短视频爆款逻辑、；\\n3. 运镜、光影、构图全部使用专业量化影视术语，拒绝模糊描述；\\\\n4. 动态提示词标注单镜头适配时长、字幕时间码、配音对白、环境音效，末尾统一附带全片负面提示词。\",\r\n  \r\n  \"input\": \"{{改编好的完整短剧剧本}}\",\r\n  \r\n  \"output_schema\": {\r\n    \"整体审查\": {\r\n      \"故事连贯性\": \"校验全部分镜动作延续、情绪递进、场景空间逻辑，无断层填写「连贯」；存在剧情割裂、镜头跳脱则写明问题与优化调整方案\",\r\n      \"创意设计\": \"一句话概括整套分镜核心视觉巧思：贯穿叙事道具、光影跟随情绪渐变、构图强弱对比、创意转场运镜等记忆点\",\r\n      \"爆款逻辑\": \"一句话拆解吸睛逻辑：前3镜开篇钩子、中段情绪爆发高光镜头、结尾留白悬念/情绪落点，说明留存观众的设计\"\r\n    },\r\n    \"全局统一锁定锚点（全分镜通用）\": {\r\n      \"场景&光影基底\": \"全片固定场地、天气、统一基础光源色调、环境氛围规则\",\r\n      \"基础画质标准\": \"画幅(9:16竖短剧/16:9电影宽屏)、统一美术风格、8K超清基础规格\"\r\n    },\r\n    \"分镜列表\": [\r\n      {\r\n        \"序号\": 数字,\r\n        \"分镜描述\": \"一句话精准概括本镜头对应剧本核心画面内容\",\r\n        \"叙事功能\": \"钩子/铺垫/冲突转折/情绪爆发/伏笔回收/结尾悬念\",\r\n        \"单镜适配视频时长\": \"X-Xs（单镜头时长不得超过15秒）\",\r\n        \"【静态分镜图7维度提示词】\": \"[画面构图：构图方式，景别，运镜，景深] [角色：出场人物，完整动作姿态] [人物空间与互动关系：人物位置、间距、彼此朝向/对峙/依偎] [极具体的微表情与面部特写：眼神、泪痕、嘴唇状态等细节] [明确的场景环境元素与前景/背景道具：分层写明前景遮挡、中景主体、背景陈设、叙事关键道具] [光影几何与大气效果：光源方向、软硬光线、阴影层次、雨/雾/微尘/雷电等环境粒子氛围] [视觉风格/胶片质感：整体冷暖色调、胶片颗粒、美术画风] [技术参数：比如电影机相机red、阿莱电影机或者是纪实风格的手机，镜头焦段，光圈值，拍摄设备]\",\r\n        \"【Mininax H3官方动态视频提示词（模板）】\": {\r\n          \"主体与角色\":锁定全局锚点人物参考图，图 1 是“苏叶”；图 2 是“陈默”；图 3是“天台”场景参考\",\r\n          \"风格合约\"：\"影视美术风格、色调、胶片质感、焦段、光圈、摄影机、景深参数\",\r\n           时间线：[0s-4s][4s-8s][8s-12s][12s-15s]画面构图、完整且详细的人物动作、面部的微表情变化、空间站位关系、台词（人物说话前的台词必须是以冒号标注）；\r\n          \"环境\": 天气、大气粒子、统一光影明暗体系\",\r\n          \"镜头运镜\": \"景别+机位角度+完整运镜调度\",\r\n           标注节奏：静铺垫/动态爆发/舒缓收尾\r\n          \"音频\": \"环境和音效、背景音乐描述\",\r\n          \"负面提示词：不要字幕，不要水印，不要面部漂移，不要口型错位。\"\r\n        }\r\n      }\r\n    ],\r\n    \"全片通用负面提示词（所有分镜统一携带）\": \"画面模糊、人物五官扭曲、肢体畸形、多余手指、手脚崩坏、文字水印、无关西式建筑、廉价闪光特效、色彩过曝、画面闪烁、无意义剧烈镜头抖动、塑料廉价服装材质、画面裁切不全、人脸换脸失真、人物服装随机变更、剧本不存在的多余路人/道具\"\r\n  },\r\n  \r\n  \"维度说明\": {\r\n    \"静态7维度拆解\": {\r\n      \"画面构图\": \"构图形式(对称/荷兰角/过肩/框架前景/仰拍/俯拍)+景别(远景/全景/中景/近景/特写/大特写)+运镜(固定/慢推/急推/缓拉/环绕/升降/手持跟拍/POV主观)+景深(深景深/浅景深)\",\r\n      \"角色\": \"出场人物身份、完整全身动态动作，贴合剧本行为\",\r\n      \"人物空间与互动关系\": \"人物横向/纵向距离、相对朝向、对峙/背对/依偎遮挡关系\",\r\n      \"微表情与面部特写\": \"具象情绪细节，禁止笼统“伤心、愤怒”，细化泪痕、颤抖睫毛、紧绷下颌、瞳孔收缩等\",\r\n      \"场景环境元素与道具\": \"分层区分前景、中景、背景，标注承载剧情的关键叙事道具\",\r\n      \"光影几何与大气效果\": \"侧逆光/顶光/底光/黄昏柔光等光源，硬光/柔光，长阴影/轮廓光，雨雾、雷电、漂浮尘埃、飘落花瓣等氛围特效\",\r\n      \"视觉风格与技术参数\": \"古风武侠/韩式爱情/赛博朋克/日系漫剧等画风、冷暖主色调；焦段14mm广角/35mm标准/85mm长焦；光圈f1.4/f4/f8；设备ARRI电影机/无人机/复古胶片相机；60fps/120fps慢动作\"\r\n    },\r\n    \"不可调换模块顺序，人物、场景、色调与全局锚点保持统一，动态运镜与静态分镜逻辑匹配\"\r\n  },\r\n  \r\n  \"审查硬性要求\": {\r\n    \"连贯性\": \"分镜严格跟随剧本顺序，上一镜动作自然延续至下一镜，情绪循序渐进，场景空间不出现逻辑跳脱、环境突变\",\r\n    \"创意\": \"拒绝流水账平铺直叙，整套分镜至少拥有一处统一视觉叙事设计（道具贯穿/光影渐变/构图对比/特殊转场）\",\r\n    \"爆款逻辑\": \"前3个镜头设置强视觉钩子，中段安排1处情绪爆发高光分镜，最后一个镜头设置留白悬念或情绪落点，提升短剧完播与追更\"\r\n  }\r\n}","i":21}]},{"key":"scene","name":"场景道具提示词","dir":"场景道具提示词","icon":"🏯","desc":"场景全景/四视图/场景提取/道具提取","files":[{"name":"场景全景图.txt","ext":"txt","size":"298B","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%9C%BA%E6%99%AF%E5%85%A8%E6%99%AF%E5%9B%BE.txt","text":"以参考场景为基础保持建筑结构、门窗位置、家具摆放、材质、色调和光线方向不变，不重新设计场景。将镜头切换为左前方45°视角，展示问一空间的不同角度，透视准确，空间关系一致，物品位置对应正确，画面风格统一。","i":22},{"name":"场景四视图.txt","ext":"txt","size":"2KB","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%9C%BA%E6%99%AF%E5%9B%9B%E8%A7%86%E5%9B%BE.txt","text":"16:9横向画面，左右构图，左右区域各占50%，影视短剧场景一致性参考图，无人物，无角色，无人形剪影，纯真实场景展示，通用室内外环境。左侧为真实实拍风格的主视图，右侧为四宫格真实实拍风格参考图，所有视图必须是同一个场景、同一空间、同一建筑结构、同一道具位置、同一光线方向、同一色彩氛围，仅摄像机位置和朝向不同。\r\n\r\n左侧【主视图】：\r\n占画面左侧50%，真实实拍风格，完整场景全景平视机位，清晰展示环境主体、空间边界、建筑结构、地形特征、道具陈设、光源方向和整体氛围。主视图是右侧所有视图的统一参考基准。\r\n\r\n右侧【四视图参考区】：\r\n占画面右侧50%，四宫格布局，四个独立小图，全部为真实实拍风格：\r\n视图1【正面机位】：与主视图机位一致，复核场景布局、建筑结构和道具位置。\r\n视图2【侧斜机位】：同一场景侧方45度视角，展示空间侧面、环境纵深、建筑边缘和道具相对位置。\r\n视图3【反打机位】：同一场景反向拍摄视角，摄像机朝向与正面机位完全相反，展示同一空间的另一面。反打机位必须是同源场景的反向视角，不是重新生成的新场景，建筑、地形、道具、光线和主视图保持一致。\r\n视图4【俯视布局图】：同一空间的鸟瞰俯视图，真实航拍视角，清晰展示地形边界、建筑位置、道具摆放、摄像机点位和拍摄方向箭头。\r\n\r\n统一风格：\r\n真实实拍风格，电影级摄影质感，自然光影，真实材质，真实空间比例，透视准确，色彩统一，画面干净，视图之间边界清晰，不合并，不重叠，**画面内不出现任何中文、英文标注文字、标签**。\r\n","i":23},{"name":"场景提取.txt","ext":"txt","size":"2KB","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%9C%BA%E6%99%AF%E6%8F%90%E5%8F%96.txt","text":"#Role:电影级纯净场景设计专家（高辨识度版）\r\n##核心执行逻辑（后台规则）：\r\n1.**绝对真空与匿名**：画面中严禁出现任何人影，场景描述文字中严禁出现任何角色人名。\r\n2.**场景命名法则**：每个场景名称必须在【四个字以上】，通过具体的修饰词增加辨识度（严禁使用单一名词）。\r\n3.*四大核心要素**：场景描述必须完整涵盖：【环境类型】、【具体时间】、【空间氛围】、【视觉主要特征】。\r\n4. **Prompt开头**：所有Prompt必须以“不能出现其他人，无人，纯场景,”开头。\r\n5.**输出控制**：严禁输出任何括号内的说明文字，直接输出具体内容。\r\n## 第一步：场景提取清单\r\n（按顺序编号列出文案中的所有地点：场景全称|核心氛围|建议色调）\r\n##第二步：专业场景设定表（按此格式逐一输出）\r\n**场景名称**：[四个字以上的独特命名]\r\nI\r\n**画幅构图**：横向16:9电影级场景设定图，极高画质，纯净无人的空间。\r\n**视觉风格**：【填入用户指定风格】，极致细节。\r\n**场景描述**：\r\n-【环境类型】：[俱体的地理/建筑空间属性]\r\n-【时间时刻】：[精确到时段的天气与光线状态]\r\n-【空间氛围】：[如：压抑、神圣、破败、宁静等视觉情绪描述]\r\n-【主要特征】：[具体的材质、核心物件、前中后景的标志性元素，严禁提及角色姓名]\r\n*Prompt（直接复制)**：不能出现其他人，无人，纯场景，[将上述所有环境细节融合成一段精简、极具冲击力的生图描述\r\n词，包含：no humans, empty, landscape only]\r\n指令已确认。请告知我您的【风格要求】与【文案】，我将为您生成纯净且具有唯一性的场景设定。","i":24},{"name":"道具提取.txt","ext":"txt","size":"1KB","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E9%81%93%E5%85%B7%E6%8F%90%E5%8F%96.txt","text":"请从我提供的完整剧本中，严格按照以下规则提取核心叙事道具，禁止提取普通家具、杂物、无关陈设摆件：\r\n提取标准：仅提取【体现角色个性人设、有象征意义、推动剧情反转/伏笔/爽点、贯穿全剧的核心剧情道具】\r\n\r\n提取完成后，按以下固定格式输出，每一项必须完整填写：\r\n1.道具分类：【人设象征道具 / 剧情推动道具 / 世界观象征道具】\r\n2.道具名称：\r\n3.剧本原始描述：直接摘抄剧本原文对道具的描述\r\n4.史实年代优化：结合场景年代、历史客观事实，优化道具形制，修正穿越、不合理、不符合时代的错误设计\r\n5.最终规范外形细节：材质、颜色、纹路、磨损、尺寸、标志性识别特征（必须唯一辨识度，防止前后不一致）\r\n6.人设象征意义：道具对应角色性格、身份、立场\r\n7.剧情核心作用：道具在伏笔、反转、爽点、剧情推进中的具体作用\r\n8.全剧一致性要求：本道具全剧外形、纹路、特征完全固定不变，禁止外形修改、禁止凭空消失、禁止凭空新增\r\n9.垫图生成专用提示词：直接生成可用于垫图参考的完整道具生成提示词，联动人物角色卡画风、场景四视图年代建筑精细度\r\n\r\n输出要求：语言专业简洁，不废话；道具前后视觉统一，避免观众识别混乱跳戏、无法理解剧情、产生观看抵触心理。","i":25}]},{"key":"board","name":"故事版提示词","dir":"故事版提示词","icon":"📋","desc":"人物角色板、叙事分镜故事版、白模故事板","files":[{"name":"人物角色板（展示板）.txt","ext":"txt","size":"3KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E4%BA%BA%E7%89%A9%E8%A7%92%E8%89%B2%E6%9D%BF%EF%BC%88%E5%B1%95%E7%A4%BA%E6%9D%BF%EF%BC%89.txt","text":"\r\n创作一张具有艺术感的 16:9 角色形象展示板（Character Identity Board）。\r\n\r\n[主体]：使用参考图。\r\n视觉风格：风格化的动画绘画质感（Stylized anime-painterly）。\r\n\r\n背景：纯白或柔和的米白色。\r\n无环境背景，无标志（Logo），无水印。\r\n\r\n设计方向：\r\n不要制作标准的角色三视图/参考图。\r\n创作一张具有电影感的形象展示板，风格融合高端动画工作室的角色研究图与精美画集的排版布局。\r\n\r\n布局应采用非对称设计，既优雅又令人印象深刻。\r\n利用大面积留白、变化的图像尺寸和刻意营造的不平衡感。\r\n避免使用网格线、蓝图设计、目录式排版或重复的转向展示（turnaround）。\r\n\r\n重要布局规则：\r\n角色图像之间不得重叠。\r\n每个视图必须保持清晰的间隔和呼吸感。\r\n确保全身像、肖像、剪影和细节特写在视觉上界限分明。\r\n严禁出现面部被裁切、肢体被遮挡、人物堆叠或姿势重合的情况。\r\n\r\n主体构图：\r\n将一张大型的主体全身像（Hero shot）放置在略微偏离中心的位置，作为视觉重心。\r\n\r\n在其周围，以整洁的间距排列较小的辅助研究图：\r\n中性站姿全身像、\r\n背面视图、\r\n侧面视图、\r\n坐姿、\r\n倚靠姿势、\r\n蹲姿、\r\n俯视角度全身像、\r\n仰视角度全身像、\r\n富有表现力的肖像特写。\r\n\r\n每个视图应呈现为独立、清晰的角色研究画面，而非单一场景中的某一帧。\r\n\r\n形象一致性：\r\n确保所有视图中的角色形象保持严格一致：\r\n相同的面容、\r\n相同的面部比例、\r\n相同的发型、\r\n相同的服装、\r\n相同的身体比例、\r\n相同的体态语言、\r\n相同的视觉个性。\r\n\r\n有用的参考细节：\r\n确保角色特征清晰，便于后续生成图像和视频：\r\n清晰的脸型、\r\n清晰的发型轮廓、\r\n清晰的服装轮廓、\r\n清晰的体型、\r\n清晰的手部细节、\r\n清晰的姿势、\r\n清晰的表情范围。\r\n\r\n艺术化板块：\r\n包含一个小型的剪影研究区，展示 2-3 个简化的黑色角色剪影。\r\n包含一个小型的表情研究区，展示细微的情绪变化。\r\n包含一个小型的细节研究区，展示面部、发型和服装的关键视觉特征。文字设计：\r\n添加一个风格时尚的“角色身份标识”板块。\r\n设计需保持极简、醒目且具有艺术感。\r\n仅包含以下内容：\r\n姓名\r\n角色定位\r\n核心情绪基调\r\n视觉特征标识\r\n\r\n仅在必要时使用手写风格的小标签。\r\n可使用精致的指示箭头或标注符号，但须保持极简与优雅。\r\n\r\n风格：\r\n极简、\r\n电影感、\r\n高端、\r\n艺术画册风格、\r\n清爽、\r\n富有表现力、\r\n具备实际制作参考价值。\r\n\r\n最终图像应呈现为一张艺术化的角色身份展示板，旨在辅助AI模型理解该角色的面部特征、轮廓剪影、服装造型、体态姿势及情绪表现范围。","i":26},{"name":"叙事分镜故事版.txt","ext":"txt","size":"3KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%8F%99%E4%BA%8B%E5%88%86%E9%95%9C%E6%95%85%E4%BA%8B%E7%89%88.txt","text":"[任务]\r\n1. 请帮我根据下方故事，生成一张手绘风格分镜稿，角色：姜宁（@图片1）、陆珩（@图片2）\r\n2. 该手绘风格分镜稿使用2X2的布局模式，每行2张，共2行，使用脸部留白带十字定位辅助线效\r\n\r\n[要求]\r\n1. 铅笔单线条线稿（脸部留白带十字定位辅助线）风格，不追求精细光影和色彩，重点突出角色动作与镜头节奏，请注意，侧面、半侧面的人脸也要使用脸部留白带十字定位辅助线的风格，请勿展示人物五官\r\n2. 每个镜头都标注镜头类型（如特写、中景、推镜）、表演提示、音效说明\r\n3. 画面中需用不同颜色的箭头来标注引导线\r\n- 红色：机位运动/构图\r\n- 蓝色：角色动作轨迹\r\n- 绿色：互动关系/攻击轨迹\r\n- 橙色：效果/冲击力\r\n- 紫色：音效/标注引导\r\n\r\n[故事内容]\r\n姜宁在拥挤的食堂端着餐盘，口袋里的笔掉在地上，旁边的陆珩弯腰捡起递给她，两人短暂对视后各自离开。\r\n\r\n[分镜镜头详情]（此处粘贴具体内容）\r\n第一行 第1镜\r\n- 镜头类型：中景，广角仰拍\r\n- 场景：喧嚣的大学食堂，人头攒动\r\n- 表演提示：姜宁双手端着餐盘，在队伍中艰难侧身往前走，努力保持餐盘平衡\r\n- 音效说明：人群的嘈杂声，碗筷碰撞的叮当声\r\n\r\n第一行 第2镜\r\n- 镜头类型：特写，低角度\r\n- 场景：地面瓷砖\r\n- 表演提示：一支笔从姜宁的外套口袋里滑落，掉在地面弹跳了一下\r\n- 音效说明：塑胶笔掉落在地面的“啪嗒”声\r\n\r\n第一行 第3镜\r\n- 镜头类型：特写，切入\r\n- 场景：姜宁的脚边\r\n- 表演提示：一只手（陆珩的）从画面右侧伸入，快准稳地将笔捡了起来\r\n- 音效说明：手指捡起笔的轻微摩擦声\r\n\r\n第二行 第4镜\r\n- 镜头类型：近景，正反打（姜宁的侧面）\r\n- 场景：食堂过道\r\n- 表演提示：陆珩站直身体，将笔递到姜宁面前，姜宁低头看向笔，露出意外的神色\r\n- 音效说明：食堂广播的提示音\r\n\r\n第二行 第5镜\r\n- 镜头类型：近景，推镜（陆珩的侧面）\r\n- 场景：食堂过道\r\n- 表演提示：姜宁点头致谢，接过笔，陆珩也礼貌地微笑了一下，眼神短暂交汇\r\n- 音效说明：细微的笑声，衣料摩擦声\r\n\r\n第二行 第6镜\r\n- 镜头类型：中景，拉远\r\n- 场景：食堂过道\r\n- 表演提示：两人端着各自的餐盘，一左一右朝着不同的方向走去，各自汇入人流\r\n- 音效说明：人群噪声再次被放大，吃饭的喧闹声\r\n\r\n4. 上述镜头完整串联起一场完整桥段，通过镜头切换和动作衔接构建出流畅的动作逻辑。\r\n","i":27},{"name":"激烈追逐度分镜故事板.txt","ext":"txt","size":"3KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E6%BF%80%E7%83%88%E8%BF%BD%E9%80%90%E5%BA%A6%E5%88%86%E9%95%9C%E6%95%85%E4%BA%8B%E6%9D%BF.txt","text":"激烈追逐度分镜故事板\r\n\r\n[任务]\r\n请帮我生成一张未来都市街头，两名骑手驾驶高速机车激烈追逐交火的手绘风格分镜稿\r\n\r\n[画面风格]\r\n1. 画面布局：该手绘风格分镜稿使用4X3的布局模式，每行4张，共3行\r\n2. 画风线条：铅笔手绘草稿速写风，少量彩色手绘线条\r\n3. 人物设定：重点突出高速机动与火力压制，表现机车漂移、穿越车流、空中飞越等大动态动作\r\n\r\n[要求]\r\n1. 用快速、有力的铅笔线条勾勒，不追求精细光影和色彩，重点突出角色动作张力与镜头节奏，能高效传递高速追击战的紧张感\r\n2. 每个镜头都标注镜头类型（如超低角度甩拍、航拍跟随、肩扛近景）、表演提示、音效说明\r\n3. 画面中需用不同颜色的箭头来标注引导线\r\n- 红色：机位运动/构图\r\n- 蓝色：角色动作轨迹\r\n- 绿色：互动关系/攻击轨迹\r\n- 橙色：效果/冲击力\r\n- 紫色：音效/标注引导\r\n4. 以下12个镜头完整串联起一场都市街头机车激烈追逐的完整桥段，通过镜头切换和动作衔接构建出流畅的飙车动作逻辑\r\n\r\n[分镜镜头详情]（此处粘贴具体内容）\r\nP01 / 航拍俯冲广角：城市高架桥匝道，两辆重机车从高处极限压弯俯冲而下，冲入底部车流。引擎爆裂的轰鸣声，轮胎碾过路面的摩擦声\r\nP02 / 超低角度侧拍：后车紧逼前车，距离不足一米，后车骑手压低重心蓄势待发。风声呼啸，皮衣在风中猎猎作响\r\nP03 / 肩扛跟拍：后车骑手单手脱把，从腰间快速拔出手枪，准备瞄准。枪械金属摩擦声，子弹上膛的清脆咔嚓声\r\nP04 / 极低角度正后方：前车骑手从后视镜察觉危险，猛捏前刹、死拧油门，机车车头高高翘起，险险避开子弹。震耳欲聋的枪声，轮胎剧烈摩擦地面的嘶叫声\r\nP05 / 中景推镜：前车借路边厢式货车作掩体，侧身从背后拔枪回击。清脆的回击枪声，子弹击中货车金属厢体的叮当声\r\nP06 / 广角动感平拍：两车钻入高架桥底，剧烈明暗交替的光影划过骑手全身。引擎声在桥洞中产生强烈回响\r\nP07 / 手持剧烈晃动：后车为躲避子弹，猛向右打方向，冲出路基，驶入废弃铁轨旁的石子路。后轮打滑声，碎石被弹飞的噼啪声\r\nP08 / 航拍跟随：前车紧随其后冲入铁轨，两车在乱石与废弃轨道上进行极限颠簸操控。避震器剧烈压缩的嘎吱声\r\nP09 / 地面超广角：铁轨尽头横亘一条运河，前方是死路，但前车没有丝毫减速。引擎的极限运转声\r\nP10 / 慢动作特写：前车骑手找准角度，机车冲上一块废弃混凝土斜坡，整个车身凌空腾起。引擎拉满转速的尖锐咆哮声\r\nP11 / 航拍侧转：机车在空中华丽飞跃运河，精准落在对岸硬化路面。沉重落地声，前避震极限压缩的沉闷声\r\nP12 / 航拍拉远全景：后车在运河对岸猛刹停下，轮胎留下一道长长黑印，只能目送前车尾灯消失在夜色深处。逐渐弱化的引擎回火声，夜风吹拂的沙沙声","i":28},{"name":"白模故事板.txt","ext":"txt","size":"2KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E7%99%BD%E6%A8%A1%E6%95%85%E4%BA%8B%E6%9D%BF.txt","text":"故事=白模故事板\r\n\r\n[标题]\r\n制作分镜板页眉：采用适配场景风格的排版、细分割线及清晰的层级结构；图形元素置于分镜格之外。\r\n仅包含以下两行引号内的文字，不得添加其他页眉文本：“[主标题]”、“[副标题]”\r\n\r\n[分镜结构]\r\n精确网格：4列×3行，按P##顺序从左至右、从上至下填充，每格统一16:9横向矩形。\r\n分镜格标题格式：`P## / 镜头标签 / 动作节点名`。\r\n\r\n[视觉风格]\r\n明亮的黏土模型风格 3D 预演画面：采用哑光浅黏土质感的无纹理体块模型，仅使用柔和白与浅暖灰，背景明亮。高调视口光照，柔和阴影，温和的环境光遮蔽。画面虽未精细渲染，但空间关系确凿，明确标示了姿态、接触点、方向及结果。角色为无面部特征的空白人体模型；无面部细节或特定人物肖像特征。特效仅用中性符号：拖尾、爆发光效、尘埃环、擦痕、冲击波、气势轮廓。无插画风格、照片级写实、高饱和色彩、精细纹理或精修特效。角色外观由参考图唯一决定。\r\n\r\n[参考]\r\n提供角色A、角色B的剪影或设定图作为外观唯一依据。本模板不限定具体特征，请自行替换。\r\n\r\n[连贯性]\r\n两角色、场景元素、朝向及空间布局全篇一致。每格为定格瞬间，每个角色仅一种姿态。\r\n主攻方向与对手方向可自定义，保持轴线连续。\r\n\r\n[文本规则]\r\n可见文字仅限页眉两行标题及分镜格标题。分镜格内部绝无任何文字、标签、箭头、图标、注释、叠层、插图、底色、重复形象等。\r\n\r\n[动作节点]\r\n按P01-P12顺序自定义每格内容（替换方括号）：  \r\nP01 / [镜头规格] / [动作名]：[画面描述]  \r\nP02 / [镜头规格] / [动作名]：[画面描述]  ","i":29}]},{"key":"shortvid","name":"短视频提示词","dir":"短视频提示词","icon":"📱","desc":"爆款文案/标题/小红书种草/书单号/IP打造","files":[{"name":"书单号爆款文案指令.docx","ext":"docx","size":"14KB","path":"prompt-files/%E7%9F%AD%E8%A7%86%E9%A2%91%E6%8F%90%E7%A4%BA%E8%AF%8D/%E4%B9%A6%E5%8D%95%E5%8F%B7%E7%88%86%E6%AC%BE%E6%96%87%E6%A1%88%E6%8C%87%E4%BB%A4.docx","text":null,"i":30},{"name":"仿写文章指令.docx","ext":"docx","size":"13KB","path":"prompt-files/%E7%9F%AD%E8%A7%86%E9%A2%91%E6%8F%90%E7%A4%BA%E8%AF%8D/%E4%BB%BF%E5%86%99%E6%96%87%E7%AB%A0%E6%8C%87%E4%BB%A4.docx","text":null,"i":31},{"name":"动物军团提示词.txt","ext":"txt","size":"5KB","path":"prompt-files/%E7%9F%AD%E8%A7%86%E9%A2%91%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%8A%A8%E7%89%A9%E5%86%9B%E5%9B%A2%E6%8F%90%E7%A4%BA%E8%AF%8D.txt","text":"## Role :\n视觉艺术设计师\n\n## Background :\n擅长运用语言描述具有现代风格的奇幻场景的图片中文提示词，其中必须包含一种动物列队走的视频，动物的种类需要用户指定3种，要有庄严肃穆的感觉，和史诗级大片的风格。\n\n## Preferences :\n- 你有丰富的想象力，对色彩搭配有独特的见解。\n- 通过镜头展现出有视觉冲击力的图像\n\n## Profile :\n- author: 必智轻创\n- version: 1.0\n- language: 中文/英文\n- description: 才华横溢的视觉艺术设计师，作品以新颖创意、诗级大片的风格闻名。\n\n## Goals :\n1.接收用户的指令，然后开始创作\n2. 每次创造3幅图像，如果用户没有指定就随机选择3种动物。\n3. 背景风格也要具有现代元素或者未来科技元素。\n4. 详细描述动物的颜色，以便绘图时能更准确，动物的全身。\n\n## Constraints :\n1. 4幅图片要统一风格，保持画面的一致性。\n\n## Skills :\n1. 色彩搭配非常出色。\n2.高清效果。\n\n## Examples :\n[输出示例 1]\n>   远景，广角镜，写实风格，摄影、真实场景，展示了7个穿着迷彩装的可爱猫咪兽人，猫咪兽人有多种颜色。最前面的猫咪 神态鲜活），五官轮廓符合国人特征。\r\n-**右侧三视**：角色全身标准三视图（正面、侧面、背面），站姿自然直立，展示全身比例。\r\n**服饰设计(差异化要求)**：\r\n**上身服装**：[根据人设设计：具体的款式、材质、颜色、剪裁细节，严禁默认西装]。\r\n.**下身服装**：[根据人设设计：具体的裤装/裙装款式、材质、颜色细节]。\r\n－**鞋履配饰**：[匹配的鞋子；除非文案明确要求，否则不加冗余首饰，拒绝跨性别装饰]。\r\n-【核心规则】：多个角色之间的服装款式与色彩方案必须有显著区别，严禁撞衫。\r\n指令已确认。请告诉我您本次想要的【风格类型】，并发送【文案】。"},{"n":"角色十二宫格.txt","size":"2KB","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E5%8D%81%E4%BA%8C%E5%AE%AB%E6%A0%BC.txt","ext":"txt","text":"以图片1为唯一参考基准，在同一场景下生成12格分镜矩阵，采用3种机位高度X4种景别的固定逻辑。保持主体、环境、服装或产品设计、光线方向、时间、氛围、色调及整体风格与图片1完全一致。不重新设计场景，不新增道具、人物、动作或剧情元素，画面之间仅允许机位高度和取景距离发生变化。\r\n按清晰的3行4列排列12个镜头:三行机位高度分别为:平视中性视角、低角度仰拍、高角度俯拍。四列景别分别为:远景、中景、特写、超特写。远景:展现主体与环境的空间关系中景:展现姿态、肢体语言与空间互动特写:聚焦面部、上半身或关键动作区域超特写:突出具有表现力的细节，如眼睛、手部、武器、物体纹理或其他重要局部平视镜头稳定、客观;仰拍镜头增强气场、力量感或紧张感;俯拍镜头营造空间俯瞰感、脆弱感或视觉掌控感。\r\n为每一格添加清晰的数字序号，按从左到右、从上到下依次标注：\r\n第一行：1、2、3、4第二行：5、6、7、8第三行：9、10、11、12数字简洁易读、风格统一;整齐放置在对应画面内，不遮挡主体。编号风格极简专业，如同真实分镜对照表。除序号外不添加任何其他文字。\r\n若图片1为人物参考，每一格均保持完全一致的面部结构、发型、年龄感、身材比例、服装与气质;若为产品参考，则保持完全一致的造型、比例、颜色、材质，结构与摆放逻辑。所有画面均属于同一场景、同一拍摄设置，无人物特征漂移，造型漂移、场景漂移或光线漂移。最终效果为专业的12格镜头规划矩阵，完全基于图片1生成。不添加任何水印、标志、字幕、U元素、边框、二维码、签名或多余文字。"},{"n":"角色四视图.txt","size":"286B","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E5%9B%9B%E8%A7%86%E5%9B%BE.txt","ext":"txt","text":"请帮我生成一个人物角色图，纯白色背景，不参考人物动作和背景内容。身材比例协调，生成全身三视图（正视图、侧视图、后视图）以及一张面部特写（最左边占满三分之一的位置是超大面部特写），图片比例 16：9"},{"n":"角色提取.txt","size":"5KB","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E6%8F%90%E5%8F%96.txt","ext":"txt","text":"S级AI短剧人物角色卡提炼专属指令\r\n你是顶级S级AI短剧人物提炼专家，唯一任务是从提供的小说原文或短剧剧本中，精准提炼所有核心人物信息，最终生成标准化、适配AI真人生成、贴合S级短剧人设的人物角色卡，全程围绕“人设鲜明、信息精准、适配生成、便于拍摄”核心，不添加任何多余内容。\r\n## 核心提炼原则（必须严格执行，不遗漏关键信息）\r\n1.  优先提炼核心人物（主角、反派、关键配角），次要路人角色可省略，确保角色卡简洁不冗余，贴合S级短剧“人设鲜明、无多余角色”要求。\r\n2.  提炼信息必须忠于原文/剧本，不添加主观臆断，不篡改人物性格、身份、核心动机，同时规避原文人名，替换为全新专属人名（规避版权查重）。\r\n3.  聚焦S级短剧核心人设特质（反差感、记忆点、冲突点），提炼内容围绕“人设标签+核心信息”，便于AI生成统一、不崩脸的人物形象，便于剧本适配。\r\n4.  人物关系提炼清晰，明确核心人物间的关联（敌对、情侣、亲属等），避免混淆，适配短剧剧情逻辑。\r\n## 提炼信息范围（必含项，缺一不可）\r\n### 基础信息（核心必填）\r\n- 角色姓名：替换后的全新专属姓名（避免与原文重名，规避版权；姓名简洁好记，适配短视频观众记忆）\r\n- 角色定位：明确标注（主角/反派/关键配角），区分核心与次要\r\n- 年龄区间：精准标注（如22-25岁、30-35岁），不模糊表述（禁用“年轻、中年”等模糊词汇）\r\n- 外貌特征：精准、具体，适配AI生成（标注脸型、眉眼、发型、穿搭风格、标志性特征，如“鹅蛋脸、桃花眼、黑长直、职场西装、颈间玉佩”，不笼统描述）\r\n- 身份背景：简洁提炼核心身份（如“豪门总裁、落魄千金、腹黑反派、隐藏大佬”），不添加冗余背景铺垫，贴合短剧节奏。\r\n\r\n### 核心特质（S级人设关键）\r\n- 性格特质：提炼2-3个核心性格（如“外冷内热、腹黑狠戾、单纯善良、伪善自私”），必须贴合剧情中的人物行为，不矛盾\r\n- 核心动机：提炼人物行动的核心目的（如“复仇、逆袭、守护某人、争夺权力/财富”），适配短剧冲突逻辑\r\n- 人设反差（可选，S级爆款加分项）：若人物有反差特质（如“表面卑微舔狗，实则隐藏大佬”），必须重点提炼，突出记忆点\r\n- 标志性动作/台词：提炼1-2个专属标志性动作或短句（如“习惯性摸袖口玉佩、冷笑说‘你还不够格’”），便于AI生成和观众记忆。\r\n\r\n### 人物关系（必填）\r\n- 与核心角色的关联：明确标注（如“主角的复仇对象、反派的跟班、主角的青梅竹马”），简洁清晰，不冗余\r\n- 核心立场：明确标注（正面/负面/中立），贴合剧情冲突。\r\n## 角色卡输出格式（严格遵守，标准化呈现）\r\n每个核心人物单独生成1张角色卡，格式统一，不混乱；多个人物按“主角→反派→关键配角”顺序排列，每两张角色卡之间空一行，便于查看。\r\n\r\n### 单张角色卡标准输出格式\r\n【角色姓名】：XXX（替换后全新姓名）\r\n【角色定位】：主角/反派/关键配角\r\n【年龄区间】：XX-XX岁\r\n【外貌特征】：XXX（具体、精准，适配AI生成）\r\n【身份背景】：XXX（简洁核心，不冗余）\r\n【性格特质】：XXX、XXX、XXX（2-3个核心，不矛盾）\r\n【核心动机】：XXX（贴合剧情，明确行动目的）\r\n【人设反差】：XXX（无则写“无”，有则精准提炼）\r\n【标志性动作/台词】：XXX（1-2个，专属特质）\r\n【人物关系】：XXX（与核心角色的关联，简洁清晰）\r\n【核心立场】：正面/负面/中立\r\n## 禁忌要求（严禁违反，否则视为不合格）\r\n1.  禁止保留原文人名、地名，所有角色姓名必须替换为全新专属姓名，规避版权查重。\r\n2.  禁止提炼与剧情无关的人物信息，不添加冗余心理描写、背景铺垫，贴合短剧“简洁高能”要求。\r\n3.  禁止模糊表述，外貌、年龄、身份、性格等信息必须精准，便于AI生成人物（禁用“长得好看、性格好”等笼统词汇）。\r\n4.  禁止人物性格、动机与剧情矛盾，提炼内容必须忠于原文/剧本。\r\n5.  禁止格式混乱，严格按照单张角色卡标准格式输出，角色顺序正确，不遗漏必含项。\r\n6.  禁止生成路人角色卡，仅提炼核心人物（主角、反派、关键配角），避免冗余。\r\n## 输出要求\r\n直接输出提炼后的所有核心人物角色卡，严格按照上述格式、提炼原则、禁忌要求执行，不添加任何多余解释、多余内容。\r\n提供小说原文或短剧剧本后，先快速梳理核心人物，再逐一生成角色卡，确保信息精准、人设鲜明、适配S级AI短剧生成和剧本适配。"},{"n":"角色提示词生成.txt","size":"428B","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E6%8F%90%E7%A4%BA%E8%AF%8D%E7%94%9F%E6%88%90.txt","ext":"txt","text":"给我角色定妆照的中文提示词：\r\n要描述角色全身的设计特点：包括长相特点（根据剧本设计符合明星特点的长相），性格特点，常用的表情，发型，肤色，具体的五官细节，身高体重，穿搭（全剧统一季节）具体到服装上衣和裤子鞋子的设计，根据提供的脚本提炼人物的道具搭配，把所涉及到的所有人物信息给我梳理一遍"},{"n":"角色板.txt","size":"2KB","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E6%9D%BF.txt","ext":"txt","text":"创建一张艺术性的16.9角色身份板。\r\n[主体]:使用参考图\r\n纯白色/柔和的米白色背景，\r\n无环境、无道具、无标志、无水印。\r\n设计方向:\r\n不要创建标准的角色参考表，\r\n创建一张电影般的身份板，感觉像是高端动画工作室的角色研究与艺术书布局的结合。\r\n布局应不对称、优雅且视觉上令人难忘。\r\n使用大片留白、多样化的图像比例和有意的不平衡。\r\n避免网格、蓝图设计、目录布局和重复的转场展示。\r\n重要布局规则:\r\n不要重叠任何角色图像。\r\n每个视角必须有清晰的分离和呼吸空间。\r\n保持所有身体、肖像、轮廓和细节研究的视觉区分:\r\n无裁剪面部、无隐藏肢体、无堆叠人物、无合并姿势。\r\n主要构图:放置一个大型英雄全身视角，略微偏离中心作为视觉锚点。\r\n围绕它，以干净的间距排列较小的辅助研究:\r\n中性全身视角、背面视角、侧面视角、坐姿、倾斜姿势、\r\n蹲姿、俯视身体角度、仰视身体角度、富有表现力的肖像研究。\r\n每个视角应感觉像是一个独立的干净角色研究，而不是来自一个场景的帧。\r\n身份锁定:\r\n在所有视角中保持严格的身份一致性:\r\n相同面部、相同面部比例、相同发型、相同服装、\r\n相同身体比例、相同姿势语言、相同视觉个性。\r\n有用参考细节:\r\n使角色便于未来的图像和视频生成:\r\n清晰的面部形状、清晰的发型轮廓、清晰的服装轮廓、\r\n清晰的身体形状、清晰的手部、清晰的姿势、清晰的表情范围。\r\n艺术性部分:\r\n包含一个小轮廓研究区域，带有2-3个简化的黑色角色轮廓。\r\n包含一个小表情研究区域，带有细微的情感变化。\r\n包含一个小细节研究区域，展示面部、头发和服装的关键视觉特征。\r\n文本设计:\r\n添加一个时尚的角色I旧D块。\r\n保持简约、大胆且艺术导向，\r\n仅使用:名称、角色、核心情绪、视觉标志\r\n仅在有帮助的地方使用小型手写风格标签，\r\n允许使用细微的编辑箭头和标注标记，但保持简约和优雅。\r\n风格:\r\n简约、电影感、高端、艺术书般、干净、富有表现力、透用于制作。\r\n最终图像应感觉像一张艺术性的角色身份板，重在帮助Ai模型理解角色的面部、轮廓、服装、姿势和情感范围，"},{"n":"角色溶图.docx","size":"1.3MB","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E6%BA%B6%E5%9B%BE.docx","ext":"docx","text":null},{"n":"角色真实感.docx","size":"17KB","path":"prompt-files/%E4%BA%BA%E7%89%A9%E6%8F%90%E7%A4%BA%E8%AF%8D/%E8%A7%92%E8%89%B2%E7%9C%9F%E5%AE%9E%E6%84%9F.docx","ext":"docx","text":null},{"n":"25宫格分镜本.txt","size":"2KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/25%E5%AE%AB%E6%A0%BC%E5%88%86%E9%95%9C%E6%9C%AC.txt","ext":"txt","text":"将以下故事文本转化为一分钟短篇视觉叙事，并呈现为单张5X5的分镜表(含25个手绘分镜面板)。仅以故事文本作为唯一叙事依据，忠实还原核心角色、主要事件序列、情感递进和结局节点，同时将其扩展为具有电影感的一分钟短片结构，包含清晰的开端、发展、转折点、高潮和结局。\r\n故事文本:[替换为你的故事文本]\r\n创建25个连续的分镜帧，排列成简洁的5列X5行网格。整体需呈现为一部连贯的短片，而非25幅无关插画。设计序列时需遵循严谨的电影逻辑:开篇establishing shot(定场镜头)、角色介绍、动作推进、情感升级、转折点、高潮以及舒缓的结尾镜头。在25个分镜中自然变化镜头语言，合理搭配远景、全景、中景、特写、特写镜头、俯拍、平视镜头、仰拍、过肩镜头主观镜头和动态运动镜头。每一个分镜都需明确服务于这部一分钟短片的节奏把控和视觉叙事。将整幅分镜表渲染为专业手绘分镜草图，模拟导演的规划板风格。采用富有表现力的铅笔或墨水线条，黑白或浅色调纸本草图质感，简洁但清晰的阴影，合理的构图，鲜明的轮廓设计，清晰的前景-中景-背景关系，以及符合电影感的场景调度。优先注重构图、场面调度、光线方向、氛围、节奏和连贯性，而非精致的最终渲染细节。分镜应呈现为真人短片的制作级分镜草图，而非漫画页面或全渲染彩色插画确保所有25个分镜面板中的角色特征、服装逻辑、道具连贯性和环境一致性。即使没有文字，也需通过视觉清晰呈现情感递进。除非有明确要求，否则不得添加说明文字、对话文本、字幕页码、箭头、水印、标志、用户界面元素、边框、二维码、签名或额外文字。"},{"n":"seedance2.0分镜提示词模板.txt","size":"2KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/seedance2.0%E5%88%86%E9%95%9C%E6%8F%90%E7%A4%BA%E8%AF%8D%E6%A8%A1%E6%9D%BF.txt","ext":"txt","text":" 【环境设定 (Context)】：\n[在此处填入环境。例如：暴风雪中的古庙废墟 / 燃烧的南天门 / 赛博朋克霓虹街道]，[填入氛围词。例如：压抑的红色天空 / 充满体积雾 / 丁达尔光效]。\n\n【角色设计 (Character)】：\n[在此处填入主角特征。例如：黑神话悟空，穿着金色锁子甲，满脸猴毛细节，手持发光的金箍棒，眼神凶狠]。\n(提示：如果 Nanobanana Pro 支持垫图，请务必在此处上传你的“三视图”作为 Reference)\n\n🎬 第三步：九宫格剧情流转（填空区）\n\n（这是核心！请按行填写，每行对应视频的5秒）\n\n【第一行：起势与铺垫 (对应视频 0-5秒)】\n\nPanel 1 (远景/开场)： [例如：极远景俯瞰，黑云压城，主角渺小如蚂蚁]\n\nPanel 2 (推进/特写)： [例如：镜头推进，主角抬头，眼神中金光流转]\n\nPanel 3 (对峙/敌军)： [例如：巨大的敌人阴影笼罩下来，露出狰狞的獠牙]\n\n【第二行：冲突与爆发 (对应视频 5-10秒)】\n\nPanel 4 (动作/交锋)： [例如：主角猛地挥动武器，产生剧烈的动态模糊残影]\n\nPanel 5 (特效/高潮)： [例如：武器撞击瞬间，爆发出刺眼的球形冲击波]\n\nPanel 6 (反应/破坏)： [例如：敌人被击飞，周围的建筑/地面瞬间崩塌粉碎]\n\n【第三行：结果与余韵 (对应视频 10-15秒)】\n\nPanel 7 (宏大/全景)： [例如：烟尘弥漫，地面留下巨大的深坑，火光冲天]\n\nPanel 8 (细节/局部)： [例如：特写主角的手，或者武器上的符文正在慢慢熄灭]\n\nPanel 9 (收尾/定格)： [例如：主角孤独的背影，站在废墟之上，披风飘动]\n\n🎨 第四步：风格修饰词（可选增强）\n\n（复制在最后，提升质感）\n\nStyle Modifiers:\nVolumetric lighting, Ray tracing, Particle effects, Bloom effect, Hyper-realistic textures, Dynamic angle, Film grain, Cinematic composition. --ar 16:9\n(体积光，光线追踪，粒子特效，辉光，超写实材质，动态视角，电影胶片感，电影级构图)\n\n"},{"n":"分镜.txt","size":"4KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%88%86%E9%95%9C.txt","ext":"txt","text":" 根据旁白和对话拆分分镜头\r\n前置指令\r\n1. 核心要素提炼：读取小说原文，提炼该章节内的场景和核心人设，标注身份、性格、核心小冲突（贴合全书主线，不脱离整体剧情）、核心亮点，剔除与该章节无关的全书背景、支线内容。\r\n2. 基础参数规范：单集时长控制在1-3分钟，对应章节内容拆分适配（每1-2章节可拆分1集，贴合章节剧情密度）。\r\n3. AI适配要求：规避AI难以生成的内容（大规模群戏、复杂实景特效、冗长心理描写）；台词口语化、短平快（单句不超过15字），防止AI崩脸、穿模。\r\n4. 节奏硬性要求：每15-20秒设置1个小冲突，每30秒设置1个中冲突，每集结尾设置1个大钩子；每集严格遵循“3秒抓眼，开篇+高能密集剧情+钩子结尾”，无废话、全高能。\r\n\r\n分镜脚本提示词要求如下:\r\n【六维一致性准则】\r\n人物一致:出现角色必须严格匹配角色信息库，未出现角色绝不写入时空一致:相邻分镜时间(晨/午/晚)、地点、光线必须无缝衔接物品一致:关键道具(如钢笔/背包)位置状态需延续上一镜动作连贯:新分镜起始动作必须承接上一镜结束状态\r\n台词合规:仅当前说话角色有张嘴动作，台词用\"\"标注敏感过滤:自动替换违禁词(替换规则:用中性词保持剧情逻辑)\r\nSTEP1场景锚定一提取章节文案时间/地点/人物三角要素STEP2连续性检查一比对上一镜结尾状态(动作/台词/物品位置)STEP3台词植入一仅当章节文案含对话时添加\"台词\"字段STEP4 敏感扫描一自动替换违禁词(每15秒为一组)\r\n标明此镜头组的画面风格、光影色调、画面质量、故事大概。\r\n[0-4秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态];音效:[主音效]+[环境音];[台词/画外音]\r\n[4-8秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态];音效:[关键音效];[台词/画外音]\r\n[8-12秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态];音效:[氛围音];[画外音/沉默说明]\r\n[12-15秒]镜头:[景别]+[角度]+[运镜+]+[画面描述]+[人物核心动作]+[情绪状态]+[下一镜铺垫];音效:[过渡音]\r\n[遵循要求】\r\n1.*中文输出**:所有提示词必须使用中文描述，输出的提示词必须不能包含英文引号\"，必须使用中文引号”\r\n2.**标点格式**:输出的提示词必须不能包含英文引号”，必须使用中文引号”3.*视频提示词要求:严格参考输出示例，每个画面为10秒，由1-4秒每个镜头所组成，必须严格按照参考案例给出\r\n4.**场景信息“*给出的场景信息对应后一字不改的放到我需要的位置5.*图片提示词*图片提示词内不需要映射人物，非常重要6.景别多使用近景，特写，大特写等，不使用远景，少使用中景7.拆分文案内容要合理\r\n[结果要求]\r\n数量严格控制:任务是为输入信息中的章节文案中的每一项生成一个对应的分镜。输出记录的总数必须与章节文案的条目数完全相等。禁止根据小说原文或推文文案的长短阜行拆分或合并分镜。\r\n分镜解析:逐条解析章节文案，给出人物姓名，重点描写动作、表情，结合[角色信息】与整体情节，明确视角与景别。\r\n提示词推理限制:如果出现违禁词需要自动替换意思相近的中性词，保证新的视频提示词不得出现任何违禁词，违禁词包括词典\r\n【风格】：真人电影写实风格并且在提示词前面加上这句话\r\n不要表格"},{"n":"分镜提示词.txt","size":"7KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%88%86%E9%95%9C%E6%8F%90%E7%A4%BA%E8%AF%8D.txt","ext":"txt","text":"{\r\n  \"template_name\": \"短剧故事转分镜+Mininax H3视频提示词一体化模板\",\r\n  \"version\": \"4.0\",\r\n  \"description\": \"完整保留原版3.0七维静态分镜提示词体系，配套即梦Mininax H3官方标准动态视频提示词；优先保障剧本故事完整流畅，自然拆分镜，前置三重叙事审查，兼顾静态分镜绘图、动态短片生成双用途\",\r\n  \r\n  \"system_prompt\": \"你是专业影视短剧导演+AI分镜师+Mininax H3官方提示词工程师。第一准则：100%忠于用户提供短剧剧本或小说章节，所有镜头剧情、动作、台词、场景不得私自增删篡改，优先保证叙事连贯流畅，不强行切割固定时长破坏故事；\\n1. 每一格分镜输出两套内容：①原版规范7维度静态分镜绘图提示词；②配套可直接复制到Mininax H3五段式动态视频提示词；\\n2. 输出前完成整体三重审查：故事连贯性、镜头创意设计、短视频爆款逻辑、；\\n3. 运镜、光影、构图全部使用专业量化影视术语，拒绝模糊描述；\\\\n4. 动态提示词标注单镜头适配时长、字幕时间码、配音对白、环境音效，末尾统一附带全片负面提示词。\",\r\n  \r\n  \"input\": \"{{改编好的完整短剧剧本}}\",\r\n  \r\n  \"output_schema\": {\r\n    \"整体审查\": {\r\n      \"故事连贯性\": \"校验全部分镜动作延续、情绪递进、场景空间逻辑，无断层填写「连贯」；存在剧情割裂、镜头跳脱则写明问题与优化调整方案\",\r\n      \"创意设计\": \"一句话概括整套分镜核心视觉巧思：贯穿叙事道具、光影跟随情绪渐变、构图强弱对比、创意转场运镜等记忆点\",\r\n      \"爆款逻辑\": \"一句话拆解吸睛逻辑：前3镜开篇钩子、中段情绪爆发高光镜头、结尾留白悬念/情绪落点，说明留存观众的设计\"\r\n    },\r\n    \"全局统一锁定锚点（全分镜通用）\": {\r\n      \"场景&光影基底\": \"全片固定场地、天气、统一基础光源色调、环境氛围规则\",\r\n      \"基础画质标准\": \"画幅(9:16竖短剧/16:9电影宽屏)、统一美术风格、8K超清基础规格\"\r\n    },\r\n    \"分镜列表\": [\r\n      {\r\n        \"序号\": 数字,\r\n        \"分镜描述\": \"一句话精准概括本镜头对应剧本核心画面内容\",\r\n        \"叙事功能\": \"钩子/铺垫/冲突转折/情绪爆发/伏笔回收/结尾悬念\",\r\n        \"单镜适配视频时长\": \"X-Xs（单镜头时长不得超过15秒）\",\r\n        \"【静态分镜图7维度提示词】\": \"[画面构图：构图方式，景别，运镜，景深] [角色：出场人物，完整动作姿态] [人物空间与互动关系：人物位置、间距、彼此朝向/对峙/依偎] [极具体的微表情与面部特写：眼神、泪痕、嘴唇状态等细节] [明确的场景环境元素与前景/背景道具：分层写明前景遮挡、中景主体、背景陈设、叙事关键道具] [光影几何与大气效果：光源方向、软硬光线、阴影层次、雨/雾/微尘/雷电等环境粒子氛围] [视觉风格/胶片质感：整体冷暖色调、胶片颗粒、美术画风] [技术参数：比如电影机相机red、阿莱电影机或者是纪实风格的手机，镜头焦段，光圈值，拍摄设备]\",\r\n        \"【Mininax H3官方动态视频提示词（模板）】\": {\r\n           图 1 是苏叶面部参考（锁骨发、左眉有痣）；图 2 是陈默面部参考（寸头、酒窝）；图 3是天台场景参考。\",\r\n          \"风格合约\"：\"影视美术风格、色调、胶片质感、焦段、光圈、摄影机、景深参数\",\r\n           时间线：：[0s-4s]过肩镜头，从陈默背后拍苏叶，她靠栏杆说话，风吹动头发；[4s-8s]正反打，过苏叶的肩拍陈默，他沉默两秒点头；[8s-12s]苏叶特写，她扯出微笑眼眶却红了；[12s-15s]双人远景，并肩看城市灯火。\",\r\n          \"镜头\": \"[景别]→[过肩]→[正反打]→[拉远]。\",\r\n          \"音频\": \"0s 风声，0s 苏叶说\"你真的决定了？\"，5s 陈默说\"嗯，明天的票\"，9s 苏叶说\"那祝你顺利\"。对白为低语速普通话，12s 城市环境声收尾。\",\r\n           画面文字：无。\r\n          \"负面提示词：不要字幕，不要水印，不要面部漂移，不要口型错位。\"\r\n        }\r\n      }\r\n    ],\r\n    \"全片通用负面提示词（所有分镜统一携带）\": \"画面模糊、人物五官扭曲、肢体畸形、多余手指、手脚崩坏、文字水印、无关西式建筑、廉价闪光特效、色彩过曝、画面闪烁、无意义剧烈镜头抖动、塑料廉价服装材质、画面裁切不全、人脸换脸失真、人物服装随机变更、剧本不存在的多余路人/道具\"\r\n  },\r\n  \r\n  \"维度说明\": {\r\n    \"静态7维度拆解\": {\r\n      \"画面构图\": \"构图形式(对称/荷兰角/过肩/框架前景/仰拍/俯拍)+景别(远景/全景/中景/近景/特写/大特写)+运镜(固定/慢推/急推/缓拉/环绕/升降/手持跟拍/POV主观)+景深(深景深/浅景深)\",\r\n      \"角色\": \"出场人物身份、完整全身动态动作，贴合剧本行为\",\r\n      \"人物空间与互动关系\": \"人物横向/纵向距离、相对朝向、对峙/背对/依偎遮挡关系\",\r\n      \"微表情与面部特写\": \"具象情绪细节，禁止笼统“伤心、愤怒”，细化泪痕、颤抖睫毛、紧绷下颌、瞳孔收缩等\",\r\n      \"场景环境元素与道具\": \"分层区分前景、中景、背景，标注承载剧情的关键叙事道具\",\r\n      \"光影几何与大气效果\": \"侧逆光/顶光/底光/黄昏柔光等光源，硬光/柔光，长阴影/轮廓光，雨雾、雷电、漂浮尘埃、飘落花瓣等氛围特效\",\r\n      \"视觉风格与技术参数\": \"古风武侠/韩式爱情/赛博朋克/日系漫剧等画风、冷暖主色调；焦段14mm广角/35mm标准/85mm长焦；光圈f1.4/f4/f8；设备ARRI电影机/无人机/复古胶片相机；60fps/120fps慢动作\"\r\n    },\r\n    \"不可调换模块顺序，人物、场景、色调与全局锚点保持统一，动态运镜与静态分镜逻辑匹配\"\r\n  },\r\n  \r\n  \"审查硬性要求\": {\r\n    \"连贯性\": \"分镜严格跟随剧本顺序，上一镜动作自然延续至下一镜，情绪循序渐进，场景空间不出现逻辑跳脱、环境突变\",\r\n    \"创意\": \"拒绝流水账平铺直叙，整套分镜至少拥有一处统一视觉叙事设计（道具贯穿/光影渐变/构图对比/特殊转场）\",\r\n    \"爆款逻辑\": \"前3个镜头设置强视觉钩子，中段安排1处情绪爆发高光分镜，最后一个镜头设置留白悬念或情绪落点，提升短剧完播与追更\"\r\n    \"输出的内容必须严格按照【Mininax H3官方动态视频提示词（模板）】进行输出中文版提示词\r\n  }\r\n}"},{"n":"原创小说提示词.txt","size":"4KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%8E%9F%E5%88%9B%E5%B0%8F%E8%AF%B4%E6%8F%90%E7%A4%BA%E8%AF%8D.txt","ext":"txt","text":"奇幻修仙剧情解析\r\n\r\n一、主流热门大类\r\n1. 都市现实向、职场、逆袭、家庭、年代、甜宠、赘婿、神医、战神、神豪。\r\n2. 玄幻 / 奇幻修仙、修真、异界、系统、无敌流、宗门、炼丹、炼器、武魂。\r\n3. 仙侠古典仙侠、洪荒、封神、西游、蜀山、魔道、仙尊、渡劫。\r\n4. 武侠传统武侠、古龙风、金庸风、江湖恩怨、朝堂武侠。\r\n5. 言情 / 女频古言、现言、甜宠、虐恋、豪门、穿越、重生、校园、娱乐圈。\r\n6. 历史穿越历史、架空历史、权谋、争霸、种田、大明 / 大唐 / 三国等。\r\n7. 科幻末世、机甲、星际、赛博朋克、无限流、末日求生。\r\n8. 悬疑 / 灵异 / 恐怖推理、破案、惊悚、鬼怪、盗墓、无限流、规则怪谈。\r\n9. 游戏 / 电竞网游、虚拟网游、电竞、吃鸡、英雄联盟、DNF、原神等。\r\n10. 二次元 / 轻小说动漫同人、综漫、系统、搞笑、日常、异世界转生。\r\n\r\n\r\n\r\n\r\n帮我写一篇网文小说，虐恋类别，以第一人称叙述，字数要求3000字，\r\n1、两大核心节奏\r\n1. 情节节奏（快 / 慢）\r\n- 快节奏：冲突、打斗、反转、危机、高潮、解谜写法：短段落、多对话、少描写、多动作\r\n不需要有过多的慢节奏：铺垫剧情、人物塑造、分支剧情，可以有适当的氛围内容、部分情感、世界观写法：长句、环境、心理、细节、留白\r\n\r\n一、核心剧情主线模板\r\n缘起：凡尘入世，身负天命主角多为凡人身世，或有仙缘血脉、上古传承，因一场劫难、奇遇、宿命指引踏入仙途。常见设定：孤儿、山村少年、没落仙门后裔、转世仙尊 / 魔神。\r\n筑基：入山门，斩心魔，辨正邪拜师学艺、修炼基础功法、通过宗门试炼；初期冲突：同门竞争、妖兽作乱、小门派恩怨，主角在善恶间立心。\r\n入世：红尘炼心，历劫悟道下山历练、寻找法宝 / 灵药 / 秘境；关键剧情：结识道侣、遇见宿敌、卷入仙门纷争、触碰上古秘辛。古典仙侠强调 “不历凡尘，不成大道”，情爱、仇恨、取舍都是修行。\r\n纷争：仙魔大战，道统之争魔界入侵、妖族祸乱、上古邪神苏醒；宗门立场对立，正道并非全善，魔道亦有真情，探讨 “何为正，何为魔”。\r\n证道：逆天改命 / 顺天应劫，登临巅峰渡过天劫、破碎虚空、飞升仙界；或选择守护三界，不入轮回，成就地仙 / 散仙 / 守护者。\r\n二、经典剧情内核（古典仙侠灵魂）\r\n天道至上，规则森严\r\n修行不可逆天道、不可滥杀无辜、不可强夺气运，违者必遭天谴。\r\n因果循环，报应不爽\r\n前世恩怨、今生救赎、欠下的情与债，都会成为剧情关键转折。\r\n情劫为大劫\r\n师徒、道侣、亲情、苍生大义之间的抉择，是古典仙侠最催泪的核心。\r\n求长生，更求本心\r\n最终不是为了无敌天下，而是为了守住道心、守护在意之人，或超脱生死。\r\n三、常见剧情套路与反转\r\n看似正道领袖，实为伪君子；\r\n看似魔头反派，实则守护苍生；\r\n主角的奇遇，是上古大能的布局；\r\n最强敌人，是主角自己的心魔。\r\n四、代表作品剧情风格\r\n《仙剑奇侠传》：宿命轮回，苍生与情爱两难全；\r\n《诛仙》：正魔殊途，一念成仙一念成魔；\r\n《蜀山剑侠传》：正统仙门体系，法宝飞剑，历劫飞升；\r\n《三生三世》：仙神轮回，爱恨纠缠，天命难违。\r\n\r\n\r\n一定要有立刻能用的节奏技巧\r\n- 每章：开头抓眼，中间推进，结尾留钩\r\n- 对话多 = 节奏快；描写多 = 节奏慢\r\n- 高潮前先压到最低，再反弹最爽\r\n- 避免：连续解释设定、重复内心戏"},{"n":"小说改剧本（升级版）.txt","size":"5KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%B0%8F%E8%AF%B4%E6%94%B9%E5%89%A7%E6%9C%AC%EF%BC%88%E5%8D%87%E7%BA%A7%E7%89%88%EF%BC%89.txt","ext":"txt","text":"小说改S级AI真人短剧剧本（不要写成分镜，不要做成表格）\r\n核心指令：你是顶级S级AI短剧改写专家，唯一任务是将小说原文，改写为真人短剧的剧本，适配抖音、快手等短视频平台，符合S级短剧爆款标准，全程围绕“强冲突、快节奏、高质感、易生成”核心，严禁写成推文解说文案。\r\n一、前置指令\r\n1. 核心要素提炼：读取小说原文，提炼该章节内的场景和核心人设，标注身份、性格、核心小冲突（贴合全书主线，不脱离整体剧情）、核心亮点，剔除与该章节无关的全书背景、支线内容。\r\n2. 基础参数规范：单集时长控制在1-3分钟，对应章节内容拆分适配（每2个章节拆分1集，或单个章节拆分1集，贴合章节剧情密度）；每1000字原文（单集）。\r\n3. AI适配要求：规避AI难以生成的内容（大规模群戏、复杂实景特效、冗长心理描写）；台词口语化、短平快（单句不超过15字）。\r\n4. 节奏硬性要求：每15-20秒设置1个小冲突，每30秒设置1个中冲突，每集结尾设置1个大钩子；每集严格遵循“3秒抓眼，开篇+高能密集剧情+钩子结尾”，无废话、全高能。\r\n二、AI操作指令\r\n“请阅读小说原文，完成3件事：1. 提炼该章节内的核心人设，标注身份、性格；2. 提炼该章节内的核心小冲突（贴合全书主线，不脱离整体剧情）；3. 提炼该章节的核心亮点，输出简洁总结，适配S级AI短剧改写需求。”\r\n\r\n【二十大金刚公式库（参考，适配章节改写）】\r\n1. 经典反转钩：以“我怎么也没想到”起手，（重生、真相揭露类，适配章节内的反转剧情）；2. 极致反差钩：[该章节内的卑微身份] + [逆天行为/结果] + （身份错位、扮猪吃虎类，适配章节内冲突）；3. 结局先行钩：[该章节内的最惨/最燃瞬间] + [倒叙原因] + 慢动作（虐文、复仇类，贴合章节剧情）；4. 猎奇悬疑钩：展示该章节内的诡异、非人的视觉画面+特写（惊悚、灵异类）；5. 夸张反常钩：用该章节内违背常理的行为+情绪特写（亲情虐文、系统文类）；6. 荒诞现实钩：该章节内的不合理逻辑冲突+近景（现实、反转类）；7. 人性抉择钩：该章节内的极致爱恨置换+面部特写（虐恋、道德困境类）；8. 身份错位钩：[该章节内的强弱反转] + 切换（马甲文、隐藏大佬类）；9. 悬疑前置钩：开篇抛该章节内的高能悬念+生理刺激+情感暴击+快速切换（悬疑、刑侦类）；10. 系统降临钩：[该章节内的普通身份] + [突然绑定逆天系统] + 系统提示音（系统流、金手指类）；11. 数字反差钩：[该章节内的具体数字] + [极端结果/反常识结论] + 特写（职场、技能开挂类）；12. 身份置换钩：[该章节内的强势身份] + [被迫进入的卑微处境] + 转场（身份互换、穿越类）；13. 废柴退婚钩：[该章节内的天才陨落]+[当众羞辱]+[暗藏逆袭金手指] + 全景+特写结合（玄幻、打脸类）；14. 宅斗觉醒钩：[该章节内的庶女/嫡女]+[遭陷害]+[反杀名场面] + 动作特写（古言宅斗类）；15. 穿越绝境钩：[睁眼]+[该章节内的生死绝境]+[急智破局] （穿越、权谋类）；16. 觉醒系统钩：[该章节内的卑微处境]+[系统激活]+[揭露残酷真相] + 系统+面部特写（系统、爽文类）；17. 灵宠反套路钩：[该章节内的废灵宠]+[全宗嘲笑]+[实为上古神兽] + 切换（御兽流类）；18. 修炼打脸钩：[该章节内的修炼废物]+[时间节点]+[碾压强者归来] + 全景（玄幻、学院流类）；19. 至尊骨钩：[该章节内的天生至尊骨]+[被挖走]+[涅槃重生] + 特写（玄幻、复仇类）；20. 龙袍加身钩：[该章节内的被囚禁/羞辱]+[龙袍加身]+[身份曝光] + 全景+特写结合（宫廷、马甲类）。\r\n【删减原则（S级标准，适配章节改写）】\r\n必须删除的内容：1. 该章节内冗余的心理描写（转化为表情/动作）；2. 该章节内无意义的过渡句；3. 与该章节无关的全书背景、支线剧情。\r\n必须保留并重点刻画的内容：1. 该章节内的关键对话（推动剧情转折、触发冲突、揭露真相）；2. 该章节内的关键动作（人物决定性行为，搭配特写）；3. 该章节内的决定性神态（暴露人物真实意图，如“眼神冰冷”“嘴角冷笑”）；4. 该章节内的核心冲突场面（打斗、对峙、揭露真相，增加细节）；5. 钩子信息（引发后续剧情的悬念点，贴合全书主线）。"},{"n":"故事改分镜.txt","size":"6KB","path":"prompt-files/%E5%88%86%E9%95%9C%E5%89%A7%E6%9C%AC%E6%8F%90%E7%A4%BA%E8%AF%8D/%E6%95%85%E4%BA%8B%E6%94%B9%E5%88%86%E9%95%9C.txt","ext":"txt","text":"{\r\n  \"template_name\": \"短剧故事转分镜+Mininax H3视频提示词一体化模板\",\r\n  \"version\": \"4.0\",\r\n  \"description\": \"完整保留原版3.0七维静态分镜提示词体系，配套即梦Mininax H3官方标准动态视频提示词；优先保障剧本故事完整流畅，自然拆分镜，前置三重叙事审查，兼顾静态分镜绘图、动态短片生成双用途\",\r\n  \r\n  \"system_prompt\": \"你是专业影视短剧导演+AI分镜师+Mininax H3官方提示词工程师。第一准则：100%忠于用户提供短剧剧本或小说章节，所有镜头剧情、动作、台词、场景不得私自增删篡改，优先保证叙事连贯流畅，不强行切割固定时长破坏故事；\\n1. 每一格分镜输出两套内容：①原版规范7维度静态分镜绘图提示词；②配套可直接复制到Mininax H3五段式动态视频提示词；\\n2. 输出前完成整体三重审查：故事连贯性、镜头创意设计、短视频爆款逻辑、；\\n3. 运镜、光影、构图全部使用专业量化影视术语，拒绝模糊描述；\\\\n4. 动态提示词标注单镜头适配时长、字幕时间码、配音对白、环境音效，末尾统一附带全片负面提示词。\",\r\n  \r\n  \"input\": \"{{改编好的完整短剧剧本}}\",\r\n  \r\n  \"output_schema\": {\r\n    \"整体审查\": {\r\n      \"故事连贯性\": \"校验全部分镜动作延续、情绪递进、场景空间逻辑，无断层填写「连贯」；存在剧情割裂、镜头跳脱则写明问题与优化调整方案\",\r\n      \"创意设计\": \"一句话概括整套分镜核心视觉巧思：贯穿叙事道具、光影跟随情绪渐变、构图强弱对比、创意转场运镜等记忆点\",\r\n      \"爆款逻辑\": \"一句话拆解吸睛逻辑：前3镜开篇钩子、中段情绪爆发高光镜头、结尾留白悬念/情绪落点，说明留存观众的设计\"\r\n    },\r\n    \"全局统一锁定锚点（全分镜通用）\": {\r\n      \"场景&光影基底\": \"全片固定场地、天气、统一基础光源色调、环境氛围规则\",\r\n      \"基础画质标准\": \"画幅(9:16竖短剧/16:9电影宽屏)、统一美术风格、8K超清基础规格\"\r\n    },\r\n    \"分镜列表\": [\r\n      {\r\n        \"序号\": 数字,\r\n        \"分镜描述\": \"一句话精准概括本镜头对应剧本核心画面内容\",\r\n        \"叙事功能\": \"钩子/铺垫/冲突转折/情绪爆发/伏笔回收/结尾悬念\",\r\n        \"单镜适配视频时长\": \"X-Xs（单镜头时长不得超过15秒）\",\r\n        \"【静态分镜图7维度提示词】\": \"[画面构图：构图方式，景别，运镜，景深] [角色：出场人物，完整动作姿态] [人物空间与互动关系：人物位置、间距、彼此朝向/对峙/依偎] [极具体的微表情与面部特写：眼神、泪痕、嘴唇状态等细节] [明确的场景环境元素与前景/背景道具：分层写明前景遮挡、中景主体、背景陈设、叙事关键道具] [光影几何与大气效果：光源方向、软硬光线、阴影层次、雨/雾/微尘/雷电等环境粒子氛围] [视觉风格/胶片质感：整体冷暖色调、胶片颗粒、美术画风] [技术参数：比如电影机相机red、阿莱电影机或者是纪实风格的手机，镜头焦段，光圈值，拍摄设备]\",\r\n        \"【Mininax H3官方动态视频提示词（模板）】\": {\r\n          \"主体与角色\":锁定全局锚点人物参考图，图 1 是“苏叶”；图 2 是“陈默”；图 3是“天台”场景参考\",\r\n          \"风格合约\"：\"影视美术风格、色调、胶片质感、焦段、光圈、摄影机、景深参数\",\r\n           时间线：[0s-4s][4s-8s][8s-12s][12s-15s]画面构图、完整且详细的人物动作、面部的微表情变化、空间站位关系、台词（人物说话前的台词必须是以冒号标注）；\r\n          \"环境\": 天气、大气粒子、统一光影明暗体系\",\r\n          \"镜头运镜\": \"景别+机位角度+完整运镜调度\",\r\n           标注节奏：静铺垫/动态爆发/舒缓收尾\r\n          \"音频\": \"环境和音效、背景音乐描述\",\r\n          \"负面提示词：不要字幕，不要水印，不要面部漂移，不要口型错位。\"\r\n        }\r\n      }\r\n    ],\r\n    \"全片通用负面提示词（所有分镜统一携带）\": \"画面模糊、人物五官扭曲、肢体畸形、多余手指、手脚崩坏、文字水印、无关西式建筑、廉价闪光特效、色彩过曝、画面闪烁、无意义剧烈镜头抖动、塑料廉价服装材质、画面裁切不全、人脸换脸失真、人物服装随机变更、剧本不存在的多余路人/道具\"\r\n  },\r\n  \r\n  \"维度说明\": {\r\n    \"静态7维度拆解\": {\r\n      \"画面构图\": \"构图形式(对称/荷兰角/过肩/框架前景/仰拍/俯拍)+景别(远景/全景/中景/近景/特写/大特写)+运镜(固定/慢推/急推/缓拉/环绕/升降/手持跟拍/POV主观)+景深(深景深/浅景深)\",\r\n      \"角色\": \"出场人物身份、完整全身动态动作，贴合剧本行为\",\r\n      \"人物空间与互动关系\": \"人物横向/纵向距离、相对朝向、对峙/背对/依偎遮挡关系\",\r\n      \"微表情与面部特写\": \"具象情绪细节，禁止笼统“伤心、愤怒”，细化泪痕、颤抖睫毛、紧绷下颌、瞳孔收缩等\",\r\n      \"场景环境元素与道具\": \"分层区分前景、中景、背景，标注承载剧情的关键叙事道具\",\r\n      \"光影几何与大气效果\": \"侧逆光/顶光/底光/黄昏柔光等光源，硬光/柔光，长阴影/轮廓光，雨雾、雷电、漂浮尘埃、飘落花瓣等氛围特效\",\r\n      \"视觉风格与技术参数\": \"古风武侠/韩式爱情/赛博朋克/日系漫剧等画风、冷暖主色调；焦段14mm广角/35mm标准/85mm长焦；光圈f1.4/f4/f8；设备ARRI电影机/无人机/复古胶片相机；60fps/120fps慢动作\"\r\n    },\r\n    \"不可调换模块顺序，人物、场景、色调与全局锚点保持统一，动态运镜与静态分镜逻辑匹配\"\r\n  },\r\n  \r\n  \"审查硬性要求\": {\r\n    \"连贯性\": \"分镜严格跟随剧本顺序，上一镜动作自然延续至下一镜，情绪循序渐进，场景空间不出现逻辑跳脱、环境突变\",\r\n    \"创意\": \"拒绝流水账平铺直叙，整套分镜至少拥有一处统一视觉叙事设计（道具贯穿/光影渐变/构图对比/特殊转场）\",\r\n    \"爆款逻辑\": \"前3个镜头设置强视觉钩子，中段安排1处情绪爆发高光分镜，最后一个镜头设置留白悬念或情绪落点，提升短剧完播与追更\"\r\n  }\r\n}"},{"n":"场景全景图.txt","size":"298B","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%9C%BA%E6%99%AF%E5%85%A8%E6%99%AF%E5%9B%BE.txt","ext":"txt","text":"以参考场景为基础保持建筑结构、门窗位置、家具摆放、材质、色调和光线方向不变，不重新设计场景。将镜头切换为左前方45°视角，展示问一空间的不同角度，透视准确，空间关系一致，物品位置对应正确，画面风格统一。"},{"n":"场景四视图.txt","size":"2KB","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%9C%BA%E6%99%AF%E5%9B%9B%E8%A7%86%E5%9B%BE.txt","ext":"txt","text":"16:9横向画面，左右构图，左右区域各占50%，影视短剧场景一致性参考图，无人物，无角色，无人形剪影，纯真实场景展示，通用室内外环境。左侧为真实实拍风格的主视图，右侧为四宫格真实实拍风格参考图，所有视图必须是同一个场景、同一空间、同一建筑结构、同一道具位置、同一光线方向、同一色彩氛围，仅摄像机位置和朝向不同。\r\n\r\n左侧【主视图】：\r\n占画面左侧50%，真实实拍风格，完整场景全景平视机位，清晰展示环境主体、空间边界、建筑结构、地形特征、道具陈设、光源方向和整体氛围。主视图是右侧所有视图的统一参考基准。\r\n\r\n右侧【四视图参考区】：\r\n占画面右侧50%，四宫格布局，四个独立小图，全部为真实实拍风格：\r\n视图1【正面机位】：与主视图机位一致，复核场景布局、建筑结构和道具位置。\r\n视图2【侧斜机位】：同一场景侧方45度视角，展示空间侧面、环境纵深、建筑边缘和道具相对位置。\r\n视图3【反打机位】：同一场景反向拍摄视角，摄像机朝向与正面机位完全相反，展示同一空间的另一面。反打机位必须是同源场景的反向视角，不是重新生成的新场景，建筑、地形、道具、光线和主视图保持一致。\r\n视图4【俯视布局图】：同一空间的鸟瞰俯视图，真实航拍视角，清晰展示地形边界、建筑位置、道具摆放、摄像机点位和拍摄方向箭头。\r\n\r\n统一风格：\r\n真实实拍风格，电影级摄影质感，自然光影，真实材质，真实空间比例，透视准确，色彩统一，画面干净，视图之间边界清晰，不合并，不重叠，**画面内不出现任何中文、英文标注文字、标签**。\r\n"},{"n":"场景提取.txt","size":"2KB","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%9C%BA%E6%99%AF%E6%8F%90%E5%8F%96.txt","ext":"txt","text":"#Role:电影级纯净场景设计专家（高辨识度版）\r\n##核心执行逻辑（后台规则）：\r\n1.**绝对真空与匿名**：画面中严禁出现任何人影，场景描述文字中严禁出现任何角色人名。\r\n2.**场景命名法则**：每个场景名称必须在【四个字以上】，通过具体的修饰词增加辨识度（严禁使用单一名词）。\r\n3.*四大核心要素**：场景描述必须完整涵盖：【环境类型】、【具体时间】、【空间氛围】、【视觉主要特征】。\r\n4. **Prompt开头**：所有Prompt必须以“不能出现其他人，无人，纯场景,”开头。\r\n5.**输出控制**：严禁输出任何括号内的说明文字，直接输出具体内容。\r\n## 第一步：场景提取清单\r\n（按顺序编号列出文案中的所有地点：场景全称|核心氛围|建议色调）\r\n##第二步：专业场景设定表（按此格式逐一输出）\r\n**场景名称**：[四个字以上的独特命名]\r\nI\r\n**画幅构图**：横向16:9电影级场景设定图，极高画质，纯净无人的空间。\r\n**视觉风格**：【填入用户指定风格】，极致细节。\r\n**场景描述**：\r\n-【环境类型】：[俱体的地理/建筑空间属性]\r\n-【时间时刻】：[精确到时段的天气与光线状态]\r\n-【空间氛围】：[如：压抑、神圣、破败、宁静等视觉情绪描述]\r\n-【主要特征】：[具体的材质、核心物件、前中后景的标志性元素，严禁提及角色姓名]\r\n*Prompt（直接复制)**：不能出现其他人，无人，纯场景，[将上述所有环境细节融合成一段精简、极具冲击力的生图描述\r\n词，包含：no humans, empty, landscape only]\r\n指令已确认。请告知我您的【风格要求】与【文案】，我将为您生成纯净且具有唯一性的场景设定。"},{"n":"道具提取.txt","size":"1KB","path":"prompt-files/%E5%9C%BA%E6%99%AF%E9%81%93%E5%85%B7%E6%8F%90%E7%A4%BA%E8%AF%8D/%E9%81%93%E5%85%B7%E6%8F%90%E5%8F%96.txt","ext":"txt","text":"请从我提供的完整剧本中，严格按照以下规则提取核心叙事道具，禁止提取普通家具、杂物、无关陈设摆件：\r\n提取标准：仅提取【体现角色个性人设、有象征意义、推动剧情反转/伏笔/爽点、贯穿全剧的核心剧情道具】\r\n\r\n提取完成后，按以下固定格式输出，每一项必须完整填写：\r\n1.道具分类：【人设象征道具 / 剧情推动道具 / 世界观象征道具】\r\n2.道具名称：\r\n3.剧本原始描述：直接摘抄剧本原文对道具的描述\r\n4.史实年代优化：结合场景年代、历史客观事实，优化道具形制，修正穿越、不合理、不符合时代的错误设计\r\n5.最终规范外形细节：材质、颜色、纹路、磨损、尺寸、标志性识别特征（必须唯一辨识度，防止前后不一致）\r\n6.人设象征意义：道具对应角色性格、身份、立场\r\n7.剧情核心作用：道具在伏笔、反转、爽点、剧情推进中的具体作用\r\n8.全剧一致性要求：本道具全剧外形、纹路、特征完全固定不变，禁止外形修改、禁止凭空消失、禁止凭空新增\r\n9.垫图生成专用提示词：直接生成可用于垫图参考的完整道具生成提示词，联动人物角色卡画风、场景四视图年代建筑精细度\r\n\r\n输出要求：语言专业简洁，不废话；道具前后视觉统一，避免观众识别混乱跳戏、无法理解剧情、产生观看抵触心理。"},{"n":"人物角色板（展示板）.txt","size":"3KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E4%BA%BA%E7%89%A9%E8%A7%92%E8%89%B2%E6%9D%BF%EF%BC%88%E5%B1%95%E7%A4%BA%E6%9D%BF%EF%BC%89.txt","ext":"txt","text":"\r\n创作一张具有艺术感的 16:9 角色形象展示板（Character Identity Board）。\r\n\r\n[主体]：使用参考图。\r\n视觉风格：风格化的动画绘画质感（Stylized anime-painterly）。\r\n\r\n背景：纯白或柔和的米白色。\r\n无环境背景，无标志（Logo），无水印。\r\n\r\n设计方向：\r\n不要制作标准的角色三视图/参考图。\r\n创作一张具有电影感的形象展示板，风格融合高端动画工作室的角色研究图与精美画集的排版布局。\r\n\r\n布局应采用非对称设计，既优雅又令人印象深刻。\r\n利用大面积留白、变化的图像尺寸和刻意营造的不平衡感。\r\n避免使用网格线、蓝图设计、目录式排版或重复的转向展示（turnaround）。\r\n\r\n重要布局规则：\r\n角色图像之间不得重叠。\r\n每个视图必须保持清晰的间隔和呼吸感。\r\n确保全身像、肖像、剪影和细节特写在视觉上界限分明。\r\n严禁出现面部被裁切、肢体被遮挡、人物堆叠或姿势重合的情况。\r\n\r\n主体构图：\r\n将一张大型的主体全身像（Hero shot）放置在略微偏离中心的位置，作为视觉重心。\r\n\r\n在其周围，以整洁的间距排列较小的辅助研究图：\r\n中性站姿全身像、\r\n背面视图、\r\n侧面视图、\r\n坐姿、\r\n倚靠姿势、\r\n蹲姿、\r\n俯视角度全身像、\r\n仰视角度全身像、\r\n富有表现力的肖像特写。\r\n\r\n每个视图应呈现为独立、清晰的角色研究画面，而非单一场景中的某一帧。\r\n\r\n形象一致性：\r\n确保所有视图中的角色形象保持严格一致：\r\n相同的面容、\r\n相同的面部比例、\r\n相同的发型、\r\n相同的服装、\r\n相同的身体比例、\r\n相同的体态语言、\r\n相同的视觉个性。\r\n\r\n有用的参考细节：\r\n确保角色特征清晰，便于后续生成图像和视频：\r\n清晰的脸型、\r\n清晰的发型轮廓、\r\n清晰的服装轮廓、\r\n清晰的体型、\r\n清晰的手部细节、\r\n清晰的姿势、\r\n清晰的表情范围。\r\n\r\n艺术化板块：\r\n包含一个小型的剪影研究区，展示 2-3 个简化的黑色角色剪影。\r\n包含一个小型的表情研究区，展示细微的情绪变化。\r\n包含一个小型的细节研究区，展示面部、发型和服装的关键视觉特征。文字设计：\r\n添加一个风格时尚的“角色身份标识”板块。\r\n设计需保持极简、醒目且具有艺术感。\r\n仅包含以下内容：\r\n姓名\r\n角色定位\r\n核心情绪基调\r\n视觉特征标识\r\n\r\n仅在必要时使用手写风格的小标签。\r\n可使用精致的指示箭头或标注符号，但须保持极简与优雅。\r\n\r\n风格：\r\n极简、\r\n电影感、\r\n高端、\r\n艺术画册风格、\r\n清爽、\r\n富有表现力、\r\n具备实际制作参考价值。\r\n\r\n最终图像应呈现为一张艺术化的角色身份展示板，旨在辅助AI模型理解该角色的面部特征、轮廓剪影、服装造型、体态姿势及情绪表现范围。"},{"n":"叙事分镜故事版.txt","size":"3KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E5%8F%99%E4%BA%8B%E5%88%86%E9%95%9C%E6%95%85%E4%BA%8B%E7%89%88.txt","ext":"txt","text":"[任务]\r\n1. 请帮我根据下方故事，生成一张手绘风格分镜稿，角色：姜宁（@图片1）、陆珩（@图片2）\r\n2. 该手绘风格分镜稿使用2X2的布局模式，每行2张，共2行，使用脸部留白带十字定位辅助线效\r\n\r\n[要求]\r\n1. 铅笔单线条线稿（脸部留白带十字定位辅助线）风格，不追求精细光影和色彩，重点突出角色动作与镜头节奏，请注意，侧面、半侧面的人脸也要使用脸部留白带十字定位辅助线的风格，请勿展示人物五官\r\n2. 每个镜头都标注镜头类型（如特写、中景、推镜）、表演提示、音效说明\r\n3. 画面中需用不同颜色的箭头来标注引导线\r\n- 红色：机位运动/构图\r\n- 蓝色：角色动作轨迹\r\n- 绿色：互动关系/攻击轨迹\r\n- 橙色：效果/冲击力\r\n- 紫色：音效/标注引导\r\n\r\n[故事内容]\r\n姜宁在拥挤的食堂端着餐盘，口袋里的笔掉在地上，旁边的陆珩弯腰捡起递给她，两人短暂对视后各自离开。\r\n\r\n[分镜镜头详情]（此处粘贴具体内容）\r\n第一行 第1镜\r\n- 镜头类型：中景，广角仰拍\r\n- 场景：喧嚣的大学食堂，人头攒动\r\n- 表演提示：姜宁双手端着餐盘，在队伍中艰难侧身往前走，努力保持餐盘平衡\r\n- 音效说明：人群的嘈杂声，碗筷碰撞的叮当声\r\n\r\n第一行 第2镜\r\n- 镜头类型：特写，低角度\r\n- 场景：地面瓷砖\r\n- 表演提示：一支笔从姜宁的外套口袋里滑落，掉在地面弹跳了一下\r\n- 音效说明：塑胶笔掉落在地面的“啪嗒”声\r\n\r\n第一行 第3镜\r\n- 镜头类型：特写，切入\r\n- 场景：姜宁的脚边\r\n- 表演提示：一只手（陆珩的）从画面右侧伸入，快准稳地将笔捡了起来\r\n- 音效说明：手指捡起笔的轻微摩擦声\r\n\r\n第二行 第4镜\r\n- 镜头类型：近景，正反打（姜宁的侧面）\r\n- 场景：食堂过道\r\n- 表演提示：陆珩站直身体，将笔递到姜宁面前，姜宁低头看向笔，露出意外的神色\r\n- 音效说明：食堂广播的提示音\r\n\r\n第二行 第5镜\r\n- 镜头类型：近景，推镜（陆珩的侧面）\r\n- 场景：食堂过道\r\n- 表演提示：姜宁点头致谢，接过笔，陆珩也礼貌地微笑了一下，眼神短暂交汇\r\n- 音效说明：细微的笑声，衣料摩擦声\r\n\r\n第二行 第6镜\r\n- 镜头类型：中景，拉远\r\n- 场景：食堂过道\r\n- 表演提示：两人端着各自的餐盘，一左一右朝着不同的方向走去，各自汇入人流\r\n- 音效说明：人群噪声再次被放大，吃饭的喧闹声\r\n\r\n4. 上述镜头完整串联起一场完整桥段，通过镜头切换和动作衔接构建出流畅的动作逻辑。\r\n"},{"n":"激烈追逐度分镜故事板.txt","size":"3KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E6%BF%80%E7%83%88%E8%BF%BD%E9%80%90%E5%BA%A6%E5%88%86%E9%95%9C%E6%95%85%E4%BA%8B%E6%9D%BF.txt","ext":"txt","text":"激烈追逐度分镜故事板\r\n\r\n[任务]\r\n请帮我生成一张未来都市街头，两名骑手驾驶高速机车激烈追逐交火的手绘风格分镜稿\r\n\r\n[画面风格]\r\n1. 画面布局：该手绘风格分镜稿使用4X3的布局模式，每行4张，共3行\r\n2. 画风线条：铅笔手绘草稿速写风，少量彩色手绘线条\r\n3. 人物设定：重点突出高速机动与火力压制，表现机车漂移、穿越车流、空中飞越等大动态动作\r\n\r\n[要求]\r\n1. 用快速、有力的铅笔线条勾勒，不追求精细光影和色彩，重点突出角色动作张力与镜头节奏，能高效传递高速追击战的紧张感\r\n2. 每个镜头都标注镜头类型（如超低角度甩拍、航拍跟随、肩扛近景）、表演提示、音效说明\r\n3. 画面中需用不同颜色的箭头来标注引导线\r\n- 红色：机位运动/构图\r\n- 蓝色：角色动作轨迹\r\n- 绿色：互动关系/攻击轨迹\r\n- 橙色：效果/冲击力\r\n- 紫色：音效/标注引导\r\n4. 以下12个镜头完整串联起一场都市街头机车激烈追逐的完整桥段，通过镜头切换和动作衔接构建出流畅的飙车动作逻辑\r\n\r\n[分镜镜头详情]（此处粘贴具体内容）\r\nP01 / 航拍俯冲广角：城市高架桥匝道，两辆重机车从高处极限压弯俯冲而下，冲入底部车流。引擎爆裂的轰鸣声，轮胎碾过路面的摩擦声\r\nP02 / 超低角度侧拍：后车紧逼前车，距离不足一米，后车骑手压低重心蓄势待发。风声呼啸，皮衣在风中猎猎作响\r\nP03 / 肩扛跟拍：后车骑手单手脱把，从腰间快速拔出手枪，准备瞄准。枪械金属摩擦声，子弹上膛的清脆咔嚓声\r\nP04 / 极低角度正后方：前车骑手从后视镜察觉危险，猛捏前刹、死拧油门，机车车头高高翘起，险险避开子弹。震耳欲聋的枪声，轮胎剧烈摩擦地面的嘶叫声\r\nP05 / 中景推镜：前车借路边厢式货车作掩体，侧身从背后拔枪回击。清脆的回击枪声，子弹击中货车金属厢体的叮当声\r\nP06 / 广角动感平拍：两车钻入高架桥底，剧烈明暗交替的光影划过骑手全身。引擎声在桥洞中产生强烈回响\r\nP07 / 手持剧烈晃动：后车为躲避子弹，猛向右打方向，冲出路基，驶入废弃铁轨旁的石子路。后轮打滑声，碎石被弹飞的噼啪声\r\nP08 / 航拍跟随：前车紧随其后冲入铁轨，两车在乱石与废弃轨道上进行极限颠簸操控。避震器剧烈压缩的嘎吱声\r\nP09 / 地面超广角：铁轨尽头横亘一条运河，前方是死路，但前车没有丝毫减速。引擎的极限运转声\r\nP10 / 慢动作特写：前车骑手找准角度，机车冲上一块废弃混凝土斜坡，整个车身凌空腾起。引擎拉满转速的尖锐咆哮声\r\nP11 / 航拍侧转：机车在空中华丽飞跃运河，精准落在对岸硬化路面。沉重落地声，前避震极限压缩的沉闷声\r\nP12 / 航拍拉远全景：后车在运河对岸猛刹停下，轮胎留下一道长长黑印，只能目送前车尾灯消失在夜色深处。逐渐弱化的引擎回火声，夜风吹拂的沙沙声"},{"n":"白模故事板.txt","size":"2KB","path":"prompt-files/%E6%95%85%E4%BA%8B%E7%89%88%E6%8F%90%E7%A4%BA%E8%AF%8D/%E7%99%BD%E6%A8%A1%E6%95%85%E4%BA%8B%E6%9D%BF.txt","ext":"txt","text":"故事=白模故事板\r\n\r\n[标题]\r\n制作分镜板页眉：采用适配场景风格的排版、细分割线及清晰的层级结构；图形元素置于分镜格之外。\r\n仅包含以下两行引号内的文字，不得添加其他页眉文本：“[主标题]”、“[副标题]”\r\n\r\n[分镜结构]\r\n精确网格：4列×3行，按P##顺序从左至右、从上至下填充，每格统一16:9横向矩形。\r\n分镜格标题格式：`P## / 镜头标签 / 动作节点名`。\r\n\r\n[视觉风格]\r\n明亮的黏土模型风格 3D 预演画面：采用哑光浅黏土质感的无纹理体块模型，仅使用柔和白与浅暖灰，背景明亮。高调视口光照，柔和阴影，温和的环境光遮蔽。画面虽未精细渲染，但空间关系确凿，明确标示了姿态、接触点、方向及结果。角色为无面部特征的空白人体模型；无面部细节或特定人物肖像特征。特效仅用中性符号：拖尾、爆发光效、尘埃环、擦痕、冲击波、气势轮廓。无插画风格、照片级写实、高饱和色彩、精细纹理或精修特效。角色外观由参考图唯一决定。\r\n\r\n[参考]\r\n提供角色A、角色B的剪影或设定图作为外观唯一依据。本模板不限定具体特征，请自行替换。\r\n\r\n[连贯性]\r\n两角色、场景元素、朝向及空间布局全篇一致。每格为定格瞬间，每个角色仅一种姿态。\r\n主攻方向与对手方向可自定义，保持轴线连续。\r\n\r\n[文本规则]\r\n可见文字仅限页眉两行标题及分镜格标题。分镜格内部绝无任何文字、标签、箭头、图标、注释、叠层、插图、底色、重复形象等。\r\n\r\n[动作节点]\r\n按P01-P12顺序自定义每格内容（替换方括号）：  \r\nP01 / [镜头规格] / [动作名]：[画面描述]  \r\nP02 / [镜头规格] / [动作名]：[画面描述]  "},{"n":"书单号爆款文案指令.docx","size":"14KB","path":"prompt-files/%E7%9F%AD%E8%A7%86%E9%A2%91%E6%8F%90%E7%A4%BA%E8%AF%8D/%E4%B9%A6%E5%8D%95%E5     <div class="assets-title">📦 单文件素材</div>
    <div class="files">
      ${DATA.singles.map(f => `
        <div class="file" onclick="openFile(${f.i})">
          <div class="fi"><span class="ico">${f.ext==='txt'?'📄':f.ext==='docx'?'📘':f.ext==='7z'||f.ext==='rar'||f.ext==='zip'?'🗜':'🗂'}</span><span class="nm">${esc(f.name)}</span></div>
          <div class="fm"><span>${f.size}</span>${f.text?'<span class="t">可预览</span>':''}</div>
        </div>
      `).join('')}
    </div>
  </section>` : '');

let cur = null;
function openFile(i) {
  const f = ALL[i];
  if (!f) return;
  cur = f;
  document.getElementById('mHead').innerHTML = '<span class="m-ico">' + (f.text?'📄':'🗂') + '</span><h2>' + esc(f.n) + '</h2><span class="m-size">' + f.size + '</span>';
  const body = document.getElementById('mBody');
  if (f.text) {
    body.innerHTML = '<div class="pre">' + esc(f.text) + '</div>';
  } else {
    body.innerHTML = '<div class="no-preview">📎 该文件为 ' + esc(f.ext.toUpperCase()) + ' 格式，请下载后查看。</div>';
  }
  document.getElementById('mFoot').innerHTML = '<button class="btn" onclick="download()">⬇ 下载文件</button><button class="btn btn-ghost" onclick="closeModal()">关闭</button>';
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function download() { if (cur) { const a=document.createElement('a'); a.href=cur.path; a.download=cur.n; a.click(); } }
function closeModal() { document.getElementById('modal').classList.remove('active'); document.body.style.overflow=''; }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
document.getElementById('modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
